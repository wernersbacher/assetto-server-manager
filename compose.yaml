# Local test setup: runs the Docker image with the dev config and the fake Assetto Corsa install from dev/,
# so no Steam account or acServer is needed.
#
#   docker compose up --build        -> http://localhost:8772 (login: admin / admin), two servers a and b
#   docker compose down -v           -> stop and delete all data (database, results, ...)
#
# Behind a TLS-intercepting proxy, pass its root CA for the build (it is not stored in the image):
#   $env:EXTRA_CA_CERT = "C:\path\to\corporate-root.crt"; docker compose build

name: acpitwall-dev

services:
  # copies the fake AC install into the volumes of server a (assetto) and b (assetto-b) once, the server skips the
  # steamcmd install if it is present. Server b shares the content folder of a (symlink), as content is managed through a.
  seed:
    image: acpitwall:dev
    build:
      context: .
      args:
        SM_VERSION: docker-dev
      secrets:
        - ca_cert
    # root, because a new named volume is owned by root; the files are handed to the server user at the end
    user: root
    entrypoint:
      - sh
      - -c
      - >-
        [ -d assetto/system ] || cp -r /seed/. assetto/;
        [ -d assetto-b/system ] || { cp -r /seed/. assetto-b/ && rm -rf assetto-b/content assetto-b/results/* &&
        ln -s /home/assetto/acpitwall/assetto/content assetto-b/content; };
        chown -R assetto:assetto assetto assetto-b
    volumes:
      - assetto:/home/assetto/acpitwall/assetto
      - assetto-b:/home/assetto/acpitwall/assetto-b
      - ./dev/assetto-seed:/seed:ro

  acpitwall:
    image: acpitwall:dev
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "8772:8772"
    volumes:
      - data:/home/assetto/acpitwall
      - assetto:/home/assetto/acpitwall/assetto
      - assetto-b:/home/assetto/acpitwall/assetto-b
      - ./dev/config.yml:/home/assetto/acpitwall/config.yml:ro

volumes:
  # ACPitwall working directory (database, logs)
  data:
  # the (fake) Assetto Corsa installs of server a and b; a is declared as a volume by the image
  assetto:
  assetto-b:

secrets:
  ca_cert:
    file: ${EXTRA_CA_CERT:-./dev/no-extra-ca.pem}
