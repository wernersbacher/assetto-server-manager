    RaceControl:
      label: Race Control
    RaceControlCollisionReplayTime:
      help: Antal sekunder, pluginet skal vise for hver bil i Race Controls kollisionsreplay.
      label: 'Race Control: replaytid for kollisioner'
    RaceControlCollisionSpace:
      help: Den maksimale afstand i meter mellem de to positioner, Assetto Corsa-serveren
        rapporterer for den samme kollision (for at tage højde for afvigelser hos klienterne
        pga. lag). Sæt den op, hvis kollisioner rapporteres to gange.
      label: 'Race Control: kollisionsafstand'
    RaceControlCollisionTime:
      help: Det maksimale antal sekunder, Assetto Corsa-serveren har til at levere kollisionsdata
        for begge biler. Sæt den op, hvis kollisioner rapporteres to gange.
      label: 'Race Control: kollisionstid'
    RaceControlCutReplayTime:
      help: Antal sekunder, pluginet skal vise for hver bil i Race Controls cut-replay.
      label: 'Race Control: replaytid for cuts'
    RaceControlIncludePlayersNearerThan:
      help: Biler inden for denne afstand (i meter) fra bilen, der udløser Race Control-eventet,
        kommer med i replayet. 100 = 100m (fx hvis en bil kolliderer med en anden, kommer
        alle kørere inden for 100 meter med i replayet).
      label: 'Race Control: medtag spillere nærmere end'
    RaceControlLogOvertakes:
      help: Sæt til 1, hvis pluginet skal logge overhalinger og vise dem i Race Control
        (kan bruge hukommelse og fylde visningen med events, der ikke er strengt nødvendige
        for Race Control).
      label: 'Race Control: log overhalinger'
    RaceControlMaxEvents:
      help: Det maksimale antal events, Race Control skal vise.
      label: 'Race Control: maks. events'
    RaceControlOvertakeReplayTime:
      help: Antal sekunder, pluginet skal vise for hver bil i Race Controls overhalingsreplay.
      label: 'Race Control: replaytid for overhalinger'
    RaceControlPassword:
      help: Adgangskoden, som race directors skal bruge for at bedømme kollisioner via
        Web Stats-siden (skal være mindst 8 tegn, ellers deaktiveres funktionen).
      label: Race Control-adgangskode
    RaceDriverEntryFee:
      help: Hvor meget en kører skal betale for at deltage i en løbssession på serveren
        (i tusinder). 0.3 = 300€ (fx betaler kørere 300€ ved starten af hvert løb).
      label: Startgebyr for kørere
    RaceFastestLapPrize:
      help: Hvor meget en kører får for løbets hurtigste omgang (i tusinder). 0.15 = 150€.
      label: Præmie for hurtigste omgang i løbet
    RaceMassAccidentCrashTime:
      help: Tiden i sekunder, over hvilken race_mass_accident_crashed_players_percentage
        vurderes. 30 = 30s.
      label: Tid for masseuheld i løb
    RaceMassAccidentCrashedPlayersPercentage:
      help: Procentdelen af spillere, der skal være involveret i en kollision inden for
        mass_accident_crash_time, før pluginet udløser reaktionen på masseuheld (fx virtual
        safety car eller automatisk genstart). 45 = 45%.
      label: Procentdel crashede spillere ved masseuheld
    RaceMassAccidentMinCrashedPlayers:
      help: Mindste antal spillere, der skal crashe for at udløse reaktionen på masseuheld
        (fx så virtual safety car ikke kommer for tit på servere med få spillere).
      label: Min. crashede spillere ved masseuheld
    RaceMassAccidentResponse:
      FirstLap:
        label: Første omgang
      OtherLaps:
        label: Andre omgange
      fieldset: Reaktion på masseuheld i løb
    RaceMinimumPlayers:
      help: Mindste antal spillere, der kræves for at køre løb (skal være >=2, hvis du
        bruger pengesystemet). Er der ikke nok spillere, springer serveren løbssessionen
        over.
      label: Min. spillere til løb
    RacePodiumAnnouncement:
      help: Om de tre første kørere skal annonceres ved løbets slutning.
      label: Podiumannoncering
    RaceSponsorCleanGainOvertakes:
      help: Hvor mange rene overhalinger der kræves, før sponsorerne giver én belønning
        for rene positionsgevinster (fx hvis du sætter den til 5, og køreren laver 5 rene
        overhalinger, får han 1000€; ved 10 overhalinger får han 2000€ osv.)
      label: Rene overhalinger for sponsorbelønning
    RaceSponsorCleanGainReward:
      help: Hvor meget sponsorer belønner en kører, der laver 5 rene overhalinger i løbet
        (i tusinder). 1 = 1000€. Rene overhalinger er vundne positioner uden kollisioner,
        bortset fra positioner vundet på kørere, der afbryder forbindelsen under løbet.
      label: Sponsorbelønning for rene overhalinger
    RaceSponsorEntryFee:
      help: Hvor meget en sponsor betaler for at få køreren med i løbet (i tusinder).
        1.5 = 1500€ (fx bidrager dette sammen med startgebyret til den samlede præmiesum;
        jo højere, desto større udbetalinger).
      label: Sponsorgebyr pr. løb
    RaceSponsorRewardBaseLength:
      help: Antal km, der kræves for at betale det fulde sponsorgebyr (fx hvis sponsorgebyret
        er 1000€, og du sætter værdien til 35, bidrager sponsorerne i et løb på 7 omgange
        på en 5km-bane med 1000€ pr. bil; ved 14 omgange betaler de 2000€ pr. bil, så
        længere løb giver større præmier).
      label: Basislængde for sponsorbelønning
    RaceSponsorRewardBaseTime:
      help: Antal minutter, der kræves for at betale det fulde sponsorgebyr (fx hvis sponsorgebyret
        er 1000€, og du sætter værdien til 15, bidrager sponsorerne i et løb på 15 minutter
        med 1000€ pr. bil; ved 30 minutter betaler de 2000€ pr. bil, så længere løb giver
        større præmier).
      label: Basistid for sponsorbelønning
    RankSortByWinStats:
      help: Sortér ranglisten efter sejrsstatistik i stedet for penge. Ændrer du det,
        skal du nulstille databasen.
      label: Sortér rangliste efter sejre
    RelativeHotlapProtection:
      help: Ved hvilken afstand (som brøkdel af banens samlede længde) en bil på outlap
        skal få advarslen 'Lad den anden bil passere', når den er ved at blive overhalet.
        Bruges kun, hvis banelængden mangler. 1 er hele banens længde (0.008 er 8/1000
        af banens længde).
      label: Relativ hotlap-beskyttelse
    RelativeLappingProtection:
      help: Ved hvilken afstand (som brøkdel af banens samlede længde) en bil, der er
        ved at blive overhalet med en omgang, skal få advarslen 'Blåt flag'. Bruges kun,
        hvis banelængden mangler. 1 er hele banens længde (0.007 er 7/1000 af banens længde).
      label: Relativ overhalingsbeskyttelse
    ReservedSlotsAccessKey:
      help: Nøglen, som VIP-spillere skal bruge i Kissmyrank Multiplayer Launcher Mod
        for at få adgang til deres reserverede plads. Kørere med en reserveret plads skal
        skrive nøglen i inputfeltet i Kissmyrank Multiplayer Launcher Mod (ved den røde
        spørgsmålstegnsknap øverst i serverlisten), før de kan bruge pladsen. Er indstillingen
        ikke sat, er funktionen med reserverede pladser helt deaktiveret.
      label: Adgangsnøgle til reserverede pladser
    ReservedSlotsBootPlayersAtRace:
      help: Om det skal deaktiveres, at spillere smides ud for reserverede pladser under
        løbet. Pladser frigøres pr. bil nedefra i feltet (så på et fuldt felt rammer det
        mest sandsynligt spillere, der er joinet sent eller er flere omgange bagud). Sæt
        til 1, hvis du helt vil deaktivere reserverede pladser i løbssessionen. Så må
        VIP-spillere vente, til en plads bliver ledig, eller til næste session.
      label: 'Reserverede pladser: smid spillere ud i løb'
    ReservedSlotsGUIDList:
      help: Én pr. linje. En liste over GUID'er for kørere, der har en reserveret plads
        på serveren (kræver Kissmyrank Multiplayer Launcher Mod). Er serveren fuld, og
        en af disse GUID'er prøver at joine, bliver en spiller kicket for at gøre plads.
      label: GUID-liste for reserverede pladser
    ReverseGear:
      fieldset: Bakgear
    ReverseGearMaxDistance:
      help: Den maksimale distance i meter, en kører må bakke på banen (0 deaktiverer
        straffen).
      label: Maks. distance i bakgear
    RightToBeForgottenChatCommand:
      help: Om chatkommandoen 'kmr erase_personal_data_and_ban_myself' skal slås til,
        så kørere kan bruge deres ret til at blive glemt og få alle deres statistikker
        slettet.
      label: Chatkommando for retten til at blive glemt
    RollingStart:
      help: Om Kissmyranks rullende start skal bruges ved løbets start.
      label: Rullende start
    Rules:
      label: Regler
    SessionHistoryLength:
      help: Længden af sessionshistorikken. Hvor mange sessioner der gemmes i hukommelsen.
        En højere værdi bruger mere hukommelse.
      label: Længde af sessionshistorik
    SlowingUnderVirtualSafetyCar:
      fieldset: Nedbremsning under virtual safety car
    SpeedUnitFormat:
      help: Hastighedsenheden, der bruges ved offentlig visning af data. Tilladte værdier
        er kmh og mph. Bemærk, at det kun er kosmetisk for brugerne, og at du stadig skal
        bruge km/h i al konfiguration.
      label: Format for hastighedsenhed
    SpeedingUnderVirtualSafetyCar:
      fieldset: For høj fart under virtual safety car
    StartMoney:
      help: Pengene (i tusinder), som en spiller uden rang får, når han joiner serveren
        første gang (30=30000€). Tjek også min_money, så værdien giver mening.
      label: Startpenge
    ThousandSeparator:
      help: Tegnet, der adskiller tusinder (fx 19,000 eller 19.000).
      label: Tusindtalsseparator
    TimeBasedRaceExtraLap:
      help: Om den ekstra omgang er slået til i Assetto Corsa-serverens server_cfg.ini
        ved tidsbaserede løb. Er banerotation aktiv, læser pluginet indstillingen direkte
        fra server_cfg.ini og ignorerer denne værdi.
      label: Ekstra omgang i tidsbaseret løb
    TrackBoundaryCut:
      fieldset: Cut over banegrænsen
    TrackBoundaryCutGainFilter:
      help: Om gevinstfilteret for cuts over banegrænsen skal slås til. Det sammenligner
        fordelen ved cuttet med sessionens hurtigste omgang og giver ingen straf, hvis
        køreren taber tid i forhold til den.
      label: Gevinstfilter for cuts over banegrænsen
    TrackBoundaryCutGainFilterMinAverageSpeed:
      help: Denne hastighed (i km/h) er gulvet for gevinstfilteret for cuts over banegrænsen.
        45 = 45km/h (fx hvis en spiller under cuttet taber mere tid, end hvis han kørte
        det pågældende baneafsnit med 45km/h, ignoreres cuttet). Kun nyttigt i de første
        omgange, når der endnu ikke er en sammenligningsomgang.
      label: 'Gevinstfilter: min. gennemsnitsfart'
    TrackBoundaryCutGainFilterMinLossPercent:
      help: Det mindste acceptable tidstab (i procent), for at gevinstfilteret ignorerer
        cuttet. 6=6% (fx får en kører, der taber mere end 6% i forhold til sessionens
        hurtigste omgangstid, ingen straf).
      label: 'Gevinstfilter: min. tab i procent'
    TrackBoundaryCutMaxSpeed:
      help: Den maksimale hastighed (i km/h), hvormed en kører må krydse banegrænsen.
      label: Maks. hastighed ved cut over banegrænsen
    TrackBoundaryCutMaxTime:
      help: Den maksimale tid (i sekunder) mellem cuttets start og slut (cuts uden for
        dette interval regnes som afkørsler).
      label: Maks. tid for cut over banegrænsen
    TrackBoundarySameLapCutMaxSpeed:
      help: Den maksimale hastighed (i km/h), hvormed en kører må krydse banegrænsen efter
        den første overtrædelse (gælder både tilbagekomst på banen og yderligere cuts).
      label: Maks. hastighed ved cut i samme omgang
    TrackBoundarySampleLength:
      help: Længden (i meter) af et enkelt stykke banegrænse (maks. anbefalet værdi er
        3). Sæt den op, hvis du vil spare diskplads på bekostning af præcisionen. Bemærk,
        at værdien kun gælder nye datasæt.
      label: Samplelængde for banegrænse
    TrackRejoinMaxSpeed:
      fieldset: Maks. hastighed ved tilbagekomst på banen
      help: Den maksimale hastighed, hvormed en kører må komme tilbage på banen efter
        at have været uden for banen i et udelukket område eller have stoppet bilen uden
        for banen.
      label: Maks. hastighed ved tilbagekomst på banen
    UDPRelay:
      label: UDP-relay
    UDPReplayTo:
      help: 'Én pr. linje. Brug det, hvis du vil videresende UDP-trafik til andre plugins
        (fx Minorating, Stracker osv.). Det virker sådan: AC-server <-> Kissmyrank-plugin
        <-> andre plugins. For hvert plugin angiver du adressen i formatet ip_address:port
        (fx for et plugin på 127.0.0.1 med port 12003 erstatter du UDP_PLUGIN_ADDRESS_1
        med 127.0.0.1:12003). For at det virker, skal det andet plugin sættes op, som
        om Kissmyrank-pluginet var Assetto Corsa-serveren (fx med Kissmyranks standardkonfiguration
        på port 12000 sætter du det andet plugins ac_server_plugin_port til 12000 og ac_server_ip
        til IP''en på maskinen, hvor Kissmyrank-pluginet kører). Tjek konsollen ved start
        for at se, om adressen læses korrekt.'
      label: UDP-relay til
    VSCDefaultLeaderSlowAllowOvertakeSpeed:
      help: Hastigheden i km/h, under hvilken føreren må overhales under virtual safety
        car eller formationsomgangen ved rullende start (så en parkeret bil ikke blokerer
        alle).
      label: 'VSC: hastighed for overhaling af langsom fører'
    VSCDefaultSlowAndFarAllowOvertakeDistance:
      help: Afstanden til bilen foran, over hvilken en kører må overhales under virtual
        safety car eller formationsomgangen ved rullende start, hvis han er langsommere
        end vsc_defalut_slow_and_far_allow_overtake_speed.
      label: 'VSC: afstand for overhaling af langsom og fjern bil'
    VSCDefaultSlowAndFarAllowOvertakeSpeed:
      help: Hastigheden i km/h, under hvilken en kører må overhales under virtual safety
        car eller formationsomgangen ved rullende start, hvis han er længere væk end vsc_defalut_slow_and_far_allow_overtake_distance.
      label: 'VSC: hastighed for overhaling af langsom og fjern bil'
    VSCDefaultSpeedLimit:
      help: Den maksimale hastighed (i km/h), en spiller må køre under virtual safety
        car.
      label: 'VSC: standard-hastighedsgrænse'
    VSCFormationLapFarAllowOvertakeDistance:
      help: Afstanden til bilen foran, over hvilken en kører må overhales under formationsomgangen
        ved rullende start (da bilerne skal være tæt på hinanden under formationsomgangen).
      label: 'VSC: afstand for overhaling i formationsomgang'
    VSCFormationLapMinSpeed:
      help: Den mindste hastighed (i km/h), en kører skal holde under formationsomgangen
        ved rullende start (0 deaktiverer).
      label: 'VSC: min. hastighed i formationsomgang'
    VSCFormationLapSpeedLimit:
      help: Den maksimale hastighed (i km/h), en spiller må køre under formationsomgangen
        ved rullende start.
      label: 'VSC: hastighedsgrænse i formationsomgang'
    VSCOvertakingMaxGrace:
      help: Antal sekunder, en kører har til at give positionen tilbage, når han har overhalet
        en anden bil under virtual safety car eller formationsomgangen ved rullende start.
      label: 'VSC: maks. respit ved overhaling'
    VSCSlowingMaxGrace:
      help: Antal sekunder, en kører må køre under minimumshastigheden under formationsomgangen
        ved rullende start.
      label: 'VSC: maks. respit ved nedbremsning'
    VSCSpeedingMaxGrace:
      help: Antal sekunder, en kører må køre over hastighedsgrænsen under virtual safety
        car eller formationsomgangen ved rullende start.
      label: 'VSC: maks. respit ved for høj fart'
    VirtualSafetyCar:
      label: Virtual Safety Car
    WarnedCarGrace:
      help: Tiden i sekunder, hver bil får til at give plads efter den første advarsel.
        Sæt den op for at give en advaret kører mere tid til at lade den anden bil passere.
      label: Respit for advaret bil
    WebAdminConsoleGuestPassword:
      help: Sæt en adgangskode på mindst 8 tegn, hvis du vil give skrivebeskyttet adgang
        til Web Admin-konsollen. Husk, at web_admin_console_password skal være sat for
        overhovedet at aktivere konsollen. Giv kun adgangskoden til betroede medlemmer,
        da de kan se alt, hvad der vises i Kissmyrank-konsollen.
      label: Gæsteadgangskode til Web Admin-konsollen
    WebAdminConsolePassword:
      help: Adgangskode til Web Admin-konsollen. Adgangskoden (mindst 12 tegn, ellers
        deaktiveres Kissmyranks Web Admin-interface tvangsmæssigt), som du bruger til
        at logge ind på Kissmyranks Web Admin-konsol på http://yourserver/kissmyrank_admin
        (når du åbner siden, og din adgangskode er 'yourcomplexpassword', skal du skrive
        'login yourcomplexpassword' for at få adgang). Lad feltet være tomt, hvis du ikke
        vil bruge Kissmyranks Web Admin-konsol.
      label: Adgangskode til Web Admin-konsollen
    WebAuth:
      label: Web Auth
    WebAuthCacheTime:
      help: Hvor længe web auth-resultatet caches i sekunder
      label: Cachetid for web auth
    WebAuthRelayTo:
      help: Én pr. linje. Brug det, hvis du også vil blokere brugere ud fra andre plugins.
        Værdierne er de samme, som du ville sætte som AUTH_PLUGIN_ADDRESS i Assetto Corsa-serverens
        server_cfg.ini for tredjeparts-pluginet (fx for Minorating erstatter du AUTH_PLUGIN_ADDRESS_1
        med plugin.minorating.com:805/minodata/auth/ABCN/?). Du kan selvfølgelig også
        bruge en anden instans af Kissmyrank Plugin Auth til blokering på tværs af servere
        med Kissmyrank-AUTH_PLUGIN_ADDRESS fra den anden plugin-instans. Tjek konsollen
        ved pluginets start for at se, om adressen læses korrekt.
      label: Web auth-relay til
    WebAuthServerAddress:
      help: Adresse for web auth (skift den kun, hvis du kun vil lytte på et bestemt interface;
        anbefales ikke).
      label: Web auth-serveradresse
    WebAuthServerPort:
      help: Port for web auth. På linux skal du ikke bruge porte under 1024.
      label: Web auth-serverport
    WebInterface:
      label: Webinterface
    WebStatsCacheTime:
      help: Hvor længe statistikken caches i sekunder (lavere værdi kan øge CPU-forbruget)
      label: Cachetid for Web Stats
    WebStatsDriversPerPage:
      help: Kørere pr. side i Web Stats. Angiver, hvor mange kørere der vises pr. side
        i Web Stats' kørerliste.
      label: 'Web Stats: kørere pr. side'
    WebStatsInterface:
      help: Om Web Stats-interfacet skal slås til (kræves til Race Control og race directors
        bedømmelse af kollisioner).
      label: Web Stats-interface
    WebStatsOverridePublicAddress:
      help: Sæt serverens offentlige Web Stats-adresse her, hvis du vil tilsidesætte pluginets
        automatiske registrering af den offentlige adresse.
      label: 'Web Stats: tilsidesæt offentlig adresse'
    WebStatsOverridePublicPort:
      help: Sæt serverens offentlige Web Stats-port her, hvis du vil tilsidesætte standarden
        (fx ved forwarding, proxy, redirect osv.).
      label: 'Web Stats: tilsidesæt offentlig port'
    WebStatsPublicURL:
      help: <strong>Sæt denne værdi, hvis du bruger Web Stats-porten!</strong> Den skal
        være den URL, som alle kan nå. Linket vises på ACPitwalls Live Timing-side, så
        alle kan se KMR-interfacet. Er feltet tomt, vises der intet link på Live Timing-siden!
      label: Offentlig URL til Web Stats
    WebStatsResultsShowLapLog:
      help: Sæt til 1, hvis løbsresultaterne i Web Stats skal indeholde omgangsloggen
        (som viser de registrerede tider for hver spiller, hvilke dæk han kørte på osv.
        pr. omgang).
      label: 'Web Stats: vis omgangslog i resultater'
    WebStatsServerAddress:
      help: Adresse for Web Stats-serveren (skift den kun, hvis du kun vil lytte på et
        bestemt interface; anbefales ikke).
      label: Web Stats-serveradresse
    WebStatsServerPort:
      help: 'Port for Web Stats-serveren. På linux: læs fejlfindingsafsnittet i hjælpefilen
        readme.txt.'
      label: Web Stats-serverport
