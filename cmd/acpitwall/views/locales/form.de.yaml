# German translation of form.en.yaml (generated from the struct tags of the forms).
form:
  GlobalServerConfig:
    AdminPassword:
      help: 'Das Passwort, mit dem du als Serveradministrator erkannt wirst: Trittst
        du dem Server mit diesem Passwort bei, wirst du automatisch als Admin erkannt.
        Gib /help im Chat des Spiels ein, um die Befehlsliste zu sehen. Achtung: Bleibt
        das Feld leer, kann sich jeder Fahrer als Admin verbinden!'
      label: Admin-Passwort
    AssettoCorsaServer:
      label: Assetto Corsa Server
    AuthPluginAddress:
      help: Die Adresse des Auth-Plugins
      label: Auth-Plugin-Adresse
    BlacklistMode:
      help: Wie mit gesperrten Spielern umgegangen wird.
      label: Sperrlisten-Modus
      option:
        "0": Normaler Kick, Spieler kann wieder beitreten
        "1": Gekickter Spieler kann bis zum Serverneustart nicht wieder beitreten
        "2": Spieler kicken und zu blacklist.txt hinzufügen, gekickter Spieler kann
          erst wieder beitreten, wenn er von der Sperrliste entfernt wurde
    ClientSendIntervalInHertz:
      help: Aktualisierungsrate, mit der der Server Pakete sendet. 10Hz = ~100ms.
        Höherer Wert = bessere MP-Qualität = mehr Bandbreite nötig. Sehr hohe Werte
        können Verbindungsprobleme verursachen
      label: Client-Sendeintervall in Hertz
    ContentManagerIPOverride:
      help: Wenn gesetzt, ersetzt dies die vom GeoIP-Dienst ermittelte IP-Adresse,
        die für den Content-Manager-Beitrittslink verwendet wird. Muss eine IPv4-Adresse
        sein.
      label: Content-Manager-IP überschreiben
    ContentManagerIntegration:
      label: Content-Manager-Integration
    ContentManagerWrapperContentRequiresPassword:
      help: Wenn aktiviert (und der Server ein Passwort hat), wird Content Manager
        mitgeteilt, dass die verlinkten Inhalte das Serverpasswort erfordern. Die
        Downloads selbst sind durch signierte URLs geschützt.
      label: 'Content Manager Wrapper: Inhalte erfordern Passwort'
    ContentManagerWrapperPort:
      help: Der Port, auf dem Content Manager die obigen Informationen bereitgestellt
        werden. Stelle sicher, dass dieser Port in deiner Firewall offen ist.
      label: Content-Manager-Wrapper-Port
    CustomCSS:
      help: Passe den Stil von ACPitwall an!
      label: Eigenes CSS
    DarkTheme:
      help: Das dunkle Theme von ACPitwall standardmäßig aktivieren
      label: Dunkles Theme
    DiscordAPIToken:
      help: Wenn gesetzt, werden Nachrichten zum Rennstart und geplante Erinnerungen
        an die unten angegebene Discord-Kanal-ID gesendet.  Verwende das User-Token
        deines Bots, nicht das OAuth-Token.
      label: Discord API Token
    DiscordChannelID:
      help: Wenn Discord aktiviert ist, ist dies die Kanal-ID, an die Nachrichten
        gesendet werden.  Um die Kanal-ID zu finden, aktiviere in Discord den Entwicklermodus
        (Benutzereinstellungen, Darstellung), dann Servereinstellungen, Rollen, Rechtsklick
        auf den Kanal und „ID kopieren“.
      label: Discord-Kanal-ID
    DiscordIntegration:
      label: Discord-Integration
    DiscordRoleCommand:
      help: Wenn die Discord-Rollen-ID gesetzt ist, kannst du hier optional einen
        Befehl angeben, z. B. „notify“ (ohne !-Präfix). Führt ein Nutzer ihn in Discord
        als !-Befehl aus (allein in einer Zeile), versucht dieser Server, dem Nutzer
        die konfigurierte Rolle zuzuweisen.  Wenn du mehrere Server mit aktiviertem
        Discord betreibst, setze dies nur bei einem von ihnen.  Damit das funktioniert,
        braucht dein Bot die Berechtigung „Rollen verwalten“.
      label: Discord-Rollenbefehl
    DiscordRoleID:
      help: Wenn gesetzt, wird diese Rolle in allen Discord-Benachrichtigungen erwähnt.  Alle
        Nutzer mit dieser Rolle und Zugriff auf den Kanal werden angepingt.  Um die
        Rollen-ID zu finden, aktiviere den Entwicklermodus (siehe oben), dann Servereinstellungen,
        Rollen, Rechtsklick auf die Rolle und „ID kopieren“.
      label: Discord-Rollen-ID
    EnableContentManagerWrapper:
      help: Wenn aktiviert, stellt ACPitwall Content Manager zusätzliche Informationen
        bereit. Dazu gehören mehr Details zu verbundenen Clients, Event-Beschreibungen
        und Download-Links. Als Nebeneffekt enthält dein Servername eine zusätzliche
        Information (ein „i“ gefolgt von einem Port, das Content Manager benötigt).
        Außerdem nutzt dieser Wrapper – falls aktiviert – eine GeoIP-Funktion von
        <a href='https://freegeoip.app''>freegeoip.app</a>.
      label: Content Manager Wrapper aktivieren
    FallBackResultsSorting:
      help: Wenn aktiviert, verwenden Ergebnisse eine alternative Sortiermethode.
        Aktiviere dies nur, wenn die Ergebnisse in der JSON-Datei in der falschen
        Reihenfolge stehen.
      label: Alternative Ergebnissortierung
    HTTPPort:
      help: 'Lobby-Port: Öffne diese Ports (UDP und TCP) in der Firewall deines Servers'
      label: HTTP-Port
    KickQuorum:
      help: Prozentsatz, der nötig ist, damit eine Kick-Abstimmung erfolgreich ist
      label: Kick-Quorum
    LogACServerOutputToFile:
      help: Wenn aktiviert, schreibt ACPitwall jede Assetto-Corsa-Session in eine
        Logdatei im Ordner logs.
      label: AC-Server-Ausgabe in Datei loggen
    Miscellaneous:
      label: Sonstiges
    Name:
      help: Servername
      label: Name
    NotificationReminderTimers:
      help: Wenn Discord aktiviert ist, wird so viele Minuten vor dem Rennstart eine
        Erinnerung gesendet.  Bei 0 oder leer werden nur Nachrichten zum Rennstart
        gesendet.  Mehrere Erinnerungen kannst du mit einer kommagetrennten Liste
        wie 120,15 planen.
      label: Erinnerungszeiten für Benachrichtigungen
    NotifyWhenScheduled:
      help: Eine Benachrichtigung senden, wenn ein Rennen geplant (oder abgesagt)
        wird.
      label: Bei Planung benachrichtigen
    NumberOfACServerLogsToKeep:
      help: Anzahl der AC-Server-Logs, die im Ordner logs behalten werden. (Die ältesten
        Dateien werden zuerst gelöscht. 0 = alle Dateien behalten)
      label: Anzahl aufbewahrter AC-Server-Logs
    NumberOfThreads:
      help: Anzahl der zu verwendenden Threads
      label: Anzahl Threads
    OGImage:
      help: Gib hier den Link zu einem Bild im Web an, um es als Standard-Open-Graph-Bild
        zu verwenden (wird in Link-Vorschauen angezeigt)
      label: OG-Bild
    Password:
      help: Serverpasswort
      label: Passwort
    PreventWebCrawlers:
      help: Wenn aktiviert, verbietet die robots.txt Robotern, diesen Manager zu indexieren.
        Beachte, dass dies nur gutartige Bots abhält, keine Malware-/Spam-Bots usw.
      label: Webcrawler fernhalten
    ReceiveBufferSize:
      label: Empfangspuffergröße
    RegisterToLobby:
      help: Den AC-Server in der Hauptlobby registrieren
      label: In der Lobby registrieren
    RestartEventOnServerManagerLaunch:
      help: Wenn aktiviert und ACPitwall gestoppt wird, während ein Event läuft, versucht
        ACPitwall, das Event beim nächsten Start von ACPitwall neu zu starten.
      label: Event beim Start von ACPitwall neu starten
    SendBufferSize:
      label: Sendepuffergröße
    ServerName:
      label: Servername
    ServerNameTemplate:
      help: Hier kannst du beliebigen Text eingeben. Wenn du <code>{{ .ServerName
        }}</code> einfügst, wird es durch den Servernamen ersetzt. Wenn du <code>{{
        .EventName }}</code> einfügst, wird es durch den Event-Namen ersetzt. Das
        funktioniert nur, wenn „Rennnamen in der Serverlobby anzeigen“ (oben) aktiviert
        ist.
      label: Servernamen-Vorlage
    ShowContentManagerJoinLink:
      help: Wenn aktiviert, zeigt ACPitwall Content-Manager-Beitrittslinks auf der
        Live-Timing-Seite und (falls aktiviert) in Discord-Benachrichtigungen zum
        Rennstart an.
      label: Content-Manager-Beitrittslink anzeigen
    ShowEventDetailsPopup:
      help: Erlaubt allen Nutzern, ein Popup zu öffnen, das die Konfiguration von
        eigenen Rennen, Meisterschafts-Events und Rennwochenend-Sessions im Detail
        beschreibt.
      label: Popup mit Event-Details anzeigen
    ShowPasswordInNotifications:
      help: Das Serverpasswort in Benachrichtigungen zum Rennstart anzeigen.
      label: Passwort in Benachrichtigungen anzeigen
    ShowRaceNameInServerLobby:
      help: Wenn aktiviert, hängt ACPitwall den Namen des eigenen Rennens oder der
        Meisterschaft an den Servernamen in der Lobby an.
      label: Rennnamen in der Serverlobby anzeigen
    SleepTime:
      help: Die genaue Wirkung dieser Einstellung ist nicht vollständig bekannt. Lass
        den Wert auf 1, außer du weißt genau, was du tust. (Andere Werte als 1 verursachen
        eine übermäßige CPU-Last)
      label: Sleep Time
    TCPPort:
      help: 'TCP-Port: Öffne diesen Port in der Firewall deines Servers'
      label: TCP-Port
    Theme:
      label: Theme
    UDPPluginAddress:
      help: Die Adresse des Plugins, an das UDP-Nachrichten gesendet werden.  Beachte,
        dass ACPitwall die UDP-Ports weiterreicht (Proxy), damit es sie selbst ebenfalls
        nutzen kann, z. B. für Meisterschaften, Live Timing und die Karte. Daher unterscheiden
        sich die UDP-Ports in der server_cfg.ini von den hier angegebenen. Das ist
        kein Problem, Nachrichten werden auch auf den hier angegebenen UDP-Ports korrekt
        gesendet/empfangen.
      label: UDP-Plugin-Adresse
    UDPPluginLocalPort:
      help: Der Port, auf dem auf UDP-Nachrichten eines Plugins gelauscht wird. Beachte,
        dass ACPitwall die UDP-Ports weiterreicht (Proxy), damit es sie selbst ebenfalls
        nutzen kann, z. B. für Meisterschaften, Live Timing und die Karte. Daher unterscheiden
        sich die UDP-Ports in der server_cfg.ini von den hier angegebenen. Das ist
        kein Problem, Nachrichten werden auch auf den hier angegebenen UDP-Ports korrekt
        gesendet/empfangen.
      label: Lokaler UDP-Plugin-Port
    UDPPort:
      help: 'UDP-Port: Öffne diesen Port in der Firewall deines Servers'
      label: UDP-Port
    UseMPH:
      help: Wenn aktiviert, verwendet ACPitwall für alle Geschwindigkeiten MPH statt
        km/h.
      label: MPH verwenden
    UseShortenedDriverNames:
      help: Wenn aktiviert, blendet ACPitwall die Nachnamen der Fahrer aus, z. B.
        wird aus „John Smith“ „John S.“
      label: Abgekürzte Fahrernamen verwenden
    VoteDuration:
      help: Dauer einer Abstimmung in Sekunden
      label: Abstimmungsdauer
    VotingQuorum:
      help: Prozentsatz, der nötig ist, damit eine Session-Abstimmung erfolgreich
        ist
      label: Abstimmungs-Quorum
  KissMyRankConfig:
    ACAppLinkUDPPort:
      help: Der UDP-Port, über den Kissmyrank-Events an kompatible Assetto-Corsa-Apps
        im Spiel weitergeleitet werden (0 deaktiviert diese Funktion). AC-Apps können
        sich mit diesem Port verbinden. Die vollständige Dokumentation findest du
        unter /applink/doc, eine Demo-App unter /applink/demo/.
      label: AC App Link UDP-Port
    ACChatAdminGUIDList:
      help: Eine GUID pro Zeile. Liste der GUIDs der Fahrer, die Kissmyrank-Adminbefehle
        über den Assetto-Corsa-Chat senden dürfen (gib „/kmr login password“ im Chat
        ein, um dich anzumelden, und „/kmr command“, um einen der unterstützten Befehle
        auszuführen).
      label: GUID-Liste der Chat-Admins
    ACChatAdminPassword:
      help: Das Admin-Passwort für die Anmeldung über den Assetto-Corsa-Chat (gib
        „/kmr login password“ im Spielchat ein, um dich anzumelden).
      label: Chat-Admin-Passwort
    AlltimeFastestLapPrize:
      help: Wie viel ein Fahrer für die schnellste Runde aller Zeiten erhält  (in
        Tausend). 1.5 = 1500€.
      label: Prämie für die schnellste Runde aller Zeiten
    AntiCheatMaxClockDeltaConsecutiveHits:
      fieldset: 'Anticheat: aufeinanderfolgende Max-Clock-Delta-Treffer'
    AnticheatLaptimeInvalidateMaxClockDelta:
      help: Die maximale Differenz (in Millisekunden) zwischen den vom Assetto-Corsa-Server
        gemeldeten und den vom Plugin (mit der Uhr des Host-Rechners) gemessenen Rundenzeiten,
        bevor eine Rundenzeit verworfen wird (z. B. um Manipulationen der Assetto-Corsa-Rundenzeiten
        über den CPU-Takt zu verhindern). Beachte, dass dieser Wert die natürlichen
        Verzögerungen in der Kommunikation zwischen Plugin und Server berücksichtigen
        muss. Setze ihn nicht zu niedrig, sonst werden Fahrer womöglich bestraft,
        wenn dein Server unter Last steht. Verwende ihn nur, wenn dein Server genug
        Ressourcen hat, um Pakete mit gleichmäßiger Verzögerung zu verarbeiten. 0
        deaktiviert die Funktion.
      label: 'Anticheat: Rundenzeit ab max. Clock-Delta verwerfen'
    AnticheatPenalizeDriverMaxClockDeltaConsecutiveHits:
      help: Wie oft ein Fahrer hintereinander das max_clock_delta überschreiten muss,
        bevor er die in den Strafkosten und Strafaktionen festgelegte Strafe erhält.
        0 deaktiviert die Funktion.
      label: 'Anticheat: Strafe nach aufeinanderfolgenden Max-Clock-Delta-Treffern'
    CarTowingCost:
      help: Abschleppkosten pro km. Wie viel (in Tausend) Fahrer pro km zahlen, um
        ihr Auto an die Box abschleppen zu lassen. 0.05 = 50€ pro km (z. B. zahlt
        ein Fahrer beim Zurücksetzen an die Box 50€ pro km). 0 deaktiviert die Funktion
        vollständig.
      label: Abschleppkosten
    ChatDriverWelcomeMessageShowRaceControlLink:
      help: Ob beim Beitritt eines Fahrers der Race-Control-Link angezeigt wird.
      label: 'Willkommensnachricht im Chat: Race-Control-Link anzeigen'
    CleanLapReward:
      help: Wie viel (in Tausend) ein Fahrer für eine saubere Runde erhält (d. h.
        eine Runde ohne Abkürzung). Das kannst du auf Trainingsservern nutzen (da
        Rennprämien dort nicht greifen).
      label: Prämie für saubere Runde
    CollisionMinimumDamageBetweenCars:
      help: Die minimalen Schadenskosten (in Tausend), unterhalb derer Kollisionen
        zwischen Autos nicht protokolliert werden. 0 protokolliert alle Kollisionen.
        0.001 = Kollisionen mit der Umgebung unter 1€ nicht protokollieren.
      label: Mindestschaden bei Kollisionen zwischen Autos
    CollisionMinimumDamageWithEnvironment:
      help: Die minimalen Schadenskosten (in Tausend), unterhalb derer Kollisionen
        mit der Umgebung nicht protokolliert werden. 0 protokolliert alle Kollisionen.
        0.001 = Kollisionen mit der Umgebung unter 1€ nicht protokollieren.
      label: Mindestschaden bei Kollisionen mit der Umgebung
    ConnectionOptions:
      label: Verbindungsoptionen
    CurrencySymbol:
      help: Das Währungssymbol für alle Strafen und Zahlungen der Fahrer (z. B. €,$,RUB).
      label: Währungssymbol
    CustomChatDriverWelcomeMessages:
      help: Eigene Chatnachrichten, die gesendet werden, wenn sich ein Fahrer verbindet.
        Eine pro Zeile.
      label: Eigene Willkommensnachrichten im Chat
    CutLineYourCustomCutLine:
      fieldset: 'Cut Line: deine eigene Cut Line'
    CutLinesEnabled:
      help: Cut Lines aktivieren. Setze dies auf 0, um die cut_lines-Funktion zu deaktivieren.
        Beachte, dass Cut Lines nur funktionieren, wenn sie mit dem Cut Line Drawer
        definiert wurden. Um die aktuellen Cut Lines zu prüfen, gib cut_line_list
        in der Konsole ein. Mehr dazu in readme.txt.
      label: Cut Lines aktiviert
    DamageCostBetweenCars:
      help: Die Kosten (in Tausend) des Schadens einer Kollision zwischen Autos bei
        damage_cost_between_cars_base_speed. 3 = 3000€ (d. h. Fahrern werden 3000€
        berechnet, wenn sie mit der angegebenen relativen Basisgeschwindigkeit kollidieren).
        Beachte, dass der Schaden mit dem Quadrat der Relativgeschwindigkeit steigt.
      label: Schadenskosten zwischen Autos
    DamageCostBetweenCarsBaseSpeed:
      help: Die Basisgeschwindigkeit (in km/h) für damage_cost_between_cars.
      label: Basisgeschwindigkeit für Schadenskosten zwischen Autos
    DamageCostWithEnvironment:
      help: Die Kosten (in Tausend) des Schadens einer Kollision mit der Umgebung
        bei damage_cost_with_environment_base_speed. 3 = 3000€ (d. h. Fahrern werden
        3000€ berechnet, wenn sie mit der angegebenen relativen Basisgeschwindigkeit
        mit der Umgebung kollidieren). Beachte, dass der Schaden mit dem Quadrat der
        Geschwindigkeit steigt.
      label: Schadenskosten mit der Umgebung
    DamageCostWithEnvironmentBaseSpeed:
      help: Die Basisgeschwindigkeit (in km/h) für damage_cost_with_environment.
      label: Basisgeschwindigkeit für Schadenskosten mit der Umgebung
    Database:
      label: Datenbank
    DatabaseSharingLocalGroupPort:
      help: Lokaler Port zum Teilen der Datenbank mit Kissmyrank-Instanzen auf demselben
        Rechner. Setze ihn auf eine gültige Portnummer, wenn du dieselbe Datenbank
        zwischen verschiedenen Instanzen des Kissmyrank-Plugins auf demselben Rechner
        teilen willst. Für alle Plugins derselben Sharing-Gruppe musst du denselben
        Port setzen (z. B. hast du 4 Kissmyrank-Instanzen A,B,C,D und willst die Datenbank
        paarweise teilen – A mit B sowie C mit D –, dann setzt du database_sharing_group_port
        in der config.json von KMR A und KMR B auf 4567 und bei KMR C und KMR D auf
        4568).
      label: Lokaler Gruppen-Port für Datenbank-Sharing
    DatabaseSharingRelayForNames:
      help: 'Eine pro Zeile. Relay-Namen für Remote-Datenbank-Sharing. Achtung: Dieser
        Schlüssel wird für normales Datenbank-Sharing nicht benötigt, sondern nur,
        wenn du einzeln angebundene Plugins hast (d. h. Plugins, die mit einer Instanz
        verbunden sind, aber nicht mit den anderen). Angenommen, du willst die Datenbank
        zwischen 3 Plugins (A,B und C) teilen und hast database_sharing_unique_name
        jeweils auf plugin_a, plugin_b, plugin_c gesetzt. Angenommen, du kannst nur
        A<->B und B<->C verbinden, aber A nicht direkt mit C. Nachdem du alle anderen
        Schlüssel (für A<->B und B<->C) richtig gesetzt hast, bearbeitest du die config.json
        von plugin_b und fügst plugin_a und plugin_c zum Schlüssel database_sharing_relay_for_names
        hinzu. Dadurch leitet Plugin B Informationen an das jeweils andere Plugin
        weiter, sodass A<->B<->C möglich wird. Beachte, dass du in diesem Fall beim
        Herunterfahren von B auch A und C herunterfahren musst, sonst wird die Synchronisation
        womöglich nicht vollständig angewendet. Das funktioniert für lokale und Remote-Verbindungen,
        solange du den eindeutigen Namen setzt. Achte darauf, keine doppelten Verbindungen
        zwischen Plugins anzulegen, sonst bekommst du womöglich doppelte Updates.'
      label: Relay-Namen für Datenbank-Sharing
    DatabaseSharingRemoteConnectToAddresses:
      help: Eine pro Zeile. Adressen für Remote-Datenbank-Sharing. Die Adressen der
        entfernten Plugins im üblichen Format host:port (host ist die IP/Adresse des
        Servers, auf dem das Plugin läuft, port ist der database_sharing_remote_listen_port,
        den du für dieses Plugin gesetzt hast). Soll Plugin A die Datenbank mit Plugin
        B teilen, musst du hostA:portA in die config.json von Plugin B und hostB:portB
        in die config.json von Plugin A eintragen. Trage bei jedem Plugin alle Plugins
        ein, mit denen es kommunizieren soll (natürlich nicht sich selbst, sonst entsteht
        eine Schleife). Verbinde zwei Plugins nicht gleichzeitig per lokalem und Remote-Sharing.
      label: Remote-Adressen für Datenbank-Sharing
    DatabaseSharingRemoteListenAddress:
      help: Listen-Adresse für Remote-Datenbank-Sharing (ändere sie nur, wenn du nur
        auf einem bestimmten Interface lauschen willst; nicht empfohlen).
      label: Remote-Listen-Adresse für Datenbank-Sharing
    DatabaseSharingRemoteListenPort:
      help: Listen-Port für Remote-Datenbank-Sharing. Verwende ihn nur, wenn lokales
        Datenbank-Sharing nicht möglich ist. Setze ihn auf eine gültige Portnummer,
        wenn du die Datenbank mit einem Plugin auf einem entfernten Rechner teilen
        willst. Remote-Sharing kann Lag verursachen, daher empfehle ich, wann immer
        möglich lokales Datenbank-Sharing zu verwenden.
      label: Remote-Listen-Port für Datenbank-Sharing
    DatabaseSharingRemoteSecretKey:
      help: Geheimer Schlüssel für Remote-Datenbank-Sharing. Nur für Remote-Sharing
        nötig. Muss bei allen Hosts, die Remote-Datenbank-Sharing nutzen, gleich gesetzt
        sein.
      label: Geheimer Schlüssel für Remote-Datenbank-Sharing
    DatabaseSharingUniqueName:
      help: Eindeutiger Name für Datenbank-Sharing. Setze einen eindeutigen Namen
        für dieses Plugin, um es in den Logs besser zu erkennen. Das ist rein kosmetisch
        und völlig optional.
      label: Eindeutiger Name für Datenbank-Sharing
    DriveThroughNoKick:
      help: Ob die Kick-Strafe deaktiviert wird, wenn ein Drive-Through nicht abgeleistet
        wird oder zwei Drive-Through-Events direkt hintereinander auftreten.
      label: Kein Kick bei Drive-Through
    DrivingLinePenaltyRepeatGrace:
      help: Die Mindestzeit (in Sekunden) zwischen zwei aufeinanderfolgenden Abkürzungsstrafen
        (Streckenbegrenzungen und Cut Lines). 6 = 6s (d. h. kürzt ein Fahrer zweimal
        innerhalb von weniger als 6s ab, wird er nur einmal bestraft). Senke den Wert
        nicht zu stark, um Strafen-Spam zu vermeiden.
      label: Karenzzeit zwischen Abkürzungsstrafen
    EnableKissMyRank:
      label: Kiss My Rank aktivieren
    FirstBlood:
      fieldset: First Blood
    HotLapProtection:
      fieldset: Hotlap-Schutz
    HotLappingCarCollision:
      fieldset: Kollision mit Auto auf Hotlap
    HotlapProtection:
      help: Ab welchem Abstand (in Metern) ein Auto auf der Outlap die Warnung „Lass
        das andere Auto vorbei“ erhält, wenn es gleich überholt wird.
      label: Hotlap-Schutz
    ImprovingQualifyLapTimeWithInfractions:
      fieldset: Verbesserte Qualifying-Rundenzeit trotz Verstößen
    ImprovingQualifyLaptimeWithInfractionsCutoffPercent:
      help: Die Rundenzeit (in Prozent der Session-Bestzeit), oberhalb der eine verbesserte
        Zeit mit Abkürzungen nicht als Missbrauch gilt. 107 = 107% (d. h. ein Fahrer,
        der eine Zeit mit Kissmyrank-Verstößen, aber ohne AC-Verstöße fährt, die über
        107% der schnellsten Runde der Session liegt, löst keine Strafe aus).
      label: Grenzwert in Prozent für verbesserte Qualifying-Rundenzeit trotz Verstößen
    JLPMoneyKillSwitch:
      help: Setze dies auf 1, wenn du – genau wie Captain Jean-Luc Picard – das Geld-/Punktesystem
        überhaupt nicht nutzen willst (z. B. Ligen, private Server und alle, die nur
        an den Race-Control- und Tracking-Funktionen von Kissmyrank interessiert sind).
        Wenn du das änderst, musst du die Datenbank zurücksetzen (d. h. das Plugin
        neu installieren).
      label: JLP Money Kill Switch
    LappingCarCollision:
      fieldset: Kollision mit überrundetem Auto
    LappingProtection:
      fieldset: Überrundungsschutz
      help: Ab welchem Abstand (in Metern) ein Auto, das überrundet wird, die Warnung
        „Blaue Flagge“ erhält, wenn es gleich überholt wird.
      label: Überrundungsschutz
    LaptimeChallengeBaseAverageSpeed:
      help: Basis-Durchschnittsgeschwindigkeit der Laptime Challenge (km/h). 110=110km/h.
        Ein Fahrer ist Level 0, wenn er eine Runde mit durchschnittlich 110 km/h fahren
        kann, Level 1 bei 111 km/h und so weiter...
      label: Basis-Durchschnittsgeschwindigkeit der Laptime Challenge
    LaptimeChallengeBasePrize:
      help: Basisprämie der Laptime Challenge (in Tausend). 0.01 = 10€. Die Prämie
        ist Basis*Level (Level 2 erhält 20). 0 deaktiviert die Laptime Challenge.
      label: Basisprämie der Laptime Challenge
    LaptimeChallengeLevelAverageSpeedGap:
      help: Der Unterschied der Durchschnittsgeschwindigkeit zwischen zwei aufeinanderfolgenden
        Laptime-Challenge-Levels in (km/h). 1=1km/h (z. B. Level 0 => 110km/h, Level
        1 => 111km/h).
      label: Geschwindigkeitsabstand zwischen Laptime-Challenge-Levels
    LiveTrackView:
      help: Ob die Live-Streckenansicht aktiviert wird (z. B. ausschalten, um die
        Live-Karte der Web Stats zu deaktivieren).
      label: Live-Streckenansicht
    MacCollisionsPer100kmRechargeHours:
      help: Die Basiszeit (Stunden pro Kollisionseinheit), die ein Fahrer, der max_collisions_per_100km
        überschreitet, warten muss, bevor er dem Server wieder beitreten kann (z.
        B. muss bei max_collisions_per_100km = 30 ein Fahrer mit 31 Kollisionen pro
        100km ab seinem letzten Verlassen des Servers 1h warten, bei 32 2 Stunden
        und so weiter).
      label: Wartezeit in Stunden bei max. Kollisionen pro 100 km
    MaxCollisions:
      fieldset: Max. Kollisionen
      help: Die maximale Anzahl an Kollisionen, an denen ein Nutzer beteiligt sein
        darf, bevor er die in den Maps penalty_cost und penalty_action festgelegten
        Strafen erhält.
      label: Max. Kollisionen
    MaxCollisionsPer100km:
      help: Die maximale Anzahl an Kollisionen pro 100 km, die ein Fahrer auf dem
        Server haben darf. Gilt für Fahrer, die mehr als max_collisions_per_100km_min_distance
        gefahren sind.
      label: Max. Kollisionen pro 100 km
    MaxCollisionsPer100kmMinDistance:
      help: Die gefahrene Strecke (in km), ab der max_collisions_per_100km greift.
      label: Mindeststrecke für max. Kollisionen pro 100 km
    MaxInfractions:
      fieldset: Max. Verstöße
      help: Wie oft ein Fahrer maximal gegen die Serverregeln verstoßen darf (Abkürzen,
        zu schnelles Fahren, Überfahren der Boxenausfahrtslinie usw.), bevor er die
        unter Strafkosten und Strafaktionen festgelegten Strafen erhält.
      label: Max. Verstöße
    MaxPing:
      help: Der maximale Ping (in ms), den ein Fahrer haben darf (das Plugin warnt,
        wenn der aktuelle Ping darüber liegt, und kickt den Fahrer, wenn der Durchschnitt
        der letzten 4 Messungen über dem Wert liegt). Setze ihn nicht zu niedrig,
        sonst leidet womöglich die Auslastung des Servers. 0 deaktiviert das Ping-Limit
        vollständig.
      label: Max. Ping
    MaxPingDeviation:
      help: Die maximale Ping-Abweichung (in ms), bevor die Verbindung eines Fahrers
        als instabil gilt (das Plugin kickt den Fahrer, wenn die Standardabweichung
        des Pings in den letzten 4 Messungen über dem Wert liegt). Das ist ein Maß
        für die Instabilität der Verbindung, die für MP-Rennen wichtig ist. 0 deaktiviert
        die Funktion.
      label: Max. Ping-Abweichung
    MemoryMonitorEnabled:
      help: Ob die Speicherüberwachung aktiviert wird (unter Linux wird libc6 2.14+
        benötigt). Aktiviere sie, wenn das Plugin die Speichernutzung überwachen soll
        (hilfreich bei der Fehlersuche, wenn Probleme mit der Speicherzuweisung zusammenhängen
        könnten).
      label: Speicherüberwachung aktiviert
    MinMoney:
      help: Mindestbetrag an Geld (in Tausend), den ein Fahrer haben muss, um auf
        dem Server zu bleiben. 1 = 1000€ (z. B. -12 -> Fahrer mit mehr als 12000€
        Schulden werden gekickt). Prüfe auch start_money, damit dieser Wert sinnvoll
        ist.
      label: Mindestgeld
    MinimumDrivingStandard:
      help: Maximal erlaubte Bestenlistenzeit als Anteil der schnellsten Zeit. 1.1
        = 110% der schnellsten Zeit (d. h. ein Fahrer, der innerhalb von minimum_driving_standard_laps
        Runden keine Zeit innerhalb von 110% der schnellsten Rundenzeit schafft, wird
        auf dem Server nicht zugelassen).
      label: Mindest-Fahrstandard
    MinimumDrivingStandardLaps:
      help: Die Anzahl gültiger Runden, die ein Fahrer fahren muss, um den Mindest-Fahrstandard
        zu erreichen. Gemäß minimum_driving_standard_recharge_period bekommt ein Fahrer
        nach einigen Tagen eine zweite Chance.
      label: Runden für den Mindest-Fahrstandard
    MinimumDrivingStandardMinPlayers:
      help: Mindestanzahl an Spielern, ab der der Mindest-Fahrstandard durchgesetzt
        wird. Ist der Wert ungleich 0, wird der Fahrstandard nur durchgesetzt, wenn
        mehr als die angegebene Anzahl an Spielern auf dem Server ist.
      label: Mindestanzahl Spieler für den Mindest-Fahrstandard
    MinimumDrivingStandardRechargePeriod:
      help: Die Anzahl Sekunden, nach der einem Fahrer, der den Standard nicht erfüllt,
        eine Runde gutgeschrieben wird (z. B. legt dieser Wert bei minimum_driving_standard_laps
        = 12 fest, wie lange ein Spieler mit 13 Runden und einer schlechten Zeit warten
        muss, bevor er dem Server wieder beitreten kann).
      label: Wiederaufladezeit für den Mindest-Fahrstandard
    Miscellaneous:
      label: Sonstiges
    Money:
      label: Geld
    NoMoney:
      help: Setze dies auf ON, wenn du Punkte statt Geld verwenden willst (no money,
        no party :D).
      label: Kein Geld
    OvertakingUnderVirtualSafety:
      fieldset: Überholen unter Virtual Safety Car
    ParkedCarDistance:
      help: Die Strecke (in Metern), die ein Auto in parked_car_max_seconds zurücklegen
        muss, um die Erkennung nicht auszulösen. 24 = 24 Meter (ein Auto auf der Strecke,
        das sich in parked_car_seconds mehr als 24 Meter bewegt, löst die Erkennung
        nicht aus).
      label: Strecke für Parkerkennung
    ParkedCarMaxGrace:
      help: Wie oft ein Fahrer die Erkennung geparkter Autos auslösen darf, bevor
        er eine Strafe erhält. 4 = 4-mal (0 deaktiviert diese Erkennung).
      label: Max. Toleranz für geparkte Autos
    ParkedCarSeconds:
      help: Die Anzahl Sekunden für die Erkennung geparkter Autos. 6 = 6s (d. h. ein
        Fahrer nahe der Strecke, der sich in 6s nicht weiter als parked_car_distance
        bewegt, löst die Erkennung einmal aus).
      label: Sekunden für Parkerkennung
    ParkingNearTrack:
      fieldset: Parken nahe der Strecke
