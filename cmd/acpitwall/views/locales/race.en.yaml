    create_short: Create a custom race
    intro: Custom races are fully configurable events, once you have created a custom race you can star it or add it to the automatic race loop. You can use a custom race as a template for a new race, which will create a copy of the custom race, or edit the custom race directly. Custom races can be run quickly on the server using the start race button.
    tab_recent: Recent
    tab_starred: Starred
    tab_scheduled: Scheduled
    tab_loop: Auto Loop
    empty_recent: No recent custom races yet.
    empty_starred_hint: No starred custom races yet. Star them in the Recent tab.
    empty_starred: No starred custom races yet.
    empty_scheduled: No scheduled custom races.
    loop_help: These custom races will be looped on the server whilst it is inactive! Auto loop races will only work if allowed to start automatically, please don't manually start these events if you want them to loop!
    empty_loop_hint: The auto loop is empty. Use the play icon on a custom race to add it; looped races run while the server is inactive.
    empty_loop: No looping custom races yet.
  import:
    title: Import Custom Race
    placeholder: Paste your custom race JSON here!
    button: Import
    help: Here you can import a custom race in JSON format (this format matches the format given when you export a custom race). The import always creates a new custom race, even if it came from this server. Schedule, star and loop settings are not part of an export. The race is only checked for a valid setup; cars and tracks of the import must be uploaded to this server to start it.

