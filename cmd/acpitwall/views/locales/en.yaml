# Messages of the TypeScript code (cmd/acpitwall/typescript/src, see i18n.ts): t("confirm.title") is js.confirm.title.
js:
  confirm:
    delete_title: Delete this item?
    delete_detail: This cannot be undone.
    delete_label: Delete
    action_title: Are you sure?
    action_label: Confirm
