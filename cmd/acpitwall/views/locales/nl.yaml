  manage_intro: Bepaal wie kan inloggen en wat ze mogen doen.
  add_account: Account toevoegen
  add_title: Account toevoegen
  edit_title: Account bewerken
  edit_intro: Accounts bepalen wat iemand in ACPitwall mag doen.
  details: Accountgegevens
  group_option:
    read: Lezen - races, content en kampioenschappen bekijken
    write: Schrijven - races, content en kampioenschappen bekijken en bewerken
    delete: Verwijderen - races, content en kampioenschappen bekijken, bewerken en verwijderen
    admin: Admin - volledige toegang
    no_access: Geen toegang - de gebruiker kan nergens bij
  group_help: Groepen gelden per ACPitwall-instantie. Met meerdere servers kun je gebruikers per server een andere groep geven.
  group_all_servers: Groep voor alle servers overnemen?
  group_all_servers_help: Als dit aan staat, wordt de hierboven gekozen groep voor het account op alle servers van deze instantie toegepast.
  reset_password: Wachtwoord resetten
  generated_password_help: Dit wachtwoord is automatisch gegenereerd. Geef het aan de persoon voor wie je het account aanmaakt. Bij de eerste keer inloggen wordt gevraagd het te wijzigen.
  add_user: Gebruiker toevoegen
  save_user: Gebruiker opslaan
  delete_confirm: Account {name} verwijderen?
  delete_detail: Het account wordt definitief verwijderd.
  delete_label: Account verwijderen
  only_write_access: Alleen accounts met schrijfrechten
  open:
    title: Open ACPitwall
    intro: Een open ACPitwall geeft iedereen leestoegang, ook zonder account.
    open: Open
    closed: Gesloten
    make_open: Openen
    make_closed: Sluiten
  stats:
    title: Openbare rijdersstatistieken
    intro: Rijdersprofielen, ranglijsten en ronderecords. Als dit uit staat, zijn ze alleen zichtbaar voor ingelogde accounts, ook bij een open ACPitwall.
    public: Openbaar
    private: Privé
    make_public: Openbaar maken
    make_private: Privé maken
  downloads:
    title: Downloads van content
    intro: Wie auto's, circuits, setups en skins mag downloaden (de afbeeldingen op de pagina's blijven zichtbaar). Content Manager krijgt ondertekende, tijdelijk geldige skinlinks en blijft dus werken als downloads beperkt zijn.
    public: Openbaar (iedereen met leestoegang, bij een open ACPitwall ook anoniem)
    login: Alleen ingelogde accounts
    "off": Uit (alleen admins)
  teams:
    intro: Rijders kunnen teams oprichten, er lid van worden en zich ermee inschrijven voor kampioenschappen. Accounts met schrijfrechten kunnen altijd teams oprichten en alle teams beheren.
    creation: Teams oprichten
    creation_everyone: Elk account kan teams oprichten
    max: Teams per account (als eigenaar)
    max_help: 0 is de standaard van 3, -1 is onbeperkt.
  skins:
    title: Skins
    intro: Accounts kunnen skins voor auto's uploaden en ze privé houden, delen met een team of globaal maken. Accounts met schrijfrechten uploaden altijd globale skins. De limieten beschermen de schijf; onbeperkt bestaat niet, 0 gebruikt de standaard tussen haakjes.
    uploads: Skinuploads door gebruikers
    uploads_everyone: Elk ingelogd account kan skins uploaden
    global: Skins globaal maken
    global_everyone: Gebruikers kunnen hun skins globaal delen
    max_files: Bestanden per skin (standaard {default})
    max_skin_mb: Grootte van één skin in MB (standaard {default})
    user_quota_mb: Skinopslag per gebruiker in MB (standaard {default})
    min_free_mb: Vrij te houden schijfruimte in MB (standaard {default})
    min_free_help: Een upload wordt geweigerd als er daarna minder dan dit vrij zou blijven op de schijf.
  matrix:
    title: Wat elke groep mag
    read: Races, uitslagen, content, kampioenschappen en live timing bekijken
    write: Races, kampioenschappen en raceweekenden aanmaken en bewerken; content uploaden; de server starten en stoppen; logs bekijken
    delete: Races, kampioenschappen, uitslagen en content verwijderen; AutoFill-deelnemers beheren
    admin: Serveropties, plugins, accounts, blacklist, berichten, auditlogs en race control-commando's
    no_access: Accounts in de groep "Geen toegang" kunnen ACPitwall helemaal niet gebruiken.

