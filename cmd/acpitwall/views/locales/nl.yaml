  intro: Deze gegevens zijn niet verplicht, maar wel aanbevolen. Als je ze invult, kom je in de lijst met deelnemers die organisatoren aan events kunnen toevoegen, en worden je gegevens automatisch ingevuld als je je inschrijft voor een gesloten event.
  driver_name: Rijdersnaam
  guid: GUID
  guid_help: Als je je Steam-GUID niet weet, kun je <a href="{url}">inloggen met Steam</a> om hem automatisch in te vullen.
