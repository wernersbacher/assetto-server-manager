  search:
    submit: Søg
    showing: Viser resultat {from}-{to} af {total}
    took: Søgningen tog {duration}
    no_results: Din søgning gav ingen resultater. Prøv en anden søgning.
    help: Søgehjælp
    help_intro: Du kan bruge søgningen ligesom Google eller ethvert andet søgefelt.
    help_basic: "<strong>Simpel søgning</strong> - hvis du for eksempel vil finde biler, der har med Ferrari at gøre, kan du skrive: <code>ferrari</code>"
    help_boolean: "<strong>Boolesk søgning</strong> - hvis du vil finde Ferrari-biler, der ikke er veteranbiler, kan du bruge: <code>+ferrari -vintage</code>."
    help_fields: "<strong>Søgning i bestemte felter</strong> - alle bilens oplysninger kan gennemsøges. Hvis du for eksempel vil finde biler med et bestemt tag - lad os sige \"italy\" - kan du bruge: <code>tags:\"italy\"</code>"
    help_fields_list: "Den komplette liste over bilens felter:"
    help_numeric: "<strong>Søgning på talværdier</strong> - du kan søge på talværdier, for eksempel viser <code>spec.weight:>600</code> alle biler, der vejer mere end 600 kg."
    help_numeric_list: "Alle tilgængelige talværdier:"
    help_content_type: "<strong>Søgning efter standard-, DLC- og mod-indhold</strong> - du kan søge specifikt efter kun standard-, kun DLC- eller kun mod-indhold med en (eller flere) af følgende: <code>+stock</code>, <code>+dlc</code>, <code>+mod</code>. Du kan fjerne standard-, DLC- eller mod-indhold fra resultaterne med en (eller flere) af følgende: <code>-stock</code>, <code>-dlc</code>, <code>-mod</code>."
    help_combine: "Du kan selvfølgelig kombinere alt ovenstående i én søgning! Det kunne se sådan ud:"
    help_combine_example: "\"skal være en Ferrari\", \"må ikke være en veteranbil\", \"skal have tagget 'semiautomatic'\", \"skal have mere end 600 hk\", \"må ikke være DLC\"."
    help_bleve: ACPitwall bruger Bleve til søgning. Bleve er meget kraftfuldt og giver stor kontrol over søgninger. Vi har vist nogle eksempler her, men se <a href="{url}">Bleves dokumentation</a> for flere eksempler og den præcise syntaks.
