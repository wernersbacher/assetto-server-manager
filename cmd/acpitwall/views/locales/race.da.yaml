    reversed_grid_tooltip: Løbssessionen genstartes med omvendt startopstilling ud fra stillingen i det forrige løb. Kørere, der blev diskvalificeret i første løb, starter bagerst i andet løb, også selvom deres position ligger inden for det omvendte område.
    reversed_grid_0: 0 = intet ekstra løb
    reversed_grid_minus1: -1 = alle positioner vendes om (udgåede kørere står på de sidste pladser)
    reversed_grid_1: 1 = der køres et 2. løb med en startopstilling ud fra resultaterne af 1. løb
    reversed_grid_x: X = de første X positioner vendes om til 2. løb
    extra_lap: Ekstra omgang
    extra_lap_help: Er løbet på tid, køres en ekstra omgang, efter at føreren har krydset stregen
    qualify_max_wait: Maks. ventetid i kvalifikation (procent)
    qualify_max_wait_help: "Faktor til at beregne den resterende tid i en kvalifikationssession, efter at sessionen er slut: 120 betyder, at 120 % af sessionens hurtigste omgang er tilbage til at gøre den aktuelle omgang færdig."
    max_clients: Maks. klienter
    max_clients_help: Maksimalt antal klienter på serveren.
    pickup_mode: Pickup-tilstand
    pickup_mode_help: "Står den på FRA, starter serveren i booking-tilstand. Advarsel: i pickup-tilstand skal Entry List indeholde mindst én bil. Bemærk: når pickup-tilstand er FRA, skal spillerne forbinde igen i sessioner med loop-tilstand TIL eller omvendt startopstilling, når serveren starter forfra eller går videre til et andet løb."
    locked_entry_list: Låst Entry List
    locked_entry_list_help: Kun spillere, der allerede står på Entry List, kan joine serveren.
    locked_reverse_warning: Serveren går ned, hvis et andet løb er aktivt (omvendt startopstilling != 0), Entry List er låst og pickup-tilstand er slået fra. Vil du låse Entry List for dette event, skal du også slå pickup-tilstand til!
    driver_swaps: Kørerskift
    driver_swaps_help: Med ACPitwalls kørerskift kan flere kørere dele én deltager og skifte med hinanden. Angiv flere GUID'er adskilt af ; ved en deltager for at gøre det muligt.
    driver_swaps_note: "Bemærk: kørerskift giver kun gyldige resultatfiler, hvis banens tidtagningslinje ligger før eller efter alle pitbokse."
    swap_min_time: Minimal tid for kørerskift (sekunder)
    swap_min_time_help: Mindste varighed af et kørerskift, så brugere med hurtigere computere ikke får en fordel. Kører den anden kører af sted før denne tid, bliver vedkommende diskvalificeret eller straffet afhængigt af konfigurationen.
    swap_dq_window: Diskvalifikationsvindue for kørerskift (sekunder)
    swap_dq_window_help: Køreren kickes fra løbet og diskvalificeres, hvis vedkommende kører af sted så mange sekunder eller mere før minimumstiden under et kørerskift.
    swap_penalty_window: Strafvindue for kørerskift (sekunder)
    swap_penalty_window_help: Kører en kører af sted så mange sekunder eller mere før minimumstiden under et kørerskift, får vedkommende en straf svarende til de resterende sekunder af nedtællingen plus 5 sekunder.
    swap_min_count: Mindste antal kørerskift
    swap_min_count_help: Det antal skift, en kører skal gennemføre. Gennemføres det krævede antal stop ikke, gives der straf (se nedenfor).
    swap_not_enough_penalty: Straf for for få kørerskift (sekunder)
    swap_not_enough_penalty_help: Straffen i sekunder, en kører får for hvert manglende kørerskift under minimum. Står den på 0, diskvalificeres køreren.
