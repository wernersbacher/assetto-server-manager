  intro: A Race Weekend is a group of sequential sessions that can be run at any time. For example, you could set up a Qualifying session to run on a Saturday, then the Race to follow it on a Sunday. ACPitwall handles the starting grid for you, and lets you organise Entrants into splits based on their results and other factors!
