account_details:
  title: Profil bearbeiten
  intro: Diese Angaben sind freiwillig, aber empfohlen. Wenn du sie ausfüllst, kommst du in die Teilnehmerliste, aus der Organisatoren Fahrer zu Events hinzufügen, und deine Daten werden bei der Anmeldung zu geschlossenen Events automatisch ausgefüllt.
  driver_name: Fahrername
  guid: GUID
  guid_help: Wenn du deine Steam-GUID nicht kennst, kannst du dich <a href="{url}">mit Steam anmelden</a>, um sie automatisch einzutragen.
  team: Team
  theme: Design
  theme_option:
    default: Standard verwenden
    light: Hell
    dark: Dunkel

accounts:
  username: Benutzername
  username_placeholder: Benutzername
  password: Passwort
  password_placeholder: Passwort
  name: Name
  group: Gruppe
  manage_title: Konten verwalten
  manage_intro: Lege fest, wer sich anmelden darf und was erlaubt ist.
  add_account: Konto hinzufügen
  add_title: Konto hinzufügen
  edit_title: Konto bearbeiten
  edit_intro: Konten legen fest, was eine Person in ACPitwall tun darf.
  details: Kontodaten
  group_option:
    read: Lesen - Rennen, Inhalte und Meisterschaften ansehen
    write: Schreiben - Rennen, Inhalte und Meisterschaften ansehen und bearbeiten
    delete: Löschen - Rennen, Inhalte und Meisterschaften ansehen, bearbeiten und löschen
    admin: Admin - Vollzugriff
    no_access: Kein Zugriff - der Benutzer kann nichts aufrufen
  group_help: Gruppen gelten pro ACPitwall-Instanz. Mit mehreren Servern kannst du Benutzern pro Server unterschiedliche Gruppen geben.
  group_all_servers: Gruppe für alle Server übernehmen?
  group_all_servers_help: Wenn aktiv, wird die oben gewählte Gruppe für das Konto auf allen Servern dieser Instanz übernommen.
  reset_password: Passwort zurücksetzen
  generated_password_help: Dieses Passwort wurde automatisch erzeugt. Gib es der Person, für die du das Konto anlegst. Bei der ersten Anmeldung wird sie aufgefordert, es zu ändern.
  add_user: Benutzer hinzufügen
  save_user: Benutzer speichern
  delete_confirm: Konto {name} löschen?
  delete_detail: Das Konto wird endgültig entfernt.
  delete_label: Konto löschen
  only_write_access: Nur Konten mit Schreibrechten
  open:
    title: Offenes ACPitwall
    intro: Ein offenes ACPitwall erlaubt allen Lesezugriff, auch ohne Konto.
    open: Offen
    closed: Geschlossen
    make_open: Öffnen
    make_closed: Schließen
  stats:
    title: Öffentliche Fahrerstatistiken
    intro: Fahrerprofile, Bestenlisten und Rundenrekorde. Wenn aus, sind sie nur für angemeldete Konten sichtbar, auch bei einem offenen ACPitwall.
    public: Öffentlich
    private: Privat
    make_public: Öffentlich machen
    make_private: Privat machen
  downloads:
    title: Downloads von Inhalten
    intro: Wer Autos, Strecken, Setups und Skins herunterladen darf (die Bilder auf den Seiten bleiben sichtbar). Content Manager bekommt signierte, zeitlich begrenzte Skin-Links und funktioniert daher auch bei eingeschränkten Downloads.
    public: Öffentlich (alle mit Lesezugriff, bei offenem ACPitwall auch anonym)
    login: Nur angemeldete Konten
    "off": Aus (nur Admins)
  teams:
    intro: Fahrer können Teams gründen, ihnen beitreten und sich mit ihnen für Meisterschaften anmelden. Konten mit Schreibrechten können immer Teams gründen und alle Teams verwalten.
    creation: Teams gründen
    creation_everyone: Jedes Konto kann Teams gründen
    max: Teams pro Konto (als Besitzer)
    max_help: 0 ist der Standard von 3, -1 ist unbegrenzt.
  skins:
    title: Skins
    intro: Konten können Skins für Autos hochladen und sie privat halten, mit einem Team teilen oder global freigeben. Konten mit Schreibrechten laden immer globale Skins hoch. Die Grenzen schützen die Festplatte; unbegrenzt gibt es nicht, 0 verwendet den Standard in Klammern.
    uploads: Skin-Uploads durch Benutzer
    uploads_everyone: Jedes angemeldete Konto kann Skins hochladen
    global: Skins global freigeben
    global_everyone: Benutzer können ihre Skins global freigeben
    max_files: Dateien pro Skin (Standard {default})
    max_skin_mb: Größe eines Skins in MB (Standard {default})
    user_quota_mb: Skin-Speicher pro Benutzer in MB (Standard {default})
    min_free_mb: Freizuhaltender Speicherplatz in MB (Standard {default})
    min_free_help: Ein Upload wird abgelehnt, wenn danach weniger als dieser Platz frei bliebe.
  matrix:
    title: Was jede Gruppe darf
    read: Rennen, Ergebnisse, Inhalte, Meisterschaften und Live-Timing ansehen
    write: Rennen, Meisterschaften und Rennwochenenden anlegen und bearbeiten; Inhalte hochladen; Server starten und stoppen; Logs ansehen
    delete: Rennen, Meisterschaften, Ergebnisse und Inhalte löschen; AutoFill-Teilnehmer verwalten
    admin: Serveroptionen, Plugins, Konten, Sperrliste, Nachrichten, Audit-Logs und Race-Control-Befehle
    no_access: Konten in der Gruppe „Kein Zugriff“ können ACPitwall gar nicht nutzen.
