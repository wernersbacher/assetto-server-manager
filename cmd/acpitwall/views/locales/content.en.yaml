  search:
    submit: Search
    showing: Showing results {from}-{to} of {total}
    took: Search completed in {duration}
    no_results: Your search returned no results. Please try a different query.
    help: Search Help
    help_intro: You can type in the search much like you would use Google or any other search field.
    help_basic: "<strong>Basic Search</strong> - for example if you wanted to find cars which relate to Ferrari, you can type: <code>ferrari</code>"
    help_boolean: "<strong>Boolean Searches</strong> - say you wanted to find Ferrari cars that are not vintage, you could use: <code>+ferrari -vintage</code>."
    help_fields: "<strong>Searching by Specific Fields</strong> - the entirety of the car's details can be searched across. For example, if you want to find cars with a specific tag - say, \"italy\" - you can use: <code>tags:\"italy\"</code>"
    help_fields_list: "The entire list of car fields is:"
    help_numeric: "<strong>Searching Numeric Values</strong> - you can search numeric values, for example <code>spec.weight:>600</code> will list all cars with a weight above 600kg."
    help_numeric_list: "All available numeric values are:"
    help_content_type: "<strong>Searching for Stock, DLC and Mod content</strong> - you can search specifically for only stock, only DLC or only mod content by using one (or multiple) of the following: <code>+stock</code>, <code>+dlc</code>, <code>+mod</code>. You can remove stock, DLC or mod content from the results by using one (or multiple) of the following: <code>-stock</code>, <code>-dlc</code>, <code>-mod</code>."
    help_combine: "Of course, you can combine all of the above things into one query! That might look like the following:"
    help_combine_example: "\"must be a ferrari\", \"must not be vintage\", \"must have the tag 'semiautomatic'\", \"must have a BHP greater than 600\", \"must not be DLC\"."
    help_bleve: ACPitwall uses Bleve to provide searching. Bleve is incredibly powerful and offers a great amount of control over search queries. We've covered some examples of how to make the most out of searching here, but please refer to <a href="{url}">Bleve's Documentation</a> for more detailed examples and syntax.
