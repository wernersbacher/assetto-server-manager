  search:
    submit: Zoeken
    showing: Resultaten {from}-{to} van {total}
    took: Zoekopdracht duurde {duration}
    no_results: Je zoekopdracht leverde geen resultaten op. Probeer een andere zoekopdracht.
    help: Zoekhulp
    help_intro: Je kunt de zoekfunctie gebruiken zoals Google of elk ander zoekveld.
    help_basic: "<strong>Eenvoudig zoeken</strong> - als je bijvoorbeeld auto's van Ferrari wilt vinden, typ je: <code>ferrari</code>"
    help_boolean: "<strong>Booleaans zoeken</strong> - als je Ferrari's wilt vinden die geen oldtimer zijn, gebruik je: <code>+ferrari -vintage</code>."
    help_fields: "<strong>Zoeken in specifieke velden</strong> - alle gegevens van een auto zijn doorzoekbaar. Als je bijvoorbeeld auto's met een bepaalde tag zoekt - zeg \"italy\" - gebruik je: <code>tags:\"italy\"</code>"
    help_fields_list: "Alle velden van een auto:"
    help_numeric: "<strong>Zoeken op getallen</strong> - je kunt op getallen zoeken, <code>spec.weight:>600</code> toont bijvoorbeeld alle auto's die zwaarder zijn dan 600 kg."
    help_numeric_list: "Alle beschikbare getalwaarden:"
    help_content_type: "<strong>Zoeken naar standaard-, DLC- en modcontent</strong> - met een (of meer) van de volgende termen vind je alleen standaard-, alleen DLC- of alleen modcontent: <code>+stock</code>, <code>+dlc</code>, <code>+mod</code>. Met een (of meer) van de volgende termen sluit je standaard-, DLC- of modcontent uit: <code>-stock</code>, <code>-dlc</code>, <code>-mod</code>."
    help_combine: "Je kunt dit alles natuurlijk in één zoekopdracht combineren! Dat ziet er bijvoorbeeld zo uit:"
    help_combine_example: "\"moet een Ferrari zijn\", \"mag geen oldtimer zijn\", \"moet de tag 'semiautomatic' hebben\", \"moet meer dan 600 pk hebben\", \"mag geen DLC zijn\"."
    help_bleve: ACPitwall gebruikt Bleve om te zoeken. Bleve is zeer krachtig en geeft veel controle over zoekopdrachten. Hier staan een paar voorbeelden, meer voorbeelden en de precieze syntax vind je in de <a href="{url}">documentatie van Bleve</a>.
