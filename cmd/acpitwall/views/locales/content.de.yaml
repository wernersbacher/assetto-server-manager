  search:
    submit: Suchen
    showing: Ergebnisse {from}-{to} von {total}
    took: Suche dauerte {duration}
    no_results: Deine Suche hat keine Treffer ergeben. Versuch es mit einer anderen Anfrage.
    help: Suchhilfe
    help_intro: Du kannst die Suche ähnlich wie Google oder jedes andere Suchfeld benutzen.
    help_basic: "<strong>Einfache Suche</strong> - wenn du zum Beispiel Autos zu Ferrari finden willst, gib ein: <code>ferrari</code>"
    help_boolean: "<strong>Boolesche Suche</strong> - wenn du Ferraris finden willst, die keine Oldtimer sind, nimm: <code>+ferrari -vintage</code>."
    help_fields: "<strong>Suche in bestimmten Feldern</strong> - alle Angaben eines Autos sind durchsuchbar. Wenn du zum Beispiel Autos mit einem bestimmten Tag suchst - etwa „italy“ - nimm: <code>tags:\"italy\"</code>"
    help_fields_list: "Alle Felder eines Autos:"
    help_numeric: "<strong>Suche nach Zahlenwerten</strong> - du kannst Zahlenwerte durchsuchen, zum Beispiel listet <code>spec.weight:>600</code> alle Autos mit mehr als 600 kg Gewicht."
    help_numeric_list: "Alle verfügbaren Zahlenwerte:"
    help_content_type: "<strong>Suche nach Standard-, DLC- und Mod-Inhalten</strong> - mit einem (oder mehreren) der folgenden Begriffe findest du nur Standard-, nur DLC- oder nur Mod-Inhalte: <code>+stock</code>, <code>+dlc</code>, <code>+mod</code>. Mit einem (oder mehreren) der folgenden Begriffe schließt du Standard-, DLC- oder Mod-Inhalte aus: <code>-stock</code>, <code>-dlc</code>, <code>-mod</code>."
    help_combine: "Natürlich kannst du all das in einer Anfrage kombinieren! Das könnte so aussehen:"
    help_combine_example: "„muss ein Ferrari sein“, „darf kein Oldtimer sein“, „muss den Tag ‚semiautomatic‘ haben“, „muss mehr als 600 PS haben“, „darf kein DLC sein“."
    help_bleve: ACPitwall nutzt Bleve für die Suche. Bleve ist sehr mächtig und bietet viel Kontrolle über Suchanfragen. Hier haben wir einige Beispiele gezeigt, weitere Beispiele und die genaue Syntax findest du in der <a href="{url}">Bleve-Dokumentation</a>.
