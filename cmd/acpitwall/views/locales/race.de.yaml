    finish_help: Dieses Event-Setup speichern und die Meisterschaft fertigstellen
    save: Event speichern
  rw:
    parent_sessions: Vorherige Session(s)
    entry_list: Entry List des Rennwochenendes
    parent_sessions_help: Die vorherige Session legt fest, aus welcher Session die Entry List dieser Session gebildet wird. Das Ergebnis der vorherigen Session (plus angewendete Filter) bildet die Startaufstellung dieser Session. Wird „Keine vorherige Session“ gewählt, werden alle anderen Auswahlen ignoriert.
    session_points: Punkte der Session
    session_points_help: Jede Session des Rennwochenendes und jede Meisterschaftsklasse hat ihre eigene Punktewertung. Training und Qualifying haben standardmäßig 0 Punkte, können aber Punkte vergeben, wenn du willst.
    overwrite: Dieses bearbeitete Setup überschreibt die {position} Session des Rennwochenendes <strong>{name}</strong>.
    added: Beim Speichern wird diese Session zum Rennwochenende <strong>{name}</strong> hinzugefügt. Du kannst unten weitere Sessions hinzufügen oder, wenn du fertig bist, die Einrichtung des Rennwochenendes hier abschließen.
    add_another: Weitere Session hinzufügen
    finish: Rennwochenende fertigstellen
    finish_help: Dieses Session-Setup speichern und das Rennwochenende fertigstellen
    save: Session speichern
  save:
    title: Eigenes Rennen speichern
    name: Name des eigenen Rennens
    name_placeholder: Ein Name, an dem du dieses Rennen erkennst
    name_help: Dieser Name wird auf der Seite „Eigene Rennen“ angezeigt.
    scheduled: Geplantes Rennen
    scheduled_help: Wenn beide Felder ausgefüllt sind, startet das Rennen zum geplanten Zeitpunkt.
    scheduled_server: Geplant auf Server
    scheduled_server_help: Der Server, auf dem das Rennen läuft, wenn oben eine Startzeit gesetzt ist.
    save_help: Dieses Setup speichern, ohne das Rennen zu starten
    start_help: Dieses Setup speichern und das Rennen starten
