    overwrite: Dieses bearbeitete Setup überschreibt das {position} Event der Meisterschaft <strong>{name}</strong>.
    added: Beim Speichern wird dieses Event zur Meisterschaft <strong>{name}</strong> hinzugefügt. Du kannst unten weitere Events hinzufügen oder, wenn du fertig bist, die Einrichtung der Meisterschaft hier abschließen.
