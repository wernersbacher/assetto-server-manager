  champ_settings:
    title: Renneinstellungen der Meisterschaft
    use: Renneinstellungen der Meisterschaft verwenden
    help: Wenn aktiv, werden Spritverbrauch, Schaden, Reifenverschleiß, erlaubte Reifen neben der Strecke, Fahrhilfen, virtueller Spiegel und dynamische Strecke dieses Events aus der Meisterschaft übernommen (bearbeite die Meisterschaft, um sie zu ändern). Die unten für dieses Event eingestellten Werte bleiben erhalten, werden aber ignoriert, solange dies aktiv ist.
    note: Die unten mit „von der Meisterschaft festgelegt“ markierten Einstellungen kommen aus der Meisterschaft.
    badge: von der Meisterschaft festgelegt
  champ_save:
    title: Meisterschaftsrennen speichern
    identical: Das Setup unter diesem Bereich entspricht dem Setup des Rennens, das du gerade konfiguriert hast. Wenn du mit diesen Einstellungen zufrieden bist, kannst du direkt ein weiteres Rennen anlegen. Wenn nicht, scrolle nach unten und passe die Konfiguration dieses Rennens an.
    added: Beim Speichern wird dieses Rennen zur Meisterschaft <strong>{name}</strong> hinzugefügt. Du kannst unten weitere Rennen hinzufügen oder, wenn du fertig bist, die Einrichtung der Meisterschaft hier abschließen.
