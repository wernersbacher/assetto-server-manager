    min_free_help: En upload afvises, hvis der bagefter ville være mindre end dette ledigt på disken.
  matrix:
    title: Hvad hver gruppe må
    read: Se løb, resultater, indhold, mesterskaber og live timing
    write: Oprette og redigere løb, mesterskaber og løbsweekender; uploade indhold; starte og stoppe serveren; se logs
    delete: Slette løb, mesterskaber, resultater og indhold; administrere AutoFill-deltagere
    admin: Serverindstillinger, plugins, konti, blacklist, beskeder, audit-logs og race control-kommandoer
    no_access: Konti i gruppen "Ingen adgang" kan slet ikke bruge ACPitwall.

