    title: Download af indhold
    intro: Hvem der må downloade biler, baner, setups og skins (billederne på siderne forbliver synlige). Content Manager får signerede, tidsbegrænsede skin-links og virker derfor stadig, når downloads er begrænset.
    public: Offentlig (alle med læseadgang, på en åben ACPitwall også anonymt)
    login: Kun loggede ind konti
    "off": Fra (kun admins)
  teams:
    intro: Kørere kan oprette teams, blive medlem af dem og tilmelde sig mesterskaber med dem. Konti med skriveadgang kan altid oprette teams og administrere alle teams.
