    creation_everyone: Alle konti kan oprette teams
    max: Teams pr. konto (som ejer)
    max_help: 0 er standarden på 3, -1 er ubegrænset.
  skins:
    title: Skins
    intro: Konti kan uploade skins til biler og holde dem private, dele dem med et team eller gøre dem globale. Konti med skriveadgang uploader altid globale skins. Grænserne beskytter disken; ubegrænset findes ikke, 0 bruger standarden i parentes.
    uploads: Skin-uploads fra brugere
    uploads_everyone: Alle loggede ind konti kan uploade skins
    global: Gøre skins globale
    global_everyone: Brugere kan dele deres skins globalt
    max_files: Filer pr. skin (standard {default})
