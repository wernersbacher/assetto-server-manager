# Generated from the struct tags of the forms (see form_catalog_test.go), do not edit:
# UPDATE_FORM_CATALOG=1 go test -run TestFormCatalog .
form:
  GlobalServerConfig:
    AdminPassword:
      help: 'The password needed to be recognized as server administrator: you can
        join the server using it to be recognized automatically. Type /help in the
        game''s chat to see the command list. Warning: Leaving this blank will allow
        any driver to connect as Admin!'
      label: Admin Password
    AssettoCorsaServer:
      label: Assetto Corsa Server
    AuthPluginAddress:
      help: The address of the auth plugin
      label: Auth Plugin Address
    BlacklistMode:
      help: How to handle blocklisting of players.
      label: BlockList mode
      option:
        "0": Normal kick, player can rejoin
        "1": Kicked player cannot rejoin until server restart
        "2": Kick player and add to blacklist.txt, kicked player can not rejoin unless
          removed from blacklist
    ClientSendIntervalInHertz:
      help: Refresh rate of packet sending by the server. 10Hz = ~100ms. Higher number
        = higher MP quality = higher bandwidth resources needed. Really high values
        can create connection issues
      label: Client Send Interval In Hertz
    ContentManagerIPOverride:
      help: When set, this overrides the IP address detected by the GeoIP service
        used for the Content Manager join link. This must be an IPv4 address.
      label: Content Manager IP Override
    ContentManagerIntegration:
      label: Content Manager Integration
    ContentManagerWrapperContentRequiresPassword:
      help: When on (and the server has a password) Content Manager is told that the
        linked content requires the server password. Downloads themselves are protected
        by signed URLs.
      label: Content Manager Wrapper Content Requires Password
    ContentManagerWrapperPort:
      help: The port on which to serve Content Manager with the above information.
        Please make sure this port is open on your firewall.
      label: Content Manager Wrapper Port
    CustomCSS:
      help: Customise the style of ACPitwall!
      label: Custom CSS
    DarkTheme:
      help: Enable ACPitwall's Dark Theme by default
      label: Dark Theme
    DiscordAPIToken:
      help: If set, will enable race start and scheduled reminder messages to the
        Discord channel ID specified below.  Use your bot's user token, not the OAuth
        token.
      label: Discord API Token
    DiscordChannelID:
      help: If Discord is enabled, this is the channel ID it will send messages to.  To
        find the channel ID, enable Developer mode in Discord (user settings, Appearance),
        then Server Settings, Roles, and right click on the channel and Copy ID.
      label: Discord Channel ID
    DiscordIntegration:
      label: Discord Integration
    DiscordRoleCommand:
      help: If the Discord Role ID is set, you can optionally specify a command string
        here, like "notify" (no ! prefix), which if run as a ! command by a user (on
        a line by itself) in Discord will cause this server to attempt to add the
        configured role to the user.  If you run multiple servers with Discord enabled,
        only set this on one of them.  In order for this to work your bot must have
        the "Manage Roles" permission.
      label: Discord Role Command
    DiscordRoleID:
      help: If set, this role will be mentioned in all Discord notifications.  Any
        users with this role and access to the channel will be pinged.  To find the
        role ID, enable Developer mode (see above)), then Server Settings, Roles,
        right click on the role and Copy ID.
      label: Discord Role ID
    EnableContentManagerWrapper:
      help: When on, this option makes ACPitwall provide extra information to Content
        Manager. This includes more detail about connected clients, event descriptions
        and download links. A side-effect of this is that your server name will contain
        a new piece of information (an 'i' character followed by a port - which Content
        Manager requires). Also - if enabled - this wrapper uses a GeoIP functionality
        provided by <a href='https://freegeoip.app''>freegeoip.app</a>.
      label: Enable Content Manager Wrapper
    FallBackResultsSorting:
      help: When on results will use a fallback method of sorting. Only enable this
        if you are experiencing results that are in the wrong order in the json file.
      label: Fall Back Results Sorting
    HTTPPort:
      help: 'Lobby port number: open these ports (both UDP and TCP) on your server''s
        firewall'
      label: HTTP Port
    KickQuorum:
      help: Percentage that is required for the kick vote to pass
      label: Kick Quorum
    LogACServerOutputToFile:
      help: When on, ACPitwall will output each Assetto Corsa session into a log file
        in the logs folder.
      label: Log AC Server Output To File
    Miscellaneous:
      label: Miscellaneous
    Name:
      help: Server Name
      label: Name
    NotificationReminderTimers:
      help: If Discord is enabled, a reminder will be sent this many minutes prior
        to race start.  If 0 or empty, only race start messages will be sent.  You
        may schedule multiple reminders by using a comma separated list like 120,15.
      label: Notification Reminder Timers
    NotifyWhenScheduled:
      help: Send a notification when a race is scheduled (or cancelled).
      label: Notify When Scheduled
    NumberOfACServerLogsToKeep:
      help: The number of AC Server logs to keep in the logs folder. (Oldest files
        will be deleted first. 0 = keep all files)
      label: Number Of AC Server Logs To Keep
    NumberOfThreads:
      help: Number of threads to run on
      label: Number Of Threads
    OGImage:
      help: Link to an image on the web here to set it as your default Open Graph
        image (will show in links)
      label: OG Image
    Password:
      help: Server password
      label: Password
    PreventWebCrawlers:
      help: When on, robots will be prohibited from indexing this manager by the robots.txt.
        Please note this will only deter well behaved bots, and not malware/spam bots
        etc.
      label: Prevent Web Crawlers
    ReceiveBufferSize:
      label: Receive Buffer Size
    RegisterToLobby:
      help: Register the AC Server to the main lobby
      label: Register To Lobby
    RestartEventOnServerManagerLaunch:
      help: When on, if ACPitwall is stopped while there is an event in progress,
        ACPitwall will try to restart the event when ACPitwall is restarted.
      label: Restart Event On Server Manager Launch
    SendBufferSize:
      label: Send Buffer Size
    ServerName:
      label: Server Name
    ServerNameTemplate:
      help: You can enter anything you like in here. If you put <code>{{ .ServerName
        }}</code> in, the Server Name will replace it. If you put <code>{{ .EventName
        }}</code>, then the Event Name will replace it. Note this only works if 'Show
        Race Name In Server Lobby' (above) is enabled.
      label: Server Name Template
    ShowContentManagerJoinLink:
      help: When on, this option will make ACPitwall display Content Manager join
        links on the Live Timing page and (if enabled) in Discord race start notifications.
      label: Show Content Manager Join Link
    ShowEventDetailsPopup:
      help: Allows all users to view a popup that describes in detail the setup of
        Custom Races, Championship Events and Race Weekend Sessions.
      label: Show Event Details Popup
    ShowPasswordInNotifications:
      help: Show the server password in race start notifications.
      label: Show Password In Notifications
    ShowRaceNameInServerLobby:
      help: When on, this option will make ACPitwall append the Custom Race or Championship
        name to the Server name in the lobby.
      label: Show Race Name In Server Lobby
    SleepTime:
      help: The use of this setting is not fully known. Leave the value as 1 unless
        you really know what you're doing. (Values other than 1 cause excessive CPU
        usage)
      label: Sleep Time
    TCPPort:
      help: 'TCP port number: open this port on your server''s firewall'
      label: TCP Port
    Theme:
      label: Theme
    UDPPluginAddress:
      help: The address of the plugin to which UDP messages are sent.  Please note
        that ACPitwall proxies UDP ports so that it can use them as well, for things
        such as Championships, Live Timings and the Map. This means that the UDP ports
        you see in the server_cfg.ini will be different to the ones you specify here.
        This is not an issue, and messages will be correctly sent/received on the
        UDP ports you specify here as well.
      label: UDP Plugin Address
    UDPPluginLocalPort:
      help: The port on which to listen for UDP messages from a plugin. Please note
        that ACPitwall proxies UDP ports so that it can use them as well, for things
        such as Championships, Live Timings and the Map. This means that the UDP ports
        you see in the server_cfg.ini will be different to the ones you specify here.
        This is not an issue, and messages will be correctly sent/received on the
        UDP ports you specify here as well.
      label: UDP Plugin Local Port
    UDPPort:
      help: 'UDP port number: open this port on your server''s firewall'
      label: UDP Port
    UseMPH:
      help: When on, this option will make ACPitwall use MPH instead of Km/h for all
        speed values.
      label: Use MPH
    UseShortenedDriverNames:
      help: When on, this option will make ACPitwall hide driver's last names, for
        example 'John Smith' becomes 'John S.'
      label: Use Shortened Driver Names
    VoteDuration:
      help: Vote length in seconds
      label: Vote Duration
    VotingQuorum:
      help: Percentage that is required for the session vote to pass
      label: Voting Quorum
  KissMyRankConfig:
    ACAppLinkUDPPort:
      help: The UDP port to be used to relay Kissmyrank events to compatible Assetto
        Corsa Game Apps (set to 0 to disable this feature). AC apps might connect
        to this port. Full documentation is available under /applink/doc. Demo app
        available under /applink/demo/.
      label: AC App Link UDP Port
    ACChatAdminGUIDList:
      help: One GUID per line. A list of the GUIDs for the drivers that can send Kissmyrank
        Admin Commands via the Assetto Corsa Chat (type '/kmr login password' in the
        chat to login and '/kmr command' to launch one of the supported commands).
      label: AC Chat Admin GUID List
    ACChatAdminPassword:
      help: The admin password to be used to login from the Assetto Corsa chat (type
        '/kmr login password' in the game chat to login).
      label: AC Chat Admin Password
    AlltimeFastestLapPrize:
      help: How much a driver will be paid for the fastest lap of all times  (in thousands).
        1.5 = 1500€.
      label: Alltime Fastest Lap Prize
    AntiCheatMaxClockDeltaConsecutiveHits:
      fieldset: Anti Cheat Max Clock Delta Consecutive Hits
    AnticheatLaptimeInvalidateMaxClockDelta:
      help: The maximum difference (in milliseconds) between the laptimes reported
        by the Assetto Corsa Server and those measured by the Plugin (with the hosting
        machine clock) before a laptime is rejected (e.g. to prevent the abuse where
        one can manipulate Assetto Corsa laptimes by acting on the CPU clock). Please
        keep in mind that this value needs to account for the natural delays in the
        communication between the plugin and the server. Do not set it too low or
        it might penalize drivers when your server is under stress. Use it only if
        your server has enough resources to process packets with steady delays. Set
        to 0 to disable.
      label: Anticheat Laptime Invalidate Max Clock Delta
    AnticheatPenalizeDriverMaxClockDeltaConsecutiveHits:
      help: The number of consecutive times a driver has to hit the max_clock_delta
        before getting the penalty defined in the penalty cost and penalty action
        maps. Set to 0 to disable.
      label: Anticheat Penalize Driver Max Clock Delta Consecutive Hits
    CarTowingCost:
      help: Car Towing Cost per Km. How much (in thousands) drivers will pay to tow
        their cars to the pits per Km. 0.05 = 50€ per Km (e.g. when they go back to
        the pits, a driver will pay 50€ for every km. Set to 0 to disable the feature
        altogether.
      label: Car Towing Cost
    ChatDriverWelcomeMessageShowRaceControlLink:
      help: Whether to show the Race Control link when a driver joins.
      label: Chat Driver Welcome Message Show Race Control Link
    CleanLapReward:
      help: How much (in thousands) a driver will be paid for a clean lap (e.g. lap
        without any cut). You can use this on practice servers (since race rewards
        will not work there).
      label: Clean Lap Reward
    CollisionMinimumDamageBetweenCars:
      help: The minimum damage cost (in thousands) under which collisions between
        cars will not be logged. Set this to 0 to log all collisions. 0.001 = do not
        log collisions with the environment below 1€.
      label: Collision Minimum Damage Between Cars
    CollisionMinimumDamageWithEnvironment:
      help: The minimum damage cost (in thousands) under which collisions with the
        environment will not be logged. Set this to 0 to log all collisions. 0.001
        = do not log collisions with the environment below 1€.
      label: Collision Minimum Damage With Environment
    ConnectionOptions:
      label: Connection Options
    CurrencySymbol:
      help: The symbol of the currency used for all drivers fines and payments (e.g.
        €,$,RUB).
      label: Currency Symbol
    CustomChatDriverWelcomeMessages:
      help: The custom chat messages that you wish to deliver when a driver connects.
        One per line.
      label: Custom Chat Driver Welcome Messages
    CutLineYourCustomCutLine:
      fieldset: Cut Line Your Custom Cut Line
    CutLinesEnabled:
      help: Enable cut lines. Set this to 0 if you wish to disable the cut_lines feature.
        Keep in mind that cut lines will only work if they are defined using the cut
        line drawer. To check the current cut lines, type cut_line_list in the console..
        For more, please check readme.txt.
      label: Cut Lines Enabled
    DamageCostBetweenCars:
      help: The cost (in thousands) of the damage of a collision between cars at the
        damage_cost_between_cars_base_speed. 3 = 3000€ (e.g. drivers will be charged
        3000€ if they collide at the specified relative base speed). Please notice
        that damage goes with the square of the relative velocity.
      label: Damage Cost Between Cars
    DamageCostBetweenCarsBaseSpeed:
      help: The base speed (in km/h) for damage_cost_between_cars.
      label: Damage Cost Between Cars Base Speed
    DamageCostWithEnvironment:
      help: The cost (in thousands) of the damage of a collision with the environment
        at damage_cost_with_environment_base_speed. 3 = 3000€ (e.g. drivers will be
        charged 3000€ if they collide with the environment at the specified relative
        base speed). Please notice that damage goes with the square of the velocity.
      label: Damage Cost With Environment
    DamageCostWithEnvironmentBaseSpeed:
      help: The base speed (in km/h) for damage_cost_with_environment.
      label: Damage Cost With Environment Base Speed
    Database:
      label: Database
    DatabaseSharingLocalGroupPort:
      help: Local Database Sharing Port for sharing the database with Kissmyrank instances
        running on the same machine. Set this to a valid port number If you wish to
        share the same database across different instances of the Kissmyrank plugin
        running on the same machine. You must set the port to the same value for all
        plugins that are members of the same sharing group (e.g. let's say that you
        have 4 Kissmyrank instances A,B,C,D and you want to use the same Kissmyrank
        database in couples with A sharing the same db with B and C and D sharing
        a separate one, you then set database_sharing_group_port config.json on KMR
        A and KMR B to 4567 and for KMR C and KMR D to 4568).
      label: Database Sharing Local Group Port
    DatabaseSharingRelayForNames:
      help: 'One per line. Remote Database Sharing Relay For Names. Warning: this
        key is not required for standard Database Sharing, it''s only required if
        you have lonely plugins (e.g. plugins connected to one instance and not to
        the others). Let''s say that you want to share the database between 3 plugins
        (A,B and C) and that you set database_sharing_unique_name to plugin_a, plugin_b,
        plugin_c respectively. Let''s say that you can only connect A<->B and B<->C
        but you can''t connect A with C directly. After properly setting all the other
        keys for (A<->B and B<->C), you then edit plugin_b config.json and add plugin_a
        and plugin_c to database_sharing_relay_for_names key. This will tell plugin
        B to relay information to the other plugin allowing you to do A<->B<->C. Keep
        in mind that in this case if you take down B, you have to also take down A
        and C or the synchronization might not fully apply. This feature works for
        both local and remote connections as long as you set the unique name. Be careful
        not to create double links between plugins or you might get double updates.'
      label: Database Sharing Relay For Names
    DatabaseSharingRemoteConnectToAddresses:
      help: One per line. Remote Database Sharing Connect to Addresses. The addresses
        of the remote plugins in the usual host:port format (where host is the IP/Address
        of the server that runs the plugin and port is the database_sharing_remote_listen_port
        that you set for that plugin). If you wish plugin A to share the database
        with the plugin B, you need to add hostA:portA to plugin B config.json and
        hostB:portB to plugin A config.json. For each plugin add all the ones that
        it should communicate with (excluding of course self or you'll start a loop).
        Don't connect two plugins with both local and remote sharing.
      label: Database Sharing Remote Connect To Addresses
    DatabaseSharingRemoteListenAddress:
      help: Remote Database Sharing Listen Address (change this only if you want to
        listen only on a specific interface, not recommended).
      label: Database Sharing Remote Listen Address
    DatabaseSharingRemoteListenPort:
      help: Remote Database Sharing Listen Port. Only use this if Local Database Sharing
        is not possible. Set this to a valid port number if you want to share the
        Database with a plugin running on a remote machine. Remote sharing might introduce
        lag so I recommend using Local Database Sharing whenever it's possible.
      label: Database Sharing Remote Listen Port
    DatabaseSharingRemoteSecretKey:
      help: Remote Database Sharing Secret Key. Only needed for remote sharing. This
        must be set to the same for all the hosts using Remote Database Sharing.
      label: Database Sharing Remote Secret Key
    DatabaseSharingUniqueName:
      help: Database Sharing Unique Name. Set a unique name for this plugin to better
        identify it in the logs. This is only cosmetic and completely optional.
      label: Database Sharing Unique Name
    DriveThroughNoKick:
      help: Whether to disable kick penalty when a Drive-Through is not cleared or
        when two Drive-Through events occur in a row.
      label: Drive Through No Kick
    DrivingLinePenaltyRepeatGrace:
      help: The minimum time (in seconds) between two consecutive cutting penalties
        (boundaries and cut lines). 6 = 6s (e.g. if a driver cuts twice in less than
        6s he will be only penalized once). Do not lower this too much to avoid penalty
        spam.
      label: Driving Line Penalty Repeat Grace
    EnableKissMyRank:
      label: Enable Kiss My Rank
    FirstBlood:
      fieldset: First Blood
    HotLapProtection:
      fieldset: Hot Lap Protection
    HotLappingCarCollision:
      fieldset: Hot Lapping Car Collision
    HotlapProtection:
      help: At what gap (in meters) should a car on an outlap receive the 'Let the
        other car pass' warning when it's about to get passed.
      label: Hotlap Protection
    ImprovingQualifyLapTimeWithInfractions:
      fieldset: Improving Qualify Lap Time With Infractions
    ImprovingQualifyLaptimeWithInfractionsCutoffPercent:
      help: The laptime (in percent of the session best) over which an improved time
        with cuts will not be considered an abuse. 107 = 107% (e.g. a driver posting
        a time with Kissmyrank infractions but no AC infractions that is above 107%
        of the fastest lap of the session will not trigger the penalty).
      label: Improving Qualify Laptime With Infractions Cutoff Percent
    JLPMoneyKillSwitch:
      help: Set this to 1 if, just like Captain Jean-Luc Picard, you do not want to
        use the money/point system at all (e.g. leagues, private servers and all people
        that are only interested in Kissmyrank Race Control and Tracking features).
        If you change this, you have to reset the database (e.g. perform a fresh install
        of the plugin).
      label: JLP Money Kill Switch
    LappingCarCollision:
      fieldset: Lapping Car Collision
    LappingProtection:
      fieldset: Lapping Protection
      help: At what gap (in meters) should a car that is being lapped get the 'Blue
        flag' warning when it's about to get passed.
      label: Lapping Protection
    LaptimeChallengeBaseAverageSpeed:
      help: Laptime Challenge Base Average Speed (km/h). 110=110km/h. A driver is
        Level 0 if he can drive a lap at 110 km/h average. Level 1 for 111 km/h and
        so on...
      label: Laptime Challenge Base Average Speed
    LaptimeChallengeBasePrize:
      help: Laptime Challenge Base Prize (in thousands). 0.01 = 10€. Reward is base*level
        (level 2 gets 20). Set to 0 to disable the Laptime Challenge feature.
      label: Laptime Challenge Base Prize
    LaptimeChallengeLevelAverageSpeedGap:
      help: The Average Speed Gap between two consecutive Laptime Challenge Levels
        in (km/h). 1=1km/h (e.g. Level 0 => 110km/h, Level 1 => 111km.
      label: Laptime Challenge Level Average Speed Gap
    LiveTrackView:
      help: Whether to enable the Live Track View (e.g. switch off if you wish to
        disable the Web Stats Live Map option).
      label: Live Track View
    MacCollisionsPer100kmRechargeHours:
      help: The base time (hours per collision unit) a driver exceeding max_collisions_per_100km
        has to wait before he can rejoin the server (e.g. if max_collisions_per_100km
        is set to 30, a driver with 31 collision per 100km will have to wait 1h form
        the last time he left the server, if 32, he will have to wait 2 hours and
        so on).
      label: Mac Collisions Per 100 km Recharge Hours
    MaxCollisions:
      fieldset: Max Collisions
      help: The maximum number of collision any user can be involved before receiving
        the penalties set in the penalty_cost and penalty_action maps.
      label: Max Collisions
    MaxCollisionsPer100km:
      help: The maximum amount of collisions per 100 km a driver is allowed on the
        server. This applies to drivers that have driven more than max_collisions_per_100km_min_distance.
      label: Max Collisions Per 100 km
    MaxCollisionsPer100kmMinDistance:
      help: The driven distance (in km) over which the max_collisions_per_100km will
        start to apply.
      label: Max Collisions Per 100 km Min Distance
    MaxInfractions:
      fieldset: Max Infractions
      help: The maximum number of times a driver is allowed to violate the server
        rules (cut track, speeding, pit exit line crossing etc.) before receiving
        the penalties set in the Penalty Costs and Penalty Actions.
      label: Max Infractions
    MaxPing:
      help: The maximum ping (in ms) a driver can have (the plugin will issue a warning
        if the instantaneous ping is over and kick the driver if the average is above
        the specified value for the last 4 measurements). Do not set this too low
        or it might affect server population. Set to 0 to disable the ping limit altogether.
      label: Max Ping
    MaxPingDeviation:
      help: The maximum ping deviation (in ms) drivers can have before their connection
        is considered unstable (the plugin will kick the driver if the standard ping
        deviation is above the specified value for the last 4 measurements). This
        is a measure of the connection instability which is important for MP racing.
        Set to 0 to disable.
      label: Max Ping Deviation
    MemoryMonitorEnabled:
      help: Whether to enable the memory monitor feature (on Linux it requires libc6
        2.14+). Enable this if you wish the plugin to monitor the memory usage (good
        to troubleshoot problems that might be related to the memory allocation).
      label: Memory Monitor Enabled
    MinMoney:
      help: Minimum amount of money (in thousands) a driver must have to stay on the
        server. 1 = 1000€ (e.g. -12 -> drivers with more than 12000€ of debt will
        be kicked). Please also check start_money in order to make sure that this
        value makes sense.
      label: Min Money
    MinimumDrivingStandard:
      help: Maximum allowed leaderboard time as a fraction of the fastest time. 1.1
        = 110% of the fastest time (e.g. a driver that is not able to set a time that
        is within 110% of the fastest lap time within minimum_driving_standard_laps
        laps will not be allowed in the server.
      label: Minimum Driving Standard
    MinimumDrivingStandardLaps:
      help: The number of valid laps that a driver has to complete in order to reach
        the minimum driving standard. A driver is given a second chance after a few
        days according to minimum_driving_standard_recharge_period.
      label: Minimum Driving Standard Laps
    MinimumDrivingStandardMinPlayers:
      help: Minimum number of players over which to enforce the minimum driving standards.
        If set to anything that is not 0, the driving standard policy will be enforced
        only if more than the specified number of players is present on server.
      label: Minimum Driving Standard Min Players
    MinimumDrivingStandardRechargePeriod:
      help: The number of seconds to recharge one lap to a driver that doesn't meet
        the standards (e.g. if minimum_driving_standard_laps is set to 12, this value
        sets the amount of time a player with 13 laps and a poor time has to wait
        before he can join the server again).
      label: Minimum Driving Standard Recharge Period
    Miscellaneous:
      label: Miscellaneous
    Money:
      label: Money
    NoMoney:
      help: Set this to ON if you wish to use points instead of money (no money, no
        party :D).
      label: No Money
    OvertakingUnderVirtualSafety:
      fieldset: Overtaking Under Virtual Safety
    ParkedCarDistance:
      help: The distance (in meters) a car must travel in parked_car_max_seconds not
        to trigger the detection. 24 = 24 meters (a car on the track that moves more
        than 24 meters in parked_car_seconds will not trigger the detection).
      label: Parked Car Distance
    ParkedCarMaxGrace:
      help: The amount of times a driver can trigger the parked car detection before
        he gets a penalty. 4 = 4 times (set to 0 to disable this detection).
      label: Parked Car Max Grace
    ParkedCarSeconds:
      help: The number of seconds for the car parked detection. 6 = 6s (e.g. a driver
        that is near the track and doesn't move more than the parked_car_distance
        in 6s will trigger the detection once).
      label: Parked Car Seconds
    ParkingNearTrack:
      fieldset: Parking Near Track
    PenaltyActions:
      AntiCheatMaxClockDeltaConsecutiveHits:
        Practice:
          help: DT0 for a drive through before the end of the lap. DT1 for a drive
            through before the end of the following lap and so on. DT given during
            qualify and practice will have to be cleared during the following race.
            K to kick immediately. TB30 to issue a temporary ban for 30 minutes. TB60
            to issue a temporary ban for 60 minutes.
          label: Practice
        Qualify:
          help: DT0 for a drive through before the end of the lap. DT1 for a drive
            through before the end of the following lap and so on. DT given during
            qualify and practice will have to be cleared during the following race.
            K to kick immediately. TB30 to issue a temporary ban for 30 minutes. TB60
            to issue a temporary ban for 60 minutes.
          label: Qualify
        Race:
          help: DT0 for a drive through before the end of the lap. DT1 for a drive
            through before the end of the following lap and so on. DT given during
            qualify and practice will have to be cleared during the following race.
            K to kick immediately. TB30 to issue a temporary ban for 30 minutes. TB60
            to issue a temporary ban for 60 minutes.
          label: Race
      CutLineYourCustomCutLine:
        Practice:
          help: DT0 for a drive through before the end of the lap. DT1 for a drive
            through before the end of the following lap and so on. DT given during
            qualify and practice will have to be cleared during the following race.
            K to kick immediately. TB30 to issue a temporary ban for 30 minutes. TB60
            to issue a temporary ban for 60 minutes.
          label: Practice
        Qualify:
          help: DT0 for a drive through before the end of the lap. DT1 for a drive
            through before the end of the following lap and so on. DT given during
            qualify and practice will have to be cleared during the following race.
            K to kick immediately. TB30 to issue a temporary ban for 30 minutes. TB60
            to issue a temporary ban for 60 minutes.
          label: Qualify
        Race:
          help: DT0 for a drive through before the end of the lap. DT1 for a drive
            through before the end of the following lap and so on. DT given during
            qualify and practice will have to be cleared during the following race.
            K to kick immediately. TB30 to issue a temporary ban for 30 minutes. TB60
            to issue a temporary ban for 60 minutes.
          label: Race
