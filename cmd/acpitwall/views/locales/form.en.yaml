    PingCheckInterval:
      help: The amount of seconds between two consecutive ping checks (decreasing
        this value might lead to high CPU usage). Set to 0 to disable the ping check
        feature altogether.
      label: Ping Check Interval
    PitExitLineCrossing:
      fieldset: Pit Exit Line Crossing
    PitLaneSpeeding:
      fieldset: Pit Lane Speeding
    PitSpeedLimit:
      help: The pit speed limit (in km/h). Above this speed the drive-through will
        be aborted. 80 = 80km/h (you might want to use 81 if you face the speed limiter
        bug). This value is required, please do not set to 0.
      label: Pit Speed Limit
    Protections:
      label: Protections
    QualifyTopThreeBasePrize:
      help: How much (in thousands) should the first three drivers be rewarded, if
        more than the specified number of players posted a valid qualify time. 0.5
        = 500€ (e.g. first gets 1500, second gets 1000, third gets 500€).
      label: Qualify Top Three Base Prize
    QualifyTopThreePrizeMinPlayers:
      help: How many players need to post a time before the pole prizes are assigned.
      label: Qualify Top Three Prize Min Players
    RaceControl:
      label: Race Control
    RaceControlCollisionReplayTime:
      help: Defines the number of seconds that the plugin should show for each car
        in the Race Control Collsion Replay.
      label: Race Control Collision Replay Time
    RaceControlCollisionSpace:
      help: Defines the maximum distance in meters between the two positions reported
        by the Assetto Corsa server for the same collision (to account for client-side
        discrepancies due to lag). Increase if collisions are reported twice.
      label: Race Control Collision Space
    RaceControlCollisionTime:
      help: Defines the maximum number of seconds that the Assetto Corsa server has
        to provide collision data for both cars. Increase if collisions are reported
        twice.
      label: Race Control Collision Time
    RaceControlCutReplayTime:
      help: Defines the number of seconds that the plugin should show for each car
        in the Race Control Cut Replay.
      label: Race Control Cut Replay Time
    RaceControlIncludePlayersNearerThan:
      help: Cars within this distance (in meters) from the car originating the Race
        Control Event will be included in the replay. 100 = 100m (e.g. if a car collides
        with another, all the drivers within 100 meters will be included in the replay).
      label: Race Control Include Players Nearer Than
    RaceControlLogOvertakes:
      help: Set this to 1 if you wish the plugin to log overtakes and add them to
        the Race Control viewer (this might use your memory and clutter the view to
        show events that are not strictly required for Race Control).
      label: Race Control Log Overtakes
    RaceControlMaxEvents:
      help: The maximum number of events that race control should display.
      label: Race Control Max Events
    RaceControlOvertakeReplayTime:
      help: Defines the number of seconds that the plugin should show for each car
        in the Race Control Overtake Replay.
      label: Race Control Overtake Replay Time
    RaceControlPassword:
      help: The password that Race Directors need to use to judge collisions via the
        Web Stats Page (needs to be at least 8 characters long or the feature will
        be disabled).
      label: Race Control Password
    RaceDriverEntryFee:
      help: How much a driver has to pay to enter a race session on the server (in
        thousands). 0.3 = 300€ (e.g. drivers will be charged 300€ at the beginning
        of each race).
      label: Race Driver Entry Fee
    RaceFastestLapPrize:
      help: How much a driver will be paid for the fastest lap of the race (in thousands).
        0.15 = 150€.
      label: Race Fastest Lap Prize
    RaceMassAccidentCrashTime:
      help: The time in seconds over which to evaluate race_mass_accident_crashed_players_percentage.
        30 = 30s.
      label: Race Mass Accident Crash Time
    RaceMassAccidentCrashedPlayersPercentage:
      help: The percentage of players that have to be involved in a collision within
        the specified mass_accident_crash_time before the plugin triggers the mass
        accident response (e.g. Virtual Safety Car or Automatic-Restart). 45 = 45%.
      label: Race Mass Accident Crashed Players Percentage
    RaceMassAccidentMinCrashedPlayers:
      help: The minimum number of players that have to crash for the mass accident
        response (e.g. to prevent the Virtual Safety Car coming out too often in servers
        with few players).
      label: Race Mass Accident Min Crashed Players
    RaceMassAccidentResponse:
      FirstLap:
        label: First Lap
      OtherLaps:
        label: Other Laps
      fieldset: Race Mass Accident Response
    RaceMinimumPlayers:
      help: Minimum number of players required to race (must be >=2 if you're using
        the money system). If there are not enough players the server will skip the
        race session.
      label: Race Minimum Players
    RacePodiumAnnouncement:
      help: Whether to announce the first three drivers at the end of the race.
      label: Race Podium Announcement
    RaceSponsorCleanGainOvertakes:
      help: How many clean overtakes are required for the sponsors to issue one clean
        gain reward (e.g. if you set this to 5 and the driver makes 5 clean overtakes
        he gets 1000€, if the overtakes are 10, he gets 2000€ etc.)
      label: Race Sponsor Clean Gain Overtakes
    RaceSponsorCleanGainReward:
      help: How much sponsors will reward a driver that makes 5 clean overtakes during
        the race (in thousands). 1 = 1000€. Clean overtakes are positions gained without
        collisions excluding gains made on drivers that disconnect during the race.
      label: Race Sponsor Clean Gain Reward
    RaceSponsorEntryFee:
      help: How much a sponsor pays to get the driver into the race (in thousands).
        1.5 = 1500€ (e.g. this, together with the race entry fee concurs to the total
        competition prize, the higher, the higher the race payouts).
      label: Race Sponsor Entry Fee
    RaceSponsorRewardBaseLength:
      help: The amount of km required to pay the full sponsor fee (e.g. if the sponsor
        fee configuration is 1000€ and  you set this to 35, for a race of 7 laps on
        a 5km circuit sponsors will contribute 1000€ for each car, if the laps are
        14 they will pay 2000€ for each car allowing for bigger prizes for longer
        races).
      label: Race Sponsor Reward Base Length
    RaceSponsorRewardBaseTime:
      help: The amount of minutes required to pay the full sponsor fee (e.g. if the
        sponsor fee configuration is 1000€ and you set this to 15, for a race of 15
        minutes sponsors will contribute 1000€ for each car, for 30 minutes they will
        pay 2000€ for each car allowing for bigger prizes for longer races).
      label: Race Sponsor Reward Base Time
    RankSortByWinStats:
      help: Sort rank by winning stats instead of money. If you change this you have
        to reset the database.
      label: Rank Sort By Win Stats
    RelativeHotlapProtection:
      help: At what gap (as a fraction of overall track length) should a car on an
        outlap get the 'Let the other car pass' warning when it's about to get passed.
        Only used if track length is missing. 1 is the full track length (0.008 is
        8/1000 of the full track length).
      label: Relative Hotlap Protection
    RelativeLappingProtection:
      help: At what gap (as a fraction of overall track length) should a car that
        is being lapped get the 'Blue flag' warning when it's about to get passed.
        Only used if track length is missing. 1 is the full track length (0.007 is
        7/1000 of the full track length).
      label: Relative Lapping Protection
    ReservedSlotsAccessKey:
      help: The key that VIP players need to use in the Kissmyrank Multiplayer Launcher
        Mod to access their reserved slot. Drivers with a reserved slot need to type
        this key in the Kissmyrank Multiplayer Launcher Mod input box (near the red
        question mark button on top of the server list) before they can access their
        reserved slot. If this configuration entry is not set the reserved slots feature
        will be disabled altogether.
      label: Reserved Slots Access Key
    ReservedSlotsBootPlayersAtRace:
      help: Whether to disable the Reserved Slots Player Booting feature during the
        race. Slots are freed per car starting from the bottom of the grid (so on
        a full grid it will most likely boot players that late joined or that are
        several laps down). You can set this to 1 if you wish to disable the reserved
        slot during the race session altogether. In this case, VIP players will have
        to wait for a slot to free up or for the next session.
      label: Reserved Slots Boot Players At Race
    ReservedSlotsGUIDList:
      help: One per line. A list of the GUIDs for the drivers that have a reserved
        slot on the server (requires the Kissmyrank Multiplayer Launcher Mod). If
        the server is full and one of these GUIDs attempts to join, a player will
        be kicked to make room.
      label: Reserved Slots GUID List
    ReverseGear:
      fieldset: Reverse Gear
    ReverseGearMaxDistance:
      help: The maximum distance in meters a driver is allowed to reverse on track
        (set to 0 to disable the penalty).
      label: Reverse Gear Max Distance
    RightToBeForgottenChatCommand:
      help: Whether to enable the 'kmr erase_personal_data_and_ban_myself' chat command
        which allows drivers to make use of their right to be forgotten and get all
        of their stats removed.
      label: Right To Be Forgotten Chat Command
    RollingStart:
      help: If you wish to use Kissmyrank Rolling Start at the beginning of a race.
      label: Rolling Start
    Rules:
      label: Rules
    SessionHistoryLength:
      help: Session history length. How many sessions we should keep in the memory.
        Setting this to a higher value will use more memory.
      label: Session History Length
    SlowingUnderVirtualSafetyCar:
      fieldset: Slowing Under Virtual Safety Car
    SpeedUnitFormat:
      help: The speed unit to be used when formatting data for public view. Allowed
        values are kmh and mph. Please note that this is only cosmetic for the end
        user and that you still need to use km/h for all the config purposes.
      label: Speed Unit Format
    SpeedingUnderVirtualSafetyCar:
      fieldset: Speeding Under Virtual Safety Car
    StartMoney:
      help: The money (in thousands) that any unranked player is given when he joins
        the server the first time (30=30000€). Please also check min_money in order
        to make sure that this value makes sense.
      label: Start Money
    ThousandSeparator:
      help: The symbol to be used to separate thousands (e.g. 19,000 or 19.000).
      label: Thousand Separator
    TimeBasedRaceExtraLap:
      help: Whether in a time based race the extra lap is enabled in the Assetto Corsa
        server_cfg.ini. If track rotation is active, the plugin will read the setting
        directly from the server_cfg.ini and ignore this value.
      label: Time Based Race Extra Lap
    TrackBoundaryCut:
      fieldset: Track Boundary Cut
    TrackBoundaryCutGainFilter:
      help: Whether to enable the Track Boundary Cut Gain filter which compares the
        cut advantage against the fastest lap of the session and doesn't give the
        penalty if the driver loses time against it.
      label: Track Boundary Cut Gain Filter
    TrackBoundaryCutGainFilterMinAverageSpeed:
      help: This speed (expressed in km/h) sets the floor speed of the Track Boundary
        Cut Gain filter. 45 = 45km/h (e.g. if a player during the cut wastes more
        time than traveling the interested track section at 45km/h the cut will be
        disregarded). This is only useful in the first laps when the comparison lap
        has not been acquired yet.
      label: Track Boundary Cut Gain Filter Min Average Speed
    TrackBoundaryCutGainFilterMinLossPercent:
      help: The minimum acceptable time loss (in percent) for the Track Boundary Cut
        Gain filter to ignore the cut. 6=6% (e.g. a driving losing more than 6% compared
        to the fastest laptime of the session will not incur in a penalty).
      label: Track Boundary Cut Gain Filter Min Loss Percent
    TrackBoundaryCutMaxSpeed:
      help: The maximum speed (in km/h) at which a driver is allowed to cross the
        track boundary.
      label: Track Boundary Cut Max Speed
    TrackBoundaryCutMaxTime:
      help: The maximum time (in seconds) between the cut start and the cut end (cuts
        outside this range will be regarded as out-of-track moments).
      label: Track Boundary Cut Max Time
    TrackBoundarySameLapCutMaxSpeed:
      help: The maximum speed (in km/h) at which a driver is allowed to cross the
        track boundary after the first violation (this both applies to track re-entry
        and to further cuts).
      label: Track Boundary Same Lap Cut Max Speed
    TrackBoundarySampleLength:
      help: The length (in meters) of a single track boundary length (max recommended
        value is 3). Increase this if you wish to save disk space at the expense of
        accuracy. Please notice that this value only applies to new data sets.
      label: Track Boundary Sample Length
    TrackRejoinMaxSpeed:
      fieldset: Track Rejoin Max Speed
      help: The maximum speed at which a driver is allowed to rejoin the track after
        going off track in an excluded area or stopping the car outside the track.
      label: Track Rejoin Max Speed
    UDPRelay:
      label: UDP Relay
    UDPReplayTo:
      help: One per line. Use this if you wish to relay UDP traffic to other plugins
        (e.g. Minorating, Stracker. etc.). It works like this AC Server <-> Kissmyrank
        Plugin <-> Other plugins. For each plugin you need to specify the address
        in the  ip_address:port format (e.g. for a plugin running on 127.0.0.1 with
        port 12003, you would replace UDP_PLUGIN_ADDRESS_1 with 127.0.0.1:12003).
        In order for this to work you then need to set the other plugin like if the
        Kissmyrank Plugin was the Assetto Corsa Server (e.g. for the default Kissmyrank
        config that runs on port 12000, you would set the other plugin ac_server_plugin_port
        to 12000 and the ac_server_ip to the IP of the machine where you're running
        the Kissmyrank Plugin). Check the console at start to see if the address is
        parsed correctly.
      label: UDP Replay To
    VSCDefaultLeaderSlowAllowOvertakeSpeed:
      help: This sets the speed in km/h under which the leader can be overtaken during
        Virtual Safety Car or the Rolling Start Formation Lap (e.g. not allowing a
        parked car to block everyone).
      label: VSC Default Leader Slow Allow Overtake Speed
    VSCDefaultSlowAndFarAllowOvertakeDistance:
      help: This sets the distance from the previous car over which a driver can be
        overtaken during the Virtual Safety Car or the Rolling Start Formation Lap
        if he's slower than vsc_defalut_slow_and_far_allow_overtake_speed.
      label: VSC Default Slow And Far Allow Overtake Distance
    VSCDefaultSlowAndFarAllowOvertakeSpeed:
      help: This sets the speed in km/h under which a driver can be overtaken during
        the Virtual Safety Car or the Rolling Start Formation Lap if he's farther
        than vsc_defalut_slow_and_far_allow_overtake_distance.
      label: VSC Default Slow And Far Allow Overtake Speed
    VSCDefaultSpeedLimit:
      help: The maximum speed (in km/h) a player is allowed to drive during a Virtual
        Safety Car.
      label: VSC Default Speed Limit
    VSCFormationLapFarAllowOvertakeDistance:
      help: This sets the distance from the previous car over which a driver can be
        overtaken during the Rolling Start Formation Lap (as during the formation
        lap cars need to be near to each other).
      label: VSC Formation Lap Far Allow Overtake Distance
    VSCFormationLapMinSpeed:
      help: The minimum speed (in km/h) a driver must drive above during the Rolling
        Start Formation Lap (set to 0 to disable).
      label: VSC Formation Lap Min Speed
    VSCFormationLapSpeedLimit:
      help: The maximum speed (in km/h) a player is allowed to drive during the Rolling
        Start Formation Lap.
      label: VSC Formation Lap Speed Limit
    VSCOvertakingMaxGrace:
      help: The number of seconds a driver has to give the position back when overtaking
        another car during a Virtual Safety Car or the Rolling Start Formation Lap.
      label: VSC Overtaking Max Grace
    VSCSlowingMaxGrace:
      help: The number of seconds a driver is allowed to slow down under the minimum
        speed during the Rolling Start Formation Lap.
      label: VSC Slowing Max Grace
    VSCSpeedingMaxGrace:
      help: The number of seconds a driver is allowed to drive over the speed limit
        during a Virtual Safety Car or the Rolling Start Formation Lap.
      label: VSC Speeding Max Grace
    VirtualSafetyCar:
      label: Virtual Safety Car
    WarnedCarGrace:
      help: The time in seconds every car is given to make room after the first warning.
        Increase to give more time to a warned driver to let the other car pass.
      label: Warned Car Grace
    WebAdminConsoleGuestPassword:
      help: Set this password to at least 8 characters if you wish to give view-only
        access to the Web Admin console. Please keep in mind that web_admin_console_password
        needs to be set to activate the console in first place. Furthermore please
        only give this password to trusted member as they will see everything that
        appears in the Kissmyrank console.
      label: Web Admin Console Guest Password
    WebAdminConsolePassword:
      help: Web Admin Console Password. The password (min 12 characters or the Kissmyrank
        Web Admin Interface will be forcefully disabled) that you will use to login
        to your Kissmyrank Web Admin Console at http://yourserver/kissmyrank_admin
        (when you open the page, if your password is 'yourcomplexpassword' you need
        to type 'login yourcomplexpassword' in order to gain access). Leave this key
        empty if you don't want to use the Kissmyrank Web Admin Console.
      label: Web Admin Console Password
    WebAuth:
      label: Web Auth
    WebAuthCacheTime:
      help: Time to cache the web auth result in seconds
      label: Web Auth Cache Time
    WebAuthRelayTo:
      help: One per line. Use this if you wish to also block users according to other
        plugins. Values are the same that you would set as the AUTH_PLUGIN_ADDRESS
        in the Assetto Corsa server_cfg.ini for the third-party plugin (e.g. for Minorating
        you would replace AUTH_PLUGIN_ADDRESS_1 with plugin.minorating.com:805/minodata/auth/ABCN/?).  You
        can of course also use another instance of the Kissmyrank Plugin Auth to get
        cross server blocking using the Kissmyrank AUTH_PLUGIN_ADDRESS from the other
        plugin instance. Check the console at the plugin start to see if the address
        is parsed correctly.
      label: Web Auth Relay To
    WebAuthServerAddress:
      help: Stats Web Auth Address (change this if you want to listen only on a certain
        interface, not recommended).
      label: Web Auth Server Address
    WebAuthServerPort:
      help: Stats Web Auth Port For linux don't use ports below 1024.
      label: Web Auth Server Port
    WebInterface:
      label: Web Interface
    WebStatsCacheTime:
      help: Time to cache the stats in seconds (decreasing might increase CPU usage)
      label: Web Stats Cache Time
    WebStatsDriversPerPage:
      help: Web Stats Drivers per page. Sets how many drivers per page will show on
        the Web Stats Drivers list.
      label: Web Stats Drivers Per Page
    WebStatsInterface:
      help: Whether to enable the web stats interface (required for Race Control and
        Race Director collision moderation).
      label: Web Stats Interface
    WebStatsOverridePublicAddress:
      help: Set this to your server public Web Stats address if you wish to override
        the plugin public address autodetection.
      label: Web Stats Override Public Address
    WebStatsOverridePublicPort:
      help: Set this to your server public Web Stats port if you wish to override
        the default setting (e.g. in case of a forward, proxy, redirect etc.).
      label: Web Stats Override Public Port
    WebStatsPublicURL:
      help: <strong>Please set up this value if you are using the web stats port!</strong>
        This should be set to the URL that anyone can access. This link will be displayed
        on ACPitwall's Live Timings page so that anybody can view the KMR interface.
        If this is left blank, no link will be shown on the Live Timings page!
      label: Web Stats Public URL
    WebStatsResultsShowLapLog:
      help: Set this to 1 if you wish the Web Stats Race Results viewer to include
        the lap log (which shows the times recorded for each player, the tyres he
        was on etc. on a per lap basis).
      label: Web Stats Results Show Lap Log
    WebStatsServerAddress:
      help: Stats Web Server Address (change this if you want to listen only on a
        certain interface, not recommended).
      label: Web Stats Server Address
    WebStatsServerPort:
      help: Stats Web Server Port. For linux read the troubleshooting section of the
        readme.txt help file.
      label: Web Stats Server Port
  RealPenaltyConfig:
    Admin:
      fieldset: Admin
    App:
      fieldset: App
    BlueFlag:
      fieldset: Blue Flag
    Crossing:
      fieldset: Crossing
    CustomShadersPatch:
      fieldset: Custom Shaders Patch
    Cutting:
      fieldset: Cutting
    DRS:
      fieldset: DRS
    General:
      fieldset: General
    Helicorsa:
      fieldset: Helicorsa
    JumpStart:
      fieldset: Jump Start
    NoPenalty:
      fieldset: No Penalty
    PluginsRelay:
      fieldset: Plugins Relay
    RealPenaltyACSettings:
      Admin:
        GUIDs:
          help: List of Steam GUIDs (separated by a semicolon) that can send commands
            to the server via chat
          label: GUIDs
      App:
        CheckFrequency:
          help: Frequency (seconds) for app check
          label: Check Frequency
        Mandatory:
          help: on = Real Penalty app is mandatory, off = Real Penalty app is not
            mandatory
          label: Mandatory
      CustomShadersPatch:
        CheckFrequency:
          help: Frequency (seconds) for Custom Shaders Patch check
          label: Check Frequency
        Mandatory:
          help: Set to ON if you want to force all drivers to have Custom Shaders
            Patch (version 0.1.46 or newer) to drive on the server. If you set this
            option true the app invalidates the lap time automatically
          label: Mandatory
      General:
        CarChecksum:
          help: Set to true if you want the additional car checksum (data.acd + collider.kn5,
            if these two files exist on the server)
          label: Car Checksum
        CockpitCamera:
          help: Set to true for mandatory cockpit visual for all drivers. For race
            Direction or live transmission insert the GUIDs under [No_Penalty] section
          label: Cockpit Camera
        FirstCheckTime:
          help: Delay (seconds) after connection of new driver for the first check
            (app + sol)
          label: First Check Time
        TrackChecksum:
          help: Set to true if you want an additional checksum of the track (model
            + kn5 files if they exist on the server)
          label: Track Checksum
        WeatherChecksum:
          help: Set to true if you want the weather checksum (if the weather exists
            on the server)
          label: Weather Checksum
      Helicorsa:
        CarLength:
          help: How long are the cars (in meters). Sorry, no data from AC available
          label: Car Length
        CarWidth:
          help: How wide are the cars (in meters). Sorry, no data from AC available
          label: Car Width
        DistanceThreshold:
          help: How far away are the cars we paint?
          label: Distance Threshold
        FrontFadeAngle:
          help: If a car in front is faded out, how soft should it fade? (again in
            degrees, 0 to disable = on/off)
          label: Front Fade Angle
        FrontFadeOutArc:
          help: Fade out cars in front of the player in an arc of X degrees (0 to
            disable)
          label: Front Fade Out Arc
        Mandatory:
          help: Set to true if the Helicorsa app is mandatory for the race
          label: Mandatory
        OpacityThreshold:
          help: 'Opacity threshold: At which distance (in meters) should the cars
            start to fade?'
          label: Opacity Threshold
        WorldZoom:
          help: World coordinates zoom or how big the bars are
          label: World Zoom
      NoPenalty:
        GUIDs:
          help: List of Steam GUIDs (separated by a semicolon) that can connect to
            the server without the app and sol (for example 'Race Direction' or for
            'Live')
          label: GUIDs
      SafetyCar:
        CarModel:
          help: Car model of safety car
          label: Car Model
        GreenLightDelay:
          help: 'Rolling start: delay of the green light after red signal (seconds)'
          label: Green Light Delay
        NormalizedLightOffPosition:
          help: 'Rolling start: normalized position (0 = start, 1 = end) of the first
            driver during rolling start when the app switches off the SC signal'
          label: Normalized Light Off Position
        NormalizedStartPosition:
          help: 'Rolling start: normalized position (0 = start, 1 = end) of the first
            driver during rolling start when the app switches on the red signal. START_NORMALIZED_POSITION
            must be greater than LIGHT_OFF_NORMALIZED_POSITION'
          label: Normalized Start Position
        RaceStartBehindSC:
          help: Set to true if race starts after the first lap behind Safety Car (it
            works with or without a real Safety Car on the server)
          label: Race Start Behind SC
      Sol:
        CheckFrequency:
          help: Frequency (seconds) for Sol check
          label: Check Frequency
        Mandatory:
          help: Set to true if the event is with mod Sol day to night transition
          label: Mandatory
        PerformanceModeAllowed:
          help: Set to true if Sol performance mode is allowed
          label: Performance Mode Allowed
    RealPenaltyAppConfig:
      General:
        AppTCPPort:
          help: Listening TCP port from AC app (to open in firewall/router). Must
            be one of 53000, 53001, 53002 to 53020, or the port of cfg AC server,
            HTTP_PORT + 27. The app will try all these ports on the ac server's ip
            address (until the right connection is found)
          label: App TCP Port
        AppUDPPort:
          help: Listening UDP port from AC app (to open in firewall/router). Any free
            UDP port is OK
          label: App UDP Port
        EnableRealPenalty:
          help: Turn Real Penalty on or off
          label: Enable Real Penalty
      PluginsRelay:
        OtherUDPPlugin:
          help: 'List of all other UDP plugins connected to AC Server (format: IP:Ports
            - separated by a semicolon)'
          label: Other UDP Plugin
        UDPPort:
          help: List of listening UDP ports for all other plugins connected (separated
            by a semicolon)
          label: UDP Port
    RealPenaltySettings:
      BlueFlag:
        QualifyTimeThreshold:
          help: Time distance (seconds) to show the blue flag in qualifying
          label: Qualify Time Threshold
        RaceTimeThreshold:
          help: Time distance (seconds) to show the blue flag in the race
          label: Race Time Threshold
      Crossing:
        PenaltyType:
          help: Penalty type for crossing. dt = drive through, sgn = stop and go n
            seconds, n = n seconds to add at the end of the race
          label: Penalty Type
      Cutting:
        EnableTyresDirtLevel:
          help: Tyres dirt for cutting
          label: Enable Tyres Dirt Level
        EnabledDuringSafetyCar:
          help: Cutting penalty enable during Safety Car or Virtual Safety Car
          label: Enabled During Safety Car
        MaxCutTime:
          help: The maximum time cut (in seconds) to trigger a warning. If you make
            this too long, off-track accidents may trigger cut warnings
          label: Max Cut Time
        MinSlowDownRatio:
          help: The minimum ratio of speed at leaving the track to speed at re-entering
            the track that will trigger a warning. A speed ratio under this means
            that the car has slowed, and negated any advantage gained, and a warning
            won't be triggered. 0.9 means the car is re-entering the track at 90%
            of the speed at which it left it. A value < 1 means the car has slowed
            during the cut; a value > 1 means the car has sped up
          label: Min Slow Down Ratio
        MinSpeed:
          help: The minimum speed, in kph, that will trigger a cut
          label: Min Speed
        PenaltyType:
          help: Penalty type for cutting. dt = drive through, sgn = stop and go n
            seconds, n = n seconds to add at the end of the race
          label: Penalty Type
        PostCuttingTime:
          help: Bonus time after reentering on the track. If speed decreases in this
            time --> No cutting! Set to 0 to have cutting checks similar to PLP (no
            check after re-entering the track)
          label: Post Cutting Time
        QualifyMaxSectorOutSpeed:
          help: Initial qualify max allowed speed on the start line after cutting
            in the last corner. IMPORTANT! Adjust this value in according to the track
            and the cars!
          label: Qualify Max Sector Out Speed
        QualifySlowDownSpeed:
          help: Slowing down to this speed (kph) will make the INVALID LAP, SLOW DOWN
            message in qualifying go away
          label: Qualify Slow Down Speed
        QualifySlowDownSpeedRatio:
          help: Ratio of the QUALIFY_MAX_SECTOR_OUT_SPEED. The max allowed speed on
            the start line after cutting = QUALIFY_MAX_SECTOR_OUT_SPEED (other new
            max speed of driver) * QUALIFY_SLOW_DOWN_SPEED_RATIO
          label: Qualify Slow Down Speed Ratio
        SecondsBetweenCuts:
          help: You won't get a cut until this many seconds after the last one
          label: Seconds Between Cuts
        TotalCutWarnings:
          help: How many warnings are allowed before a penalty is given
          label: Total Cut Warnings
        WheelsOut:
          help: The maximum number of wheels that are allowed to go off track
          label: Wheels Out
      DRS:
        BonusTime:
          help: How many seconds the DRS can remain open during each illegal use before
            the penalty
          label: Bonus Time
        EnabledAfterLaps:
          help: DRS enabled after N lap from start (+1 if rolling start with SC -
            file ac_settings.ini)
          label: Enabled After Laps
        EnabledDuringSafetyCar:
          help: DRS penalty enabled during Safety Car or Virtual Safety Car
          label: Enabled During Safety Car
        Gap:
          help: Max gap in seconds from front car
          label: Gap
        MaxIllegalUses:
          help: How many time the driver can open the illegal DRS in each sector before
            the penalty
          label: Max Illegal Uses
        MinSpeed:
          help: If the car speed < MIN SPEED no penalty for illegal DRS use
          label: Min Speed
        OmitCars:
          help: List of cars without DRS, semicolon separated.
          label: Omit Cars
        PenaltyType:
          help: Penalty type for illegal DRS use. dt = drive through, sgn = stop and
            go n seconds, n = n seconds to add at the end of the race
          label: Penalty Type
      General:
        EnableCrossingPenalties:
          help: Set to true to enable exit pit lane crossing line penalty
          label: Enable Crossing Penalties
        EnableCuttingPenalties:
          help: Set to true to enable cuttings penalties; false to issue warnings
            only
          label: Enable Cutting Penalties
        EnableDRSPenalties:
          help: Set to true to enable DRS penalty (only for car with DRS)
          label: Enable DRS Penalties
        EnableSpeedingPenalties:
          help: Set to true to enable pit lane speeding penalties
          label: Enable Speeding Penalties
        LapsToTakePenalty:
          help: How many laps a driver has to take a penalty in. If LAPS_TO_TAKE_PENALTY
            > 2 --> Jump start is always 2 for AC limit!
          label: Laps To Take Penalty
        LastLapsWithoutPenalty:
          help: If a divers gets a penalty in the last N laps (N = LAPS_TO_TAKE_PENALTY
            + LAST_LAPS_WITHOUT_PENALTY) can drive to the end of the race without
            taking it but receive time penalty! (Drive through = PENALTY_SECONDS,
            Stop & GO 10 = PENALTY_SECONDS + 10, .......)
          label: Last Laps Without Penalty
        LastTimeWithoutPenalty:
          help: Only for Time Race - Seconds at and of race to end race time (remember
            the optional +1 lap is extra) without mandatory penalty. All penalties
            not taken ----> Penalty seconds to add to the final race time (in chat
            and log). Default 360 (6 minutes). IMPORTANT! Adjust this value in according
            to the track, the cars and the additional lap (ca. 3/5 laps but in according
            to LAPS_TO_TAKE_PENALTY)
          label: Last Time Without Penalty
        PenaltySeconds:
          help: Number of seconds to add manually to the final race result for all
            penalties not taken during the race
          label: Penalty Seconds
      JumpStart:
        PenaltyType0:
          help: Penalty type for jump start. Don't set seconds penalty! dt = drive
            through, sgn = stop and go n seconds, dsq = disqualification --> kick
          label: Penalty Type 0
        PenaltyType1:
          label: Penalty Type 1
        PenaltyType2:
          label: Penalty Type 2
        SpeedLimitPenalty0:
          label: Speed Limit Penalty 0
        SpeedLimitPenalty1:
          help: Penalty type for jump start. Don't set seconds penalty! dt = drive
            through, sgn = stop and go n seconds, dsq = disqualification --> kick
          label: Speed Limit Penalty 1
        SpeedLimitPenalty2:
          help: Penalty type for jump start. Don't set seconds penalty! dt = drive
            through, sgn = stop and go n seconds, dsq = disqualification --> kick
          label: Speed Limit Penalty 2
      Speeding:
        PenaltyType0:
          help: Penalty type for speeding. dt = drive through, sgn = stop and go n
            seconds, n = n seconds to add at the end of the race, dsq = disqualification
            --> kick
          label: Penalty Type 0
        PenaltyType1:
          help: Penalty type for speeding. dt = drive through, sgn = stop and go n
            seconds, n = n seconds to add at the end of the race, dsq = disqualification
            --> kick
          label: Penalty Type 1
        PenaltyType2:
          help: Penalty type for speeding. dt = drive through, sgn = stop and go n
            seconds, n = n seconds to add at the end of the race, dsq = disqualification
            --> kick
          label: Penalty Type 2
        PitLaneSpeed:
          help: The speed, in kph, above which you will be deemed to be speeding in
            pits. Make this higher to give more leniency on pit lane entry
          label: Pit Lane Speed
        SpeedLimitPenalty0:
          label: Speed Limit Penalty 0
        SpeedLimitPenalty1:
          label: Speed Limit Penalty 1
        SpeedLimitPenalty2:
          label: Speed Limit Penalty 2
    SafetyCar:
      fieldset: Safety Car
    Sol:
      fieldset: Sol
    Speeding:
      fieldset: Speeding
  StrackerConfiguration:
    ACPlugin:
      ProxyPluginLocalPort:
        help: Proxy the AC server protocol on these ports, so multiple plugins may
          be chained (this is equivalent to UDP_PLUGIN_LOCAL_PORT in server_cfg.ini)
        label: Proxy Plugin Local Port
      ProxyPluginPort:
        help: Proxy the AC server protocol on these ports, so multiple plugins may
          be chained (this is equivalent to UDP_PLUGIN_ADDRESS in server_cfg.ini)
        label: Proxy Plugin Port
      ReceivePort:
        help: UDP port the plugins receives from. -1 means to use the AC servers setting
          UDP_PLUGIN_ADDRESS
        label: Receive Port
      SendPort:
        help: UDP port the plugins sends to. -1 means to use the AC servers setting
          UDP_PLUGIN_LOCAL_PORT
        label: Send Port
      fieldset: AC Plugin
    Database:
      DatabaseFile:
        help: Only relevant if database_type=sqlite3. Path to the stracker database.
          If a relative path is given, it is relative to the <stracker> executable
        label: Database File
      DatabaseType:
        help: Valid values are 'sqlite3' and 'postgres'. Selects the database to be
          used.
        label: Database Type
      PerformBackups:
        help: 'Set to OFF if you do not want stracker to backup the database before
          migrating to a new db version. Note: The backups will be created as sqlite3
          db in the current working directory.'
        label: Perform Backups
      PostgresDatabaseName:
        help: The name of the postgres database
        label: Postgres Database Name
      PostgresHostname:
        help: Name of the host running the postgresql server.
        label: Postgres Hostname
      PostgresPassword:
        help: Postgresql user password
        label: Postgres Password
      PostgresUsername:
        help: Name of the postgresql user
        label: Postgres Username
      fieldset: Database
    DatabaseCompression:
      Interval:
        help: Interval of database compression in minutes
        label: Interval
      Mode:
        help: Various options to minimize database size. Valid values are 'none' (no
          compression, save all available infos), 'remove_slow_laps' (save detailed
          infos for fast laps only) and 'remove_all' (save no detailed lap info).
        label: Mode
      NeedsEmptyServer:
        help: If set to ON database compression will only take place if the server
          is empty.
        label: Needs Empty Server
      fieldset: Database Compression
    EnableStracker:
      help: Turn Stracker on or off
      label: Enable Stracker
    HTTPConfiguration:
      AdminPassword:
        help: Password for the stracker admin pages. Leaving empty results in disabled
          admin pages
        label: Admin Password
      AdminUsername:
        help: Username for the stracker admin pages. Leaving empty results in disabled
          admin pages
        label: Admin Username
      AuthBanAnonymisedPlayers:
        help: Add anonymized players to blacklist.
        label: Auth Ban Anonymised Players
      AuthLogFile:
        help: Set to a file to be used for logging http authentication requests. Useful
          to prevent attacks with external program (e.g., fail2ban).
        label: Auth Log File
      Banner:
        help: Icon to be used in webpages (leave empty for default Assetto Corsa icon)
        label: Banner
      EnableSVGGeneration:
        help: Set to OFF if you do not want svg graphs in the http output (for saving
          bandwidth)
        label: Enable SVG Generation
      Enabled:
        label: Enabled
      InverseNavbar:
        help: Set to true to get the navbar inverted (i.e., dark instead of bright)
        label: Inverse Navbar
      ItemsPerPage:
        help: Number of items displayed per page
        label: Items Per Page
      LapTimesAddColumns:
        help: Additional columns to be displayed in LapTimes table (separated by a
          + sign). Columns can be 'valid', 'aids', 'laps', 'date', 'grip', 'cuts',
          'collisions', 'tyres', 'temps', 'ballast' and 'vmax'. Note that too many
          displayed columns might cause problems on some browsers.
        label: Lap Times Add Columns
      ListenAddress:
        help: Listening address of the http server (normally there is no need to change
          the default value 0.0.0.0 which means that the whole internet can connect
          to the server)
        label: Listen Address
      ListenPort:
        help: TCP listening port of the http server
        label: Listen Port
      LogRequests:
        help: If set to ON, http requests will be logged in stracker.log. Otherwise
          they are not logged.
        label: Log Requests
      MaximumStreamingClients:
        help: Maximum number of streaming clients (LiveMap/Log users) allowed to connect
          to this server in parallel. The number of threads allocated for http serving
          will be max(10, max_streaming_clients + 5)
        label: Maximum Streaming Clients
      PublicURL:
        help: This allows you to manually specify the URL on which the sTracker web
          interface is running. This link will be displayed on ACPitwall's Live Timings
          page so that anybody can view the sTracker interface. If this is left blank,
          an older and <em>unrecommended</em> ACPitwall proxying method will be used
          to display the sTracker interface!
        label: Public URL
      SSL:
        help: Set to true if you want to use https. Note that you need a SSL certificate
          and key. If you enable this option, you can reach stracker at https://ip:port/
          instead of http://ip:port/
        label: SSL
      SSLCertificate:
        help: Path to the SSL certificate for https. Only used when ssl is True. A
          self-signed certificate can be generated with 'openssl req -new -x509 -days
          365 -key privkey.pem -out cert.pem'
        label: SSL Certificate
      SSLPrivateKey:
        help: ath to the SSL private key for https. Only used when ssl is True. A
          private key can be generated with 'openssl genrsa -out privkey.pem 2048'
        label: SSL Private Key
      TemperatureUnit:
        help: Valid values are 'degc' or 'degf'
        label: Temperature Unit
      VelocityUnit:
        help: Valid values are 'kmh' or 'mph'
        label: Velocity Unit
      fieldset: HTTP Configuration
    InstanceConfiguration:
      ACServerAddress:
        help: 'Server ip address or name used to poll results from. You should not
          touch the default value: 127.0.0.1'
        label: AC Server Address
      AppendLogFile:
        help: Set to ON, if you want to append to log files rather than overwriting
          them. Only meaningful with an external log file rotation system.
        label: Append Log File
      IDBasedOnDriverNames:
        help: You normally want to leave this at the default (OFF). Use case for this
          is an environment where the same steam account is used by different drivers.
        label: ID Based On Driver Names
      KeepAlivePtrackerConnections:
        help: Set to OFF if you want to disable the TCP keep_alive option (that was
          the behaviour pre 3.1.7).
        label: Keep Alive Ptracker Connections
      ListeningPort:
        help: Listening port for incoming connections of ptracker. Must be one of
          50042, 50043, 54242, 54243, 60023, 60024, 62323, 62324, 42423, 42424, 23232,
          23233, AC udp port +42; ptracker will try all these ports on the ac server's
          ip address (until a better solution is found...)
        label: Listening Port
      LogFile:
        help: Name of the stracker log file (utf-8 encoded), all messages go into
          there
        label: Log File
      LogLevel:
        help: Valid values are 'info', 'debug' and 'dump'. Use 'dump' only for problem
          analysis, log files can get very big.
        label: Log Level
      LogTimestamps:
        help: Set to ON if you want the log messages to be prefixed with a timestamp
        label: Log Timestamps
      LowerPriority:
        help: Set to ON if you want stracker to reduce its priority. Will use BELOW_NORMAL
          on windows and nice(5) on linux.
        label: Lower Priority
      PerformChecksumComparisons:
        help: Set to ON if you want stracker to compare the players checksums.
        label: Perform Checksum Comparisons
      PtrackerConnectionMode:
        help: 'Configure which ptracker instances shall be allowed to connect: Valid
          values are ''any'', ''newer'' or ''none''.'
        label: Ptracker Connection Mode
      ServerName:
        help: Name for the server; sessions in the database will be tagged with that
          name; useful when more than one server is running in parallel on the same
          database
        label: Server Name
      TeeToStdout:
        help: Set to ON if you want the messages appear on stdout (in ACPitwall's
          plugin logs)
        label: Tee To Stdout
      fieldset: Instance Configuration
    LapValidChecks:
      InvalidateOnCarCollisions:
        help: If ON, collisions with other cars will invalidate laps
        label: Invalidate On Car Collisions
      InvalidateOnEnvironmentCollisions:
        help: If ON, collisions with environment objects will invalidate laps
        label: Invalidate On Environment Collisions
      PtrackerAllowedTyresOut:
        help: 'If -1: use server penalty setting, if available, otherwise use 2. All
          other values are passed to ptracker.'
        label: Ptracker Allowed Tyres Out
      fieldset: Lap Valid Checks
    Messages:
      BestLapTimeBroadcastThreshold:
        help: Lap times below this threshold (in percent of the best time) will be
          broadcasted as best laps. Lap times above this will be whispered to the
          player achieving it.
        label: Best Lap Time Broadcast Threshold
      CarToCarCollisionMessage:
        help: Set to ON to enable car to car private messages.
        label: Car To Car Collision Message
      MessageTypesToSendOverChat:
        help: Available message types are 'enter_leave','best_lap','checksum_errors','welcome','race_finished'
          and 'collision'. Connect them using a + sign without spaces.
        label: Message Types To Send Over Chat
      fieldset: Messages
    SessionManagement:
      RaceOverStrategy:
        help: 'What to do when the race is over and no player is actively racing.
          Valid values are: ''none'' or ''skip''.'
        label: Race Over Strategy
      WaitSecondsBeforeSkip:
        help: Number of seconds to wait before the session skip is executed (if Race
          Over Strategy is set to 'skip')
        label: Wait Seconds Before Skip
      fieldset: Session Management
    SwearFilter:
      Action:
        help: Valid values are 'none', 'kick' and 'ban'
        label: Action
      BanDuration:
        help: The number of days to ban a player for (if the Action is 'ban')
        label: Ban Duration
      NumberOfWarnings:
        help: The number of warnings issued before the player is kicked
        label: Number Of Warnings
      SwearFile:
        help: A file with bad words to be used for filtering
        label: Swear File
      Warning:
        help: The message sent to a player after swear detection
        label: Warning
      fieldset: Swear Filter
    WelcomeMessage:
      Line1:
        label: Line 1
      Line2:
        label: Line 2
      Line3:
        label: Line 3
      Line4:
        label: Line 4
      Line5:
        label: Line 5
      Line6:
        label: Line 6
      fieldset: Welcome Message
