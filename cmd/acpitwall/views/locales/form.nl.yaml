    DamageCostBetweenCars:
      help: 'De kosten (in duizenden) van de schade bij een botsing tussen auto''s bij
        damage_cost_between_cars_base_speed. 3 = 3000€ (bijv. coureurs betalen 3000€
        als ze bij de opgegeven relatieve basissnelheid botsen). Let op: de schade groeit
        met het kwadraat van de relatieve snelheid.'
