      label: Prijs snelste ronde aller tijden
    AntiCheatMaxClockDeltaConsecutiveHits:
      fieldset: 'Anticheat: max. klokafwijking opeenvolgend bereikt'
    AnticheatLaptimeInvalidateMaxClockDelta:
      help: Het maximale verschil (in milliseconden) tussen de rondetijden die de Assetto
        Corsa-server meldt en die de plugin meet (met de klok van de hostmachine) voordat
        een rondetijd wordt afgekeurd (bijv. om misbruik te voorkomen waarbij iemand
        Assetto Corsa-rondetijden manipuleert via de CPU-klok). Houd er rekening mee
        dat deze waarde ruimte moet laten voor de natuurlijke vertraging in de communicatie
        tussen plugin en server. Zet hem niet te laag, anders kan hij coureurs bestraffen
        als je server zwaar belast is. Gebruik dit alleen als je server genoeg resources
        heeft om pakketten met een constante vertraging te verwerken. 0 om uit te schakelen.
      label: 'Anticheat: rondetijd ongeldig bij max. klokafwijking'
    AnticheatPenalizeDriverMaxClockDeltaConsecutiveHits:
      help: Hoe vaak achter elkaar een coureur de max_clock_delta moet bereiken voordat
