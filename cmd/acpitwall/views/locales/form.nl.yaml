# Dutch translation of form.en.yaml (generated from the struct tags of the forms).
form:
  GlobalServerConfig:
    AdminPassword:
      help: "Het wachtwoord waarmee je als serverbeheerder wordt herkend: als je met dit wachtwoord op de server joint, word je automatisch als admin herkend. Typ /help in de chat van het spel om de lijst met commando's te zien. Let op: als je dit leeg laat, kan elke coureur als admin verbinden!"
      label: Adminwachtwoord
    AssettoCorsaServer:
      label: Assetto Corsa Server
    AuthPluginAddress:
      help: "Het adres van de auth-plugin"
      label: Adres auth-plugin
    BlacklistMode:
      help: "Hoe met geblokkeerde spelers wordt omgegaan."
      label: Blokkeerlijstmodus
      option:
        "0": Normale kick, speler kan opnieuw joinen
        "1": Gekickte speler kan pas na een herstart van de server opnieuw joinen
        "2": Speler kicken en aan blacklist.txt toevoegen, gekickte speler kan pas opnieuw joinen als hij van de blokkeerlijst is verwijderd
    ClientSendIntervalInHertz:
      help: "Verversingsfrequentie waarmee de server pakketten verstuurt. 10Hz = ~100ms. Hogere waarde = betere MP-kwaliteit = meer bandbreedte nodig. Erg hoge waarden kunnen verbindingsproblemen veroorzaken"
      label: Verzendinterval client in hertz
    ContentManagerIPOverride:
      help: "Als dit is ingesteld, vervangt het het IP-adres dat de GeoIP-dienst heeft bepaald voor de Content Manager-joinlink. Dit moet een IPv4-adres zijn."
      label: Content Manager-IP overschrijven
    ContentManagerIntegration:
      label: Content Manager-integratie
    ContentManagerWrapperContentRequiresPassword:
      help: "Als dit aan staat (en de server een wachtwoord heeft), krijgt Content Manager te horen dat de gelinkte content het serverwachtwoord vereist. De downloads zelf zijn beschermd met ondertekende URL's."
      label: "Content Manager Wrapper: content vereist wachtwoord"
    ContentManagerWrapperPort:
      help: "De poort waarop Content Manager de bovenstaande informatie krijgt. Zorg dat deze poort in je firewall open staat."
      label: Content Manager Wrapper-poort
    CustomCSS:
      help: "Pas de stijl van ACPitwall aan!"
      label: Eigen CSS
    DarkTheme:
      help: "Het donkere thema van ACPitwall standaard inschakelen"
      label: Donker thema
    DiscordAPIToken:
      help: "Als dit is ingesteld, worden berichten bij de racestart en geplande herinneringen naar het hieronder opgegeven Discord-kanaal-ID gestuurd.  Gebruik het user-token van je bot, niet het OAuth-token."
      label: Discord API-token
    DiscordChannelID:
      help: "Als Discord is ingeschakeld, is dit het kanaal-ID waar berichten naartoe worden gestuurd.  Om het kanaal-ID te vinden, schakel je in Discord de ontwikkelaarsmodus in (gebruikersinstellingen, Weergave), daarna Serverinstellingen, Rollen, klik met rechts op het kanaal en kies ‘ID kopiëren’."
      label: Discord-kanaal-ID
    DiscordIntegration:
      label: Discord-integratie
    DiscordRoleCommand:
      help: "Als het Discord-rol-ID is ingesteld, kun je hier optioneel een commando opgeven, zoals ‘notify’ (zonder !-prefix). Als een gebruiker dit in Discord als !-commando uitvoert (alleen op een regel), probeert deze server de ingestelde rol aan de gebruiker toe te wijzen.  Als je meerdere servers met Discord draait, stel dit dan maar op één ervan in.  Om dit te laten werken, heeft je bot de permissie ‘Rollen beheren’ nodig."
      label: Discord-rolcommando
    DiscordRoleID:
      help: "Als dit is ingesteld, wordt deze rol in alle Discord-meldingen genoemd.  Alle gebruikers met deze rol en toegang tot het kanaal worden gepingd.  Om het rol-ID te vinden, schakel je de ontwikkelaarsmodus in (zie boven), daarna Serverinstellingen, Rollen, klik met rechts op de rol en kies ‘ID kopiëren’."
      label: Discord-rol-ID
    EnableContentManagerWrapper:
      help: "Als dit aan staat, geeft ACPitwall extra informatie aan Content Manager. Daaronder vallen meer details over verbonden clients, eventbeschrijvingen en downloadlinks. Een bijeffect is dat je servernaam een extra stukje informatie bevat (een 'i' gevolgd door een poort, die Content Manager nodig heeft). Ook gebruikt deze wrapper (als hij is ingeschakeld) een GeoIP-functie van <a href='https://freegeoip.app'>freegeoip.app</a>."
      label: Content Manager Wrapper inschakelen
    FallBackResultsSorting:
      help: "Als dit aan staat, worden uitslagen met een alternatieve methode gesorteerd. Schakel dit alleen in als de uitslagen in het json-bestand in de verkeerde volgorde staan."
      label: Alternatieve sortering van uitslagen
    HTTPPort:
      help: "Poortnummer van de lobby: open deze poorten (zowel UDP als TCP) in de firewall van je server"
      label: HTTP-poort
    KickQuorum:
      help: "Percentage dat nodig is om een kick-stemming te laten slagen"
      label: Kick-quorum
    LogACServerOutputToFile:
      help: "Als dit aan staat, schrijft ACPitwall elke Assetto Corsa-sessie naar een logbestand in de map logs."
      label: Uitvoer van de AC-server naar bestand loggen
    Miscellaneous:
      label: Overig
    Name:
      help: "Servernaam"
      label: Naam
    NotificationReminderTimers:
      help: "Als Discord is ingeschakeld, wordt zoveel minuten voor de racestart een herinnering gestuurd.  Bij 0 of leeg worden alleen berichten bij de racestart gestuurd.  Je kunt meerdere herinneringen plannen met een kommagescheiden lijst, zoals 120,15."
      label: Timers voor herinneringen
    NotifyWhenScheduled:
      help: "Stuur een melding als een race wordt gepland (of geannuleerd)."
      label: Melden bij planning
    NumberOfACServerLogsToKeep:
      help: "Het aantal AC-serverlogs dat in de map logs bewaard blijft. (De oudste bestanden worden eerst verwijderd. 0 = alle bestanden bewaren)"
      label: Aantal te bewaren AC-serverlogs
    NumberOfThreads:
      help: "Aantal threads waarop de server draait"
      label: Aantal threads
    OGImage:
      help: "Link hier naar een afbeelding op het web om die als standaard Open Graph-afbeelding in te stellen (wordt getoond in links)"
      label: OG-afbeelding
    Password:
      help: "Serverwachtwoord"
      label: Wachtwoord
    PreventWebCrawlers:
      help: "Als dit aan staat, verbiedt robots.txt robots om deze manager te indexeren. Let op: dit houdt alleen nette bots tegen, geen malware- of spambots enz."
      label: Webcrawlers blokkeren
    ReceiveBufferSize:
      label: Grootte ontvangstbuffer
    RegisterToLobby:
      help: "De AC-server registreren in de hoofdlobby"
      label: In lobby registreren
    RestartEventOnServerManagerLaunch:
      help: "Als dit aan staat en ACPitwall wordt gestopt terwijl er een event bezig is, probeert ACPitwall het event opnieuw te starten zodra ACPitwall weer opstart."
      label: Event herstarten bij het starten van ACPitwall
    SendBufferSize:
      label: Grootte verzendbuffer
    ServerName:
      label: Servernaam
    ServerNameTemplate:
      help: "Hier kun je invullen wat je wilt. Als je <code>{{ .ServerName }}</code> invoegt, wordt dat vervangen door de servernaam. Als je <code>{{ .EventName }}</code> invoegt, wordt dat vervangen door de eventnaam. Dit werkt alleen als ‘Racenaam in serverlobby tonen’ (boven) is ingeschakeld."
      label: Sjabloon servernaam
    ShowContentManagerJoinLink:
      help: "Als dit aan staat, toont ACPitwall Content Manager-joinlinks op de Live Timing-pagina en (indien ingeschakeld) in de Discord-meldingen bij de racestart."
      label: Content Manager-joinlink tonen
    ShowEventDetailsPopup:
      help: "Laat alle gebruikers een popup zien die de opzet van Custom Races, kampioenschapsevents en Race Weekend-sessies gedetailleerd beschrijft."
      label: Popup met eventdetails tonen
    ShowPasswordInNotifications:
      help: "Het serverwachtwoord tonen in de meldingen bij de racestart."
      label: Wachtwoord in meldingen tonen
    ShowRaceNameInServerLobby:
      help: "Als dit aan staat, voegt ACPitwall de naam van de Custom Race of het kampioenschap toe aan de servernaam in de lobby."
      label: Racenaam in serverlobby tonen
    SleepTime:
      help: "Het nut van deze instelling is niet helemaal bekend. Laat de waarde op 1 staan, tenzij je echt weet wat je doet. (Andere waarden dan 1 veroorzaken overmatig CPU-gebruik)"
      label: Sleep Time
    TCPPort:
      help: "TCP-poortnummer: open deze poort in de firewall van je server"
      label: TCP-poort
    Theme:
      label: Thema
    UDPPluginAddress:
      help: "Het adres van de plugin waar UDP-berichten naartoe worden gestuurd.  Let op: ACPitwall proxyt de UDP-poorten, zodat het ze zelf ook kan gebruiken, bijvoorbeeld voor kampioenschappen, Live Timings en de kaart. Daardoor wijken de UDP-poorten in server_cfg.ini af van de poorten die je hier opgeeft. Dat is geen probleem: berichten worden ook op de hier opgegeven UDP-poorten correct verstuurd en ontvangen."
      label: Adres UDP-plugin
    UDPPluginLocalPort:
      help: "De poort waarop naar UDP-berichten van een plugin wordt geluisterd. Let op: ACPitwall proxyt de UDP-poorten, zodat het ze zelf ook kan gebruiken, bijvoorbeeld voor kampioenschappen, Live Timings en de kaart. Daardoor wijken de UDP-poorten in server_cfg.ini af van de poorten die je hier opgeeft. Dat is geen probleem: berichten worden ook op de hier opgegeven UDP-poorten correct verstuurd en ontvangen."
      label: Lokale poort UDP-plugin
    UDPPort:
      help: "UDP-poortnummer: open deze poort in de firewall van je server"
      label: UDP-poort
    UseMPH:
      help: "Als dit aan staat, gebruikt ACPitwall MPH in plaats van km/h voor alle snelheden."
      label: MPH gebruiken
    UseShortenedDriverNames:
      help: "Als dit aan staat, verbergt ACPitwall de achternamen van coureurs, zo wordt 'John Smith' bijvoorbeeld 'John S.'"
      label: Verkorte coureursnamen gebruiken
    VoteDuration:
      help: "Duur van een stemming in seconden"
      label: Stemduur
    VotingQuorum:
      help: "Percentage dat nodig is om een sessie-stemming te laten slagen"
      label: Stem-quorum
  RealPenaltyConfig:
    Admin:
      fieldset: Admin
    App:
      fieldset: App
    BlueFlag:
      fieldset: Blauwe vlag
    Crossing:
      fieldset: Overschrijden
    CustomShadersPatch:
      fieldset: Custom Shaders Patch
    Cutting:
      fieldset: Cutting
    DRS:
      fieldset: DRS
    General:
      fieldset: Algemeen
    Helicorsa:
      fieldset: Helicorsa
    JumpStart:
      fieldset: Valse start
    NoPenalty:
      fieldset: Geen straf
    PluginsRelay:
      fieldset: Plugins-relay
    RealPenaltyACSettings:
      Admin:
        GUIDs:
          help: "Lijst met Steam-GUID's (gescheiden door een puntkomma) die via de chat commando's naar de server mogen sturen"
          label: GUID's
      App:
        CheckFrequency:
          help: "Frequentie (seconden) van de app-controle"
          label: Controlefrequentie
        Mandatory:
          help: "on = Real Penalty-app is verplicht, off = Real Penalty-app is niet verplicht"
          label: Verplicht
      CustomShadersPatch:
        CheckFrequency:
          help: "Frequentie (seconden) van de Custom Shaders Patch-controle"
          label: Controlefrequentie
        Mandatory:
          help: "Zet dit op ON als alle coureurs Custom Shaders Patch (versie 0.1.46 of nieuwer) moeten hebben om op de server te rijden. Als je deze optie op true zet, maakt de app de rondetijd automatisch ongeldig"
          label: Verplicht
      General:
        CarChecksum:
          help: "Zet dit op true als je de extra checksum van de auto wilt (data.acd + collider.kn5, als deze twee bestanden op de server staan)"
          label: Checksum auto
        CockpitCamera:
          help: "Zet dit op true om de cockpitcamera voor alle coureurs verplicht te maken. Voor wedstrijdleiding of live-uitzending zet je de GUID's onder de sectie [No_Penalty]"
          label: Cockpitcamera
        FirstCheckTime:
          help: "Vertraging (seconden) na het verbinden van een nieuwe coureur tot de eerste controle (app + sol)"
          label: Tijd tot eerste controle
        TrackChecksum:
          help: "Zet dit op true als je een extra checksum van het circuit wilt (model + kn5-bestanden, als die op de server staan)"
          label: Checksum circuit
        WeatherChecksum:
          help: "Zet dit op true als je de checksum van het weer wilt (als het weer op de server staat)"
          label: Checksum weer
      Helicorsa:
        CarLength:
          help: "Hoe lang de auto's zijn (in meters). Sorry, AC levert hier geen gegevens over"
          label: Lengte auto
        CarWidth:
          help: "Hoe breed de auto's zijn (in meters). Sorry, AC levert hier geen gegevens over"
          label: Breedte auto
        DistanceThreshold:
          help: "Tot op welke afstand worden auto's getekend?"
          label: Afstandsdrempel
        FrontFadeAngle:
          help: "Als een auto voor je wordt uitgefaded, hoe zacht moet dat gebeuren? (ook in graden, 0 om uit te schakelen = aan/uit)"
          label: Fade-hoek voor
        FrontFadeOutArc:
          help: "Auto's voor de speler in een boog van X graden uitfaden (0 om uit te schakelen)"
          label: Fade-boog voor
        Mandatory:
          help: "Zet dit op true als de Helicorsa-app verplicht is voor de race"
          label: Verplicht
        OpacityThreshold:
          help: "Drempel voor doorzichtigheid: vanaf welke afstand (in meters) moeten de auto's beginnen te faden?"
          label: Drempel doorzichtigheid
        WorldZoom:
          help: "Zoom van de wereldcoördinaten, oftewel hoe groot de balken zijn"
          label: Wereldzoom
      NoPenalty:
        GUIDs:
          help: "Lijst met Steam-GUID's (gescheiden door een puntkomma) die zonder de app en sol met de server mogen verbinden (bijvoorbeeld voor 'Race Direction' of 'Live')"
          label: GUID's
      SafetyCar:
        CarModel:
          help: "Automodel van de safety car"
          label: Automodel
        GreenLightDelay:
          help: "Rollende start: vertraging van het groene licht na het rode signaal (seconden)"
          label: Vertraging groen licht
        NormalizedLightOffPosition:
          help: "Rollende start: genormaliseerde positie (0 = start, 1 = einde) van de eerste coureur tijdens de rollende start waarop de app het SC-signaal uitschakelt"
          label: Genormaliseerde positie lichten uit
        NormalizedStartPosition:
          help: "Rollende start: genormaliseerde positie (0 = start, 1 = einde) van de eerste coureur tijdens de rollende start waarop de app het rode signaal inschakelt. START_NORMALIZED_POSITION moet groter zijn dan LIGHT_OFF_NORMALIZED_POSITION"
          label: Genormaliseerde startpositie
        RaceStartBehindSC:
          help: "Zet dit op true als de race start na de eerste ronde achter de safety car (werkt met of zonder echte safety car op de server)"
          label: Racestart achter SC
      Sol:
        CheckFrequency:
          help: "Frequentie (seconden) van de Sol-controle"
          label: Controlefrequentie
        Mandatory:
          help: "Zet dit op true als het event de mod Sol gebruikt voor de overgang van dag naar nacht"
          label: Verplicht
        PerformanceModeAllowed:
          help: "Zet dit op true als de performance-modus van Sol is toegestaan"
          label: Performance-modus toegestaan
    RealPenaltyAppConfig:
      General:
        AppTCPPort:
          help: "TCP-poort waarop naar de AC-app wordt geluisterd (open hem in firewall/router). Moet een van 53000, 53001, 53002 t/m 53020 zijn, of de poort uit de cfg van de AC-server, HTTP_PORT + 27. De app probeert al deze poorten op het IP-adres van de AC-server (tot de juiste verbinding is gevonden)"
          label: TCP-poort app
        AppUDPPort:
          help: "UDP-poort waarop naar de AC-app wordt geluisterd (open hem in firewall/router). Elke vrije UDP-poort is goed"
          label: UDP-poort app
        EnableRealPenalty:
          help: "Real Penalty aan- of uitzetten"
          label: Real Penalty inschakelen
      PluginsRelay:
        OtherUDPPlugin:
          help: "Lijst met alle andere UDP-plugins die met de AC-server zijn verbonden (formaat: IP:Ports, gescheiden door een puntkomma)"
          label: Andere UDP-plugin
        UDPPort:
          help: "Lijst met UDP-poorten waarop alle andere verbonden plugins luisteren (gescheiden door een puntkomma)"
          label: UDP-poort
    RealPenaltySettings:
      BlueFlag:
        QualifyTimeThreshold:
          help: "Tijdsafstand (seconden) waarbij de blauwe vlag in de kwalificatie wordt getoond"
          label: Tijdsdrempel kwalificatie
        RaceTimeThreshold:
          help: "Tijdsafstand (seconden) waarbij de blauwe vlag in de race wordt getoond"
          label: Tijdsdrempel race
      Crossing:
        PenaltyType:
          help: "Soort straf voor het overschrijden. dt = drive through, sgn = stop and go van n seconden, n = n seconden die aan het einde van de race worden opgeteld"
          label: Soort straf
      Cutting:
        EnableTyresDirtLevel:
          help: "Vuil op de banden bij cutten"
          label: Vuil op banden inschakelen
        EnabledDuringSafetyCar:
          help: "Straf voor cutten ingeschakeld tijdens Safety Car of Virtual Safety Car"
          label: Ingeschakeld tijdens safety car
        MaxCutTime:
          help: "De maximale cut-tijd (in seconden) die een waarschuwing oplevert. Als je dit te lang maakt, kunnen ongelukken naast de baan cut-waarschuwingen opleveren"
          label: Max. cut-tijd
        MinSlowDownRatio:
          help: "De minimale verhouding tussen de snelheid bij het verlaten van de baan en de snelheid bij het terugkeren op de baan die een waarschuwing oplevert. Een verhouding daaronder betekent dat de auto heeft afgeremd en zo elk voordeel ongedaan heeft gemaakt, en dan volgt geen waarschuwing. 0.9 betekent dat de auto met 90% van de snelheid waarmee hij de baan verliet weer terugkomt. Een waarde < 1 betekent dat de auto tijdens de cut is afgeremd; een waarde > 1 dat hij sneller is gegaan"
          label: Min. afremverhouding
        MinSpeed:
          help: "De minimale snelheid in km/h die een cut oplevert"
          label: Min. snelheid
        PenaltyType:
          help: "Soort straf voor cutten. dt = drive through, sgn = stop and go van n seconden, n = n seconden die aan het einde van de race worden opgeteld"
          label: Soort straf
        PostCuttingTime:
          help: "Bonustijd na het terugkeren op de baan. Als de snelheid in deze tijd afneemt --> geen cut! Zet dit op 0 voor cut-controles zoals bij PLP (geen controle na het terugkeren op de baan)"
          label: Tijd na cut
        QualifyMaxSectorOutSpeed:
          help: "Initiële maximaal toegestane snelheid in de kwalificatie op de startlijn na een cut in de laatste bocht. BELANGRIJK! Pas deze waarde aan het circuit en de auto's aan!"
          label: Max. snelheid sectoruitgang kwalificatie
        QualifySlowDownSpeed:
          help: "Als je afremt tot deze snelheid (km/h), verdwijnt de melding INVALID LAP, SLOW DOWN in de kwalificatie"
          label: Afremsnelheid kwalificatie
        QualifySlowDownSpeedRatio:
          help: "Verhouding ten opzichte van QUALIFY_MAX_SECTOR_OUT_SPEED. De maximaal toegestane snelheid op de startlijn na een cut = QUALIFY_MAX_SECTOR_OUT_SPEED (of een andere nieuwe maximumsnelheid van de coureur) * QUALIFY_SLOW_DOWN_SPEED_RATIO"
          label: Afremverhouding kwalificatie
        SecondsBetweenCuts:
          help: "Je krijgt pas zoveel seconden na de vorige cut een nieuwe"
          label: Seconden tussen cuts
        TotalCutWarnings:
          help: "Hoeveel waarschuwingen zijn toegestaan voordat er een straf volgt"
          label: Totaal aantal cut-waarschuwingen
        WheelsOut:
          help: "Het maximale aantal wielen dat naast de baan mag komen"
          label: Wielen naast de baan
      DRS:
        BonusTime:
          help: "Hoeveel seconden de DRS bij elk illegaal gebruik open mag blijven voordat er een straf volgt"
          label: Bonustijd
        EnabledAfterLaps:
          help: "DRS ingeschakeld na N ronden vanaf de start (+1 bij een rollende start met SC, bestand ac_settings.ini)"
          label: Ingeschakeld na ronden
        EnabledDuringSafetyCar:
          help: "DRS-straf ingeschakeld tijdens Safety Car of Virtual Safety Car"
          label: Ingeschakeld tijdens safety car
        Gap:
          help: "Maximaal gat in seconden tot de auto voor je"
          label: Gat
        MaxIllegalUses:
          help: "Hoe vaak de coureur de DRS per sector illegaal mag openen voordat er een straf volgt"
          label: Max. illegaal gebruik
        MinSpeed:
          help: "Als de snelheid van de auto < MIN SPEED is, volgt geen straf voor illegaal DRS-gebruik"
          label: Min. snelheid
        OmitCars:
          help: "Lijst met auto's zonder DRS, gescheiden door puntkomma's."
          label: Uitgezonderde auto's
        PenaltyType:
          help: "Soort straf voor illegaal DRS-gebruik. dt = drive through, sgn = stop and go van n seconden, n = n seconden die aan het einde van de race worden opgeteld"
          label: Soort straf
      General:
        EnableCrossingPenalties:
          help: "Zet dit op true om straffen voor het overschrijden van de lijn bij de pituitgang in te schakelen"
          label: Straffen voor overschrijden inschakelen
        EnableCuttingPenalties:
          help: "Zet dit op true om straffen voor cutten in te schakelen; false om alleen waarschuwingen te geven"
          label: Straffen voor cutten inschakelen
        EnableDRSPenalties:
          help: "Zet dit op true om DRS-straffen in te schakelen (alleen voor auto's met DRS)"
          label: DRS-straffen inschakelen
        EnableSpeedingPenalties:
          help: "Zet dit op true om straffen voor te hard rijden in de pitlane in te schakelen"
          label: Straffen voor te hard rijden inschakelen
        LapsToTakePenalty:
          help: "Binnen hoeveel ronden een coureur een straf moet inlossen. Als LAPS_TO_TAKE_PENALTY > 2 --> valse start is altijd 2 vanwege de AC-limiet!"
          label: Ronden om straf in te lossen
        LastLapsWithoutPenalty:
          help: "Als een coureur in de laatste N ronden een straf krijgt (N = LAPS_TO_TAKE_PENALTY + LAST_LAPS_WITHOUT_PENALTY), mag hij de race uitrijden zonder hem in te lossen, maar krijgt hij een tijdstraf! (Drive through = PENALTY_SECONDS, Stop & GO 10 = PENALTY_SECONDS + 10, .......)"
          label: Laatste ronden zonder straf
        LastTimeWithoutPenalty:
          help: "Alleen voor races op tijd: seconden voor het einde van de racetijd (de optionele +1 ronde komt daar nog bij) zonder verplichte straf. Alle niet ingeloste straffen ----> strafseconden die bij de uiteindelijke racetijd worden opgeteld (in chat en log). Standaard 360 (6 minuten). BELANGRIJK! Pas deze waarde aan het circuit, de auto's en de extra ronde aan (ca. 3/5 ronden, maar afhankelijk van LAPS_TO_TAKE_PENALTY)"
          label: Laatste tijd zonder straf
        PenaltySeconds:
          help: "Aantal seconden dat handmatig bij de einduitslag wordt opgeteld voor alle straffen die tijdens de race niet zijn ingelost"
          label: Strafseconden
      JumpStart:
        PenaltyType0:
          help: "Soort straf voor een valse start. Geen secondenstraf instellen! dt = drive through, sgn = stop and go van n seconden, dsq = diskwalificatie --> kick"
          label: Soort straf 0
        PenaltyType1:
          label: Soort straf 1
        PenaltyType2:
          label: Soort straf 2
        SpeedLimitPenalty0:
          label: Snelheidslimiet straf 0
        SpeedLimitPenalty1:
          help: "Soort straf voor een valse start. Geen secondenstraf instellen! dt = drive through, sgn = stop and go van n seconden, dsq = diskwalificatie --> kick"
          label: Snelheidslimiet straf 1
        SpeedLimitPenalty2:
          help: "Soort straf voor een valse start. Geen secondenstraf instellen! dt = drive through, sgn = stop and go van n seconden, dsq = diskwalificatie --> kick"
          label: Snelheidslimiet straf 2
      Speeding:
        PenaltyType0:
          help: "Soort straf voor te hard rijden. dt = drive through, sgn = stop and go van n seconden, n = n seconden die aan het einde van de race worden opgeteld, dsq = diskwalificatie --> kick"
          label: Soort straf 0
        PenaltyType1:
