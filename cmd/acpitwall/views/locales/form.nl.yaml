      help: Zet dit op 1 als je, net als Captain Jean-Luc Picard, het geld-/puntensysteem
        helemaal niet wilt gebruiken (bijv. competities, privéservers en iedereen die
        alleen geïnteresseerd is in de Race Control- en trackingfuncties van Kissmyrank).
        Als je dit wijzigt, moet je de database resetten (bijv. de plugin opnieuw installeren).
      label: JLP-noodschakelaar geld
    LappingCarCollision:
      fieldset: Botsing met auto die op ronde wordt gezet
    LappingProtection:
      fieldset: Bescherming bij op ronde zetten
      help: Bij welk gat (in meters) een auto die op ronde wordt gezet de waarschuwing
        'Blauwe vlag' krijgt als hij bijna wordt ingehaald.
      label: Bescherming bij op ronde zetten
    LaptimeChallengeBaseAverageSpeed:
      help: Basis-gemiddelde snelheid van de Laptime Challenge (km/h). 110=110km/h.
        Een coureur is level 0 als hij een ronde met gemiddeld 110 km/h kan rijden.
        Level 1 bij 111 km/h enzovoort...
      label: Basis-gemiddelde snelheid Laptime Challenge
    LaptimeChallengeBasePrize:
      help: Basisprijs van de Laptime Challenge (in duizenden). 0.01 = 10€. De beloning
        is basis*level (level 2 krijgt 20). 0 om de Laptime Challenge uit te schakelen.
      label: Basisprijs Laptime Challenge
    LaptimeChallengeLevelAverageSpeedGap:
      help: Het verschil in gemiddelde snelheid tussen twee opeenvolgende Laptime Challenge-levels
        in (km/h). 1=1km/h (bijv. level 0 => 110km/h, level 1 => 111km/h).
      label: Snelheidsverschil tussen Laptime Challenge-levels
    LiveTrackView:
      help: Of de Live Track View is ingeschakeld (bijv. uitzetten als je de Live Map-optie
        van Web Stats wilt uitschakelen).
      label: Live Track View
    MacCollisionsPer100kmRechargeHours:
      help: De basistijd (uren per botsingseenheid) die een coureur die max_collisions_per_100km
        overschrijdt moet wachten voordat hij weer op de server mag (bijv. als max_collisions_per_100km
        op 30 staat, moet een coureur met 31 botsingen per 100km 1u wachten na de laatste
        keer dat hij de server verliet, bij 32 2 uur enzovoort).
      label: Wachturen bij max. botsingen per 100 km
    MaxCollisions:
      fieldset: Max. botsingen
      help: Het maximale aantal botsingen waarbij een gebruiker betrokken mag zijn voordat
        hij de straffen uit penalty_cost en penalty_action krijgt.
      label: Max. botsingen
    MaxCollisionsPer100km:
      help: Het maximale aantal botsingen per 100 km dat een coureur op de server mag
        hebben. Dit geldt voor coureurs die meer dan max_collisions_per_100km_min_distance
        hebben gereden.
      label: Max. botsingen per 100 km
    MaxCollisionsPer100kmMinDistance:
      help: De gereden afstand (in km) vanaf waar max_collisions_per_100km gaat gelden.
      label: Min. afstand voor max. botsingen per 100 km
    MaxInfractions:
      fieldset: Max. overtredingen
      help: Hoe vaak een coureur de serverregels mag overtreden (cutten, te hard rijden,
        de lijn bij de pituitgang overschrijden enz.) voordat hij de straffen uit de
        strafkosten en strafacties krijgt.
      label: Max. overtredingen
    MaxPing:
      help: De maximale ping (in ms) die een coureur mag hebben (de plugin geeft een
        waarschuwing als de actuele ping hoger is en kickt de coureur als het gemiddelde
        van de laatste 4 metingen boven de opgegeven waarde ligt). Zet dit niet te laag,
        anders blijven er misschien weinig spelers over. 0 om de pinglimiet helemaal
        uit te schakelen.
      label: Max. ping
    MaxPingDeviation:
      help: De maximale pingafwijking (in ms) die coureurs mogen hebben voordat hun
        verbinding als instabiel geldt (de plugin kickt de coureur als de standaardafwijking
        van de ping bij de laatste 4 metingen boven de opgegeven waarde ligt). Dit is
        een maat voor de instabiliteit van de verbinding, die belangrijk is voor MP-racen.
        0 om uit te schakelen.
      label: Max. pingafwijking
    MemoryMonitorEnabled:
      help: Of de geheugenmonitor is ingeschakeld (op Linux is libc6 2.14+ nodig). Schakel
        dit in als de plugin het geheugengebruik moet bewaken (handig om problemen op
        te sporen die met geheugentoewijzing te maken kunnen hebben).
      label: Geheugenmonitor ingeschakeld
    MinMoney:
      help: Minimaal bedrag (in duizenden) dat een coureur moet hebben om op de server
        te blijven. 1 = 1000€ (bijv. -12 -> coureurs met meer dan 12000€ schuld worden
        gekickt). Controleer ook start_money om zeker te weten dat deze waarde zinnig
        is.
      label: Min. geld
    MinimumDrivingStandard:
      help: Maximaal toegestane tijd in het klassement als fractie van de snelste tijd.
        1.1 = 110% van de snelste tijd (bijv. een coureur die binnen minimum_driving_standard_laps
        ronden geen tijd binnen 110% van de snelste rondetijd neerzet, wordt niet op
        de server toegelaten).
      label: Minimaal rijniveau
    MinimumDrivingStandardLaps:
      help: Het aantal geldige ronden waarin een coureur het minimale rijniveau moet
        halen. Een coureur krijgt na een paar dagen een tweede kans, volgens minimum_driving_standard_recharge_period.
      label: Ronden voor minimaal rijniveau
    MinimumDrivingStandardMinPlayers:
      help: Minimaal aantal spelers vanaf waar het minimale rijniveau wordt afgedwongen.
        Bij een waarde anders dan 0 wordt het rijniveau alleen afgedwongen als er meer
        dan het opgegeven aantal spelers op de server is.
      label: Min. spelers voor minimaal rijniveau
    MinimumDrivingStandardRechargePeriod:
      help: Het aantal seconden waarna een coureur die niet aan het niveau voldoet één
        ronde terugkrijgt (bijv. als minimum_driving_standard_laps op 12 staat, bepaalt
        deze waarde hoe lang een speler met 13 ronden en een slechte tijd moet wachten
        voordat hij weer op de server mag).
      label: Herlaadperiode minimaal rijniveau
    Miscellaneous:
      label: Overig
    Money:
      label: Geld
    NoMoney:
      help: Zet dit op ON als je punten in plaats van geld wilt gebruiken (no money,
        no party :D).
      label: Geen geld
    OvertakingUnderVirtualSafety:
      fieldset: Inhalen onder Virtual Safety Car
    ParkedCarDistance:
      help: De afstand (in meters) die een auto binnen parked_car_max_seconds moet afleggen
        om de detectie niet te activeren. 24 = 24 meter (een auto op de baan die binnen
        parked_car_seconds meer dan 24 meter rijdt, activeert de detectie niet).
      label: Afstand geparkeerde auto
    ParkedCarMaxGrace:
      help: Hoe vaak een coureur de detectie van geparkeerde auto's mag activeren voordat
        hij een straf krijgt. 4 = 4 keer (0 om deze detectie uit te schakelen).
      label: Max. coulance geparkeerde auto
    ParkedCarSeconds:
      help: Het aantal seconden voor de detectie van geparkeerde auto's. 6 = 6s (bijv.
        een coureur die bij de baan staat en binnen 6s niet meer dan parked_car_distance
        rijdt, activeert de detectie één keer).
      label: Seconden geparkeerde auto
    ParkingNearTrack:
      fieldset: Parkeren bij de baan
