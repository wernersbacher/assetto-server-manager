      label: Basissnelheid schadekosten tussen auto's
    DamageCostWithEnvironment:
      help: 'De kosten (in duizenden) van de schade bij een botsing met de omgeving
        bij damage_cost_with_environment_base_speed. 3 = 3000€ (bijv. coureurs betalen
        3000€ als ze bij de opgegeven relatieve basissnelheid tegen de omgeving botsen).
        Let op: de schade groeit met het kwadraat van de snelheid.'
      label: Schadekosten met omgeving
    DamageCostWithEnvironmentBaseSpeed:
      help: De basissnelheid (in km/h) voor damage_cost_with_environment.
      label: Basissnelheid schadekosten met omgeving
    Database:
      label: Database
    DatabaseSharingLocalGroupPort:
      help: 'Poort voor lokaal delen van de database met Kissmyrank-instanties op dezelfde
        machine. Stel een geldig poortnummer in als je dezelfde database wilt delen
        tussen verschillende instanties van de Kissmyrank-plugin op dezelfde machine.
        Alle plugins in dezelfde deelgroep moeten dezelfde poort hebben (bijv. je hebt
        4 Kissmyrank-instanties A,B,C,D en wilt de database per paar delen: A deelt
        met B, en C en D delen een aparte; dan zet je database_sharing_group_port in
        config.json voor KMR A en KMR B op 4567 en voor KMR C en KMR D op 4568).'
      label: Lokale groepspoort database delen
    DatabaseSharingRelayForNames:
      help: 'Eén per regel. Namen waarvoor bij het delen van de database op afstand
        wordt doorgestuurd. Let op: deze sleutel is niet nodig voor normaal delen van
        de database, alleen als je losse plugins hebt (bijv. plugins die met één instantie
        verbonden zijn en niet met de andere). Stel dat je de database tussen 3 plugins
        (A,B en C) wilt delen en database_sharing_unique_name op respectievelijk plugin_a,
        plugin_b, plugin_c hebt gezet. Stel dat je alleen A<->B en B<->C kunt verbinden,
        maar A niet direct met C. Nadat je alle andere sleutels voor (A<->B en B<->C)
        goed hebt ingesteld, bewerk je config.json van plugin_b en voeg je plugin_a
        en plugin_c toe aan de sleutel database_sharing_relay_for_names. Dan stuurt
        plugin B informatie door naar de andere plugin, zodat je A<->B<->C krijgt. Als
        je in dit geval B stopt, moet je ook A en C stoppen, anders wordt de synchronisatie
        mogelijk niet volledig toegepast. Deze functie werkt voor lokale en externe
        verbindingen, zolang je de unieke naam instelt. Pas op dat je geen dubbele koppelingen
        tussen plugins maakt, anders krijg je mogelijk dubbele updates.'
      label: 'Database delen: doorsturen voor namen'
    DatabaseSharingRemoteConnectToAddresses:
      help: Eén per regel. Adressen om mee te verbinden bij het delen van de database
        op afstand. De adressen van de externe plugins in het gebruikelijke formaat
        host:port (host is het IP/adres van de server waarop de plugin draait en port
        de database_sharing_remote_listen_port die je voor die plugin hebt ingesteld).
        Als plugin A de database met plugin B moet delen, voeg je hostA:portA toe aan
        config.json van plugin B en hostB:portB aan config.json van plugin A. Voeg bij
        elke plugin alle plugins toe waarmee hij moet communiceren (uiteraard niet zichzelf,
        anders ontstaat een lus). Verbind twee plugins niet tegelijk via lokaal en extern
        delen.
      label: 'Database delen op afstand: verbinden met adressen'
    DatabaseSharingRemoteListenAddress:
      help: Luisteradres voor delen van de database op afstand (wijzig dit alleen als
        je alleen op een bepaalde interface wilt luisteren, niet aanbevolen).
      label: 'Database delen op afstand: luisteradres'
    DatabaseSharingRemoteListenPort:
      help: Luisterpoort voor delen van de database op afstand. Gebruik dit alleen als
        lokaal delen niet mogelijk is. Stel een geldig poortnummer in als je de database
        wilt delen met een plugin op een andere machine. Delen op afstand kan vertraging
        veroorzaken, dus ik raad aan waar mogelijk lokaal te delen.
      label: 'Database delen op afstand: luisterpoort'
    DatabaseSharingRemoteSecretKey:
      help: Geheime sleutel voor delen van de database op afstand. Alleen nodig bij
        delen op afstand. Moet voor alle hosts die de database op afstand delen gelijk
        zijn.
      label: 'Database delen op afstand: geheime sleutel'
    DatabaseSharingUniqueName:
      help: Unieke naam voor het delen van de database. Geef deze plugin een unieke
