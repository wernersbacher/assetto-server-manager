      label: 'Anticheat: coureur bestraffen na opeenvolgende max. klokafwijkingen'
    CarTowingCost:
      help: Sleepkosten per km. Hoeveel (in duizenden) coureurs per km betalen om hun
        auto naar de pits te laten slepen. 0.05 = 50€ per km (bijv. als een coureur
        teruggaat naar de pits, betaalt hij 50€ voor elke km). 0 om de functie helemaal
        uit te schakelen.
      label: Sleepkosten
