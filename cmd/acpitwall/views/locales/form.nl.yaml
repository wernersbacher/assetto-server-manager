      help: Hoeveel (in duizenden) de eerste drie coureurs krijgen als meer dan het
        opgegeven aantal spelers een geldige kwalificatietijd heeft neergezet. 0.5 =
        500€ (bijv. de eerste krijgt 1500, de tweede 1000, de derde 500€).
      label: Basisprijs top drie kwalificatie
    QualifyTopThreePrizeMinPlayers:
      help: Hoeveel spelers een tijd moeten neerzetten voordat de poleprijzen worden
        toegekend.
      label: Min. spelers voor prijs top drie kwalificatie
    RaceControl:
      label: Race Control
    RaceControlCollisionReplayTime:
      help: Hoeveel seconden de plugin per auto toont in de botsingsreplay van Race
        Control.
      label: 'Race Control: replaytijd botsing'
    RaceControlCollisionSpace:
      help: De maximale afstand in meters tussen de twee posities die de Assetto Corsa-server
        voor dezelfde botsing meldt (om verschillen bij de clients door lag op te vangen).
        Verhoog dit als botsingen dubbel worden gemeld.
      label: 'Race Control: botsingsafstand'
    RaceControlCollisionTime:
      help: Het maximale aantal seconden waarbinnen de Assetto Corsa-server botsingsgegevens
        voor beide auto's moet leveren. Verhoog dit als botsingen dubbel worden gemeld.
      label: 'Race Control: botsingstijd'
    RaceControlCutReplayTime:
      help: Hoeveel seconden de plugin per auto toont in de cut-replay van Race Control.
      label: 'Race Control: replaytijd cut'
    RaceControlIncludePlayersNearerThan:
      help: Auto's binnen deze afstand (in meters) van de auto die het Race Control-event
        veroorzaakt, komen in de replay. 100 = 100m (bijv. als een auto met een andere
        botst, komen alle coureurs binnen 100 meter in de replay).
      label: 'Race Control: spelers meenemen dichter dan'
    RaceControlLogOvertakes:
      help: Zet dit op 1 als de plugin inhaalacties moet loggen en in de Race Control-viewer
        moet tonen (dit kost geheugen en maakt de weergave voller met events die voor
        Race Control niet echt nodig zijn).
      label: 'Race Control: inhaalacties loggen'
    RaceControlMaxEvents:
      help: Het maximale aantal events dat Race Control toont.
      label: 'Race Control: max. events'
    RaceControlOvertakeReplayTime:
      help: Hoeveel seconden de plugin per auto toont in de inhaalreplay van Race Control.
      label: 'Race Control: replaytijd inhalen'
    RaceControlPassword:
      help: Het wachtwoord waarmee wedstrijdleiders botsingen beoordelen via de Web
        Stats-pagina (minstens 8 tekens, anders wordt de functie uitgeschakeld).
      label: Race Control-wachtwoord
    RaceDriverEntryFee:
      help: Hoeveel een coureur moet betalen om aan een racesessie op de server deel
        te nemen (in duizenden). 0.3 = 300€ (bijv. coureurs betalen 300€ aan het begin
        van elke race).
      label: Inschrijfgeld coureur
    RaceFastestLapPrize:
      help: Hoeveel een coureur krijgt voor de snelste ronde van de race (in duizenden).
        0.15 = 150€.
      label: Prijs snelste ronde race
    RaceMassAccidentCrashTime:
      help: De tijd in seconden waarover race_mass_accident_crashed_players_percentage
        wordt beoordeeld. 30 = 30s.
      label: Tijdvenster massacrash race
    RaceMassAccidentCrashedPlayersPercentage:
      help: Het percentage spelers dat binnen de opgegeven mass_accident_crash_time
        bij een botsing betrokken moet zijn voordat de plugin de reactie op een massacrash
        start (bijv. Virtual Safety Car of automatische herstart). 45 = 45%.
      label: Percentage gecrashte spelers bij massacrash
    RaceMassAccidentMinCrashedPlayers:
      help: Het minimale aantal spelers dat moet crashen voor de reactie op een massacrash
        (bijv. zodat de Virtual Safety Car op servers met weinig spelers niet te vaak
        uitrukt).
      label: Min. gecrashte spelers bij massacrash
    RaceMassAccidentResponse:
      FirstLap:
        label: Eerste ronde
      OtherLaps:
        label: Overige ronden
      fieldset: Reactie op massacrash in de race
    RaceMinimumPlayers:
      help: Minimaal aantal spelers om te racen (moet >=2 zijn als je het geldsysteem
        gebruikt). Zijn er niet genoeg spelers, dan slaat de server de racesessie over.
      label: Min. spelers voor race
    RacePodiumAnnouncement:
      help: Of de eerste drie coureurs aan het einde van de race worden aangekondigd.
      label: Podium aankondigen
    RaceSponsorCleanGainOvertakes:
      help: Hoeveel schone inhaalacties nodig zijn voordat de sponsors één beloning
        voor schone winst uitkeren (bijv. als je dit op 5 zet en de coureur 5 keer schoon
        inhaalt, krijgt hij 1000€, bij 10 inhaalacties 2000€ enz.)
      label: Schone inhaalacties voor sponsorbeloning
    RaceSponsorCleanGainReward:
      help: Hoeveel sponsors een coureur belonen die tijdens de race 5 keer schoon inhaalt
        (in duizenden). 1 = 1000€. Schone inhaalacties zijn posities die zonder botsingen
        zijn gewonnen, zonder posities gewonnen op coureurs die tijdens de race de verbinding
        verbreken.
      label: Sponsorbeloning voor schone winst
    RaceSponsorEntryFee:
      help: Hoeveel een sponsor betaalt om de coureur aan de race te laten deelnemen
        (in duizenden). 1.5 = 1500€ (dit vormt samen met het inschrijfgeld het totale
        prijzengeld; hoe hoger, hoe hoger de uitbetalingen van de race).
      label: Sponsorbijdrage inschrijving
    RaceSponsorRewardBaseLength:
      help: Het aantal km waarvoor de volledige sponsorbijdrage wordt betaald (bijv.
        als de sponsorbijdrage 1000€ is en je dit op 35 zet, dragen sponsors bij een
        race van 7 ronden op een circuit van 5km 1000€ per auto bij; bij 14 ronden betalen
        ze 2000€ per auto, zodat langere races grotere prijzen opleveren).
      label: Basislengte sponsorbeloning
    RaceSponsorRewardBaseTime:
      help: Het aantal minuten waarvoor de volledige sponsorbijdrage wordt betaald (bijv.
        als de sponsorbijdrage 1000€ is en je dit op 15 zet, dragen sponsors bij een
        race van 15 minuten 1000€ per auto bij; bij 30 minuten betalen ze 2000€ per
        auto, zodat langere races grotere prijzen opleveren).
      label: Basistijd sponsorbeloning
    RankSortByWinStats:
      help: Ranglijst sorteren op overwinningsstatistieken in plaats van geld. Als je
        dit wijzigt, moet je de database resetten.
      label: Ranglijst sorteren op overwinningen
    RelativeHotlapProtection:
      help: Bij welk gat (als fractie van de totale baanlengte) een auto in een outlap
        de waarschuwing 'Laat de andere auto passeren' krijgt als hij bijna wordt ingehaald.
        Wordt alleen gebruikt als de baanlengte ontbreekt. 1 is de volledige baanlengte
        (0.008 is 8/1000 van de volledige baanlengte).
      label: Relatieve hotlap-bescherming
    RelativeLappingProtection:
      help: Bij welk gat (als fractie van de totale baanlengte) een auto die op ronde
        wordt gezet de waarschuwing 'Blauwe vlag' krijgt als hij bijna wordt ingehaald.
        Wordt alleen gebruikt als de baanlengte ontbreekt. 1 is de volledige baanlengte
        (0.007 is 7/1000 van de volledige baanlengte).
      label: Relatieve bescherming bij op ronde zetten
    ReservedSlotsAccessKey:
      help: De sleutel die VIP-spelers in de Kissmyrank Multiplayer Launcher Mod gebruiken
        om hun gereserveerde slot te krijgen. Coureurs met een gereserveerd slot typen
        deze sleutel in het invoerveld van de Kissmyrank Multiplayer Launcher Mod (bij
        de rode vraagteken-knop boven de serverlijst) voordat ze hun gereserveerde slot
        kunnen gebruiken. Als dit niet is ingesteld, worden gereserveerde slots helemaal
        uitgeschakeld.
      label: Toegangssleutel gereserveerde slots
    ReservedSlotsBootPlayersAtRace:
      help: Of het verwijderen van spelers voor gereserveerde slots tijdens de race
        wordt uitgeschakeld. Slots worden per auto vrijgemaakt, beginnend achteraan
        de grid (op een volle grid worden dus waarschijnlijk spelers verwijderd die
        laat zijn gejoind of meerdere ronden achterstaan). Zet dit op 1 als je gereserveerde
        slots tijdens de racesessie helemaal wilt uitschakelen. VIP-spelers moeten dan
        wachten tot er een slot vrijkomt of tot de volgende sessie.
      label: Spelers verwijderen voor gereserveerde slots in de race
    ReservedSlotsGUIDList:
      help: Eén per regel. Lijst met GUID's van de coureurs die een gereserveerd slot
        op de server hebben (vereist de Kissmyrank Multiplayer Launcher Mod). Als de
        server vol is en een van deze GUID's probeert te joinen, wordt een speler gekickt
        om plaats te maken.
      label: GUID-lijst gereserveerde slots
    ReverseGear:
      fieldset: Achteruit
    ReverseGearMaxDistance:
      help: De maximale afstand in meters die een coureur op de baan achteruit mag rijden
        (0 om de straf uit te schakelen).
      label: Max. afstand achteruit
    RightToBeForgottenChatCommand:
      help: Of het chatcommando 'kmr erase_personal_data_and_ban_myself' is ingeschakeld,
        waarmee coureurs hun recht om vergeten te worden gebruiken en al hun statistieken
        laten verwijderen.
      label: Chatcommando recht om vergeten te worden
    RollingStart:
      help: Of je de Rolling Start van Kissmyrank aan het begin van een race wilt gebruiken.
      label: Rollende start
    Rules:
      label: Regels
    SessionHistoryLength:
      help: Lengte van de sessiegeschiedenis. Hoeveel sessies in het geheugen blijven.
        Een hogere waarde kost meer geheugen.
      label: Lengte sessiegeschiedenis
    SlowingUnderVirtualSafetyCar:
      fieldset: Afremmen onder Virtual Safety Car
    SpeedUnitFormat:
      help: 'De snelheidseenheid voor openbaar getoonde gegevens. Toegestane waarden
        zijn kmh en mph. Let op: dit is alleen cosmetisch voor de eindgebruiker; voor
        alle configuratie gebruik je nog steeds km/h.'
      label: Weergave snelheidseenheid
    SpeedingUnderVirtualSafetyCar:
      fieldset: Te hard rijden onder Virtual Safety Car
    StartMoney:
      help: Het geld (in duizenden) dat een speler zonder ranking krijgt als hij voor
        het eerst op de server joint (30=30000€). Controleer ook min_money om zeker
        te weten dat deze waarde zinnig is.
      label: Startgeld
    ThousandSeparator:
      help: Het symbool om duizendtallen te scheiden (bijv. 19,000 of 19.000).
      label: Scheidingsteken duizendtallen
    TimeBasedRaceExtraLap:
      help: Of bij een race op tijd de extra ronde in server_cfg.ini van Assetto Corsa
        is ingeschakeld. Als baanrotatie actief is, leest de plugin de instelling direct
        uit server_cfg.ini en negeert hij deze waarde.
      label: Extra ronde bij race op tijd
    TrackBoundaryCut:
      fieldset: Cut over de baangrens
    TrackBoundaryCutGainFilter:
      help: Of het winstfilter voor cuts over de baangrens is ingeschakeld. Dat vergelijkt
        het voordeel van de cut met de snelste ronde van de sessie en geeft geen straf
        als de coureur daarbij tijd verliest.
      label: Winstfilter cut over baangrens
    TrackBoundaryCutGainFilterMinAverageSpeed:
      help: Deze snelheid (in km/h) is de ondergrens van het winstfilter voor cuts over
        de baangrens. 45 = 45km/h (bijv. als een speler tijdens de cut meer tijd verliest
        dan wanneer hij het betreffende baandeel met 45km/h had gereden, wordt de cut
        genegeerd). Dit is alleen nuttig in de eerste ronden, als er nog geen vergelijkingsronde
        is.
      label: 'Winstfilter cut over baangrens: min. gemiddelde snelheid'
    TrackBoundaryCutGainFilterMinLossPercent:
      help: Het minimale tijdverlies (in procent) waarbij het winstfilter voor cuts
        over de baangrens de cut negeert. 6=6% (bijv. een coureur die meer dan 6% verliest
        ten opzichte van de snelste rondetijd van de sessie, krijgt geen straf).
      label: 'Winstfilter cut over baangrens: min. verlies in procent'
    TrackBoundaryCutMaxSpeed:
      help: De maximale snelheid (in km/h) waarmee een coureur de baangrens mag overschrijden.
      label: Max. snelheid cut over baangrens
    TrackBoundaryCutMaxTime:
      help: De maximale tijd (in seconden) tussen begin en einde van een cut (cuts daarbuiten
        gelden als momenten naast de baan).
      label: Max. tijd cut over baangrens
    TrackBoundarySameLapCutMaxSpeed:
      help: De maximale snelheid (in km/h) waarmee een coureur na de eerste overtreding
        de baangrens mag overschrijden (dit geldt zowel voor het terugkeren op de baan
        als voor verdere cuts).
      label: Max. snelheid cut over baangrens in dezelfde ronde
    TrackBoundarySampleLength:
      help: 'De lengte (in meters) van één meetpunt van de baangrens (max. aanbevolen
        waarde is 3). Verhoog dit als je schijfruimte wilt besparen ten koste van de
        nauwkeurigheid. Let op: deze waarde geldt alleen voor nieuwe datasets.'
      label: Meetlengte baangrens
    TrackRejoinMaxSpeed:
      fieldset: Max. snelheid bij terugkeren op de baan
      help: De maximale snelheid waarmee een coureur op de baan mag terugkeren nadat
        hij in een uitgesloten zone van de baan is gegaan of de auto naast de baan heeft
        stilgezet.
      label: Max. snelheid bij terugkeren op de baan
    UDPRelay:
      label: UDP-relay
    UDPReplayTo:
      help: 'Eén per regel. Gebruik dit als je UDP-verkeer wilt doorsturen naar andere
        plugins (bijv. Minorating, Stracker enz.). Het werkt zo: AC-server <-> Kissmyrank-plugin
        <-> andere plugins. Geef voor elke plugin het adres op in het formaat ip_address:port
        (bijv. voor een plugin op 127.0.0.1 met poort 12003 vervang je UDP_PLUGIN_ADDRESS_1
        door 127.0.0.1:12003). Daarna stel je de andere plugin zo in alsof de Kissmyrank-plugin
        de Assetto Corsa-server is (bijv. bij de standaardconfiguratie van Kissmyrank
        op poort 12000 zet je ac_server_plugin_port van de andere plugin op 12000 en
        ac_server_ip op het IP van de machine waarop de Kissmyrank-plugin draait). Controleer
        bij het starten in de console of het adres correct wordt gelezen.'
      label: UDP doorsturen naar
    VSCDefaultLeaderSlowAllowOvertakeSpeed:
      help: De snelheid in km/h waaronder de leider tijdens de Virtual Safety Car of
        de formatieronde van de rollende start mag worden ingehaald (bijv. zodat een
        geparkeerde auto niet iedereen blokkeert).
      label: 'VSC: inhaalsnelheid bij langzame leider'
    VSCDefaultSlowAndFarAllowOvertakeDistance:
      help: De afstand tot de vorige auto waarboven een coureur tijdens de Virtual Safety
        Car of de formatieronde van de rollende start mag worden ingehaald als hij langzamer
        is dan vsc_defalut_slow_and_far_allow_overtake_speed.
      label: 'VSC: inhaalafstand bij langzaam en ver weg'
    VSCDefaultSlowAndFarAllowOvertakeSpeed:
      help: De snelheid in km/h waaronder een coureur tijdens de Virtual Safety Car
        of de formatieronde van de rollende start mag worden ingehaald als hij verder
        weg is dan vsc_defalut_slow_and_far_allow_overtake_distance.
      label: 'VSC: inhaalsnelheid bij langzaam en ver weg'
    VSCDefaultSpeedLimit:
      help: De maximale snelheid (in km/h) die een speler tijdens een Virtual Safety
        Car mag rijden.
      label: 'VSC: snelheidslimiet'
    VSCFormationLapFarAllowOvertakeDistance:
      help: De afstand tot de vorige auto waarboven een coureur tijdens de formatieronde
        van de rollende start mag worden ingehaald (omdat de auto's tijdens de formatieronde
        dicht bij elkaar moeten blijven).
      label: 'VSC: inhaalafstand in formatieronde'
    VSCFormationLapMinSpeed:
      help: De minimale snelheid (in km/h) waarboven een coureur tijdens de formatieronde
        van de rollende start moet rijden (0 om uit te schakelen).
      label: 'VSC: min. snelheid formatieronde'
    VSCFormationLapSpeedLimit:
      help: De maximale snelheid (in km/h) die een speler tijdens de formatieronde van
        de rollende start mag rijden.
      label: 'VSC: snelheidslimiet formatieronde'
    VSCOvertakingMaxGrace:
      help: Het aantal seconden dat een coureur heeft om de positie terug te geven als
        hij tijdens een Virtual Safety Car of de formatieronde van de rollende start
        een andere auto inhaalt.
      label: 'VSC: max. coulance bij inhalen'
    VSCSlowingMaxGrace:
      help: Het aantal seconden dat een coureur tijdens de formatieronde van de rollende
        start onder de minimale snelheid mag zakken.
      label: 'VSC: max. coulance bij afremmen'
    VSCSpeedingMaxGrace:
      help: Het aantal seconden dat een coureur tijdens een Virtual Safety Car of de
        formatieronde van de rollende start boven de snelheidslimiet mag rijden.
      label: 'VSC: max. coulance bij te hard rijden'
    VirtualSafetyCar:
      label: Virtual Safety Car
    WarnedCarGrace:
      help: De tijd in seconden die elke auto na de eerste waarschuwing krijgt om ruimte
        te maken. Verhoog dit om een gewaarschuwde coureur meer tijd te geven om de
        andere auto te laten passeren.
      label: Coulance gewaarschuwde auto
    WebAdminConsoleGuestPassword:
      help: 'Stel dit wachtwoord in (minstens 8 tekens) als je alleen-lezen toegang
        tot de Web Admin-console wilt geven. Let op: web_admin_console_password moet
        zijn ingesteld om de console überhaupt te activeren. Geef dit wachtwoord alleen
        aan vertrouwde leden, want zij zien alles wat in de Kissmyrank-console verschijnt.'
      label: Gastwachtwoord Web Admin-console
    WebAdminConsolePassword:
      help: Wachtwoord van de Web Admin-console. Het wachtwoord (min. 12 tekens, anders
        wordt de Kissmyrank Web Admin-interface geforceerd uitgeschakeld) waarmee je
        inlogt op je Kissmyrank Web Admin-console op http://yourserver/kissmyrank_admin
        (als je wachtwoord 'yourcomplexpassword' is, typ je na het openen van de pagina
        'login yourcomplexpassword' om toegang te krijgen). Laat dit leeg als je de
        Kissmyrank Web Admin-console niet wilt gebruiken.
      label: Wachtwoord Web Admin-console
    WebAuth:
      label: Web Auth
    WebAuthCacheTime:
      help: Hoe lang het resultaat van web auth in de cache blijft, in seconden
      label: Cachetijd web auth
    WebAuthRelayTo:
      help: Eén per regel. Gebruik dit als je gebruikers ook op basis van andere plugins
        wilt blokkeren. De waarden zijn dezelfde die je als AUTH_PLUGIN_ADDRESS in server_cfg.ini
        van Assetto Corsa voor de plugin van derden zou instellen (bijv. voor Minorating
        vervang je AUTH_PLUGIN_ADDRESS_1 door plugin.minorating.com:805/minodata/auth/ABCN/?).  Je
        kunt natuurlijk ook een andere instantie van de Kissmyrank Plugin Auth gebruiken
        om over servers heen te blokkeren, met de Kissmyrank-AUTH_PLUGIN_ADDRESS van
        die andere instantie. Controleer bij het starten van de plugin in de console
        of het adres correct wordt gelezen.
      label: Web auth doorsturen naar
    WebAuthServerAddress:
      help: Adres van web auth (wijzig dit als je alleen op een bepaalde interface wilt
        luisteren, niet aanbevolen).
      label: Serveradres web auth
    WebAuthServerPort:
      help: Poort van web auth. Gebruik op Linux geen poorten onder 1024.
      label: Serverpoort web auth
    WebInterface:
      label: Webinterface
    WebStatsCacheTime:
      help: Hoe lang de statistieken in de cache blijven, in seconden (een lagere waarde
        kan het CPU-gebruik verhogen)
      label: Cachetijd Web Stats
    WebStatsDriversPerPage:
      help: Coureurs per pagina in Web Stats. Hoeveel coureurs per pagina de coureurslijst
        van Web Stats toont.
      label: 'Web Stats: coureurs per pagina'
    WebStatsInterface:
      help: Of de Web Stats-interface is ingeschakeld (nodig voor Race Control en het
        beoordelen van botsingen door de wedstrijdleiding).
      label: Web Stats-interface
    WebStatsOverridePublicAddress:
      help: Vul hier het openbare Web Stats-adres van je server in als je de automatische
        detectie van het openbare adres door de plugin wilt overschrijven.
      label: 'Web Stats: openbaar adres overschrijven'
    WebStatsOverridePublicPort:
      help: Vul hier de openbare Web Stats-poort van je server in als je de standaardinstelling
        wilt overschrijven (bijv. bij een forward, proxy, redirect enz.).
      label: 'Web Stats: openbare poort overschrijven'
    WebStatsPublicURL:
      help: <strong>Stel deze waarde in als je de Web Stats-poort gebruikt!</strong>
        Dit moet de URL zijn waar iedereen bij kan. Deze link wordt op de Live Timings-pagina
        van ACPitwall getoond, zodat iedereen de KMR-interface kan bekijken. Als je
        dit leeg laat, wordt er geen link op de Live Timings-pagina getoond!
      label: Openbare URL Web Stats
    WebStatsResultsShowLapLog:
      help: Zet dit op 1 als de raceuitslagen in Web Stats ook het rondelog moeten bevatten
        (met per ronde de tijden van elke speler, de banden waarop hij reed enz.).
      label: 'Web Stats: rondelog in uitslagen tonen'
    WebStatsServerAddress:
      help: Adres van de Web Stats-server (wijzig dit als je alleen op een bepaalde
        interface wilt luisteren, niet aanbevolen).
      label: Serveradres Web Stats
    WebStatsServerPort:
      help: Poort van de Web Stats-server. Lees voor Linux het hoofdstuk over probleemoplossing
        in het helpbestand readme.txt.
      label: Serverpoort Web Stats
