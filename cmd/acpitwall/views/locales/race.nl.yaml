    extra_lap_help: Bij een race op tijd wordt een extra ronde gereden nadat de leider de finish is gepasseerd
    qualify_max_wait: Max. wachtpercentage kwalificatie
    qualify_max_wait_help: "Factor voor de resterende tijd in een kwalificatiesessie nadat de sessie is afgelopen: 120 betekent dat 120% van de snelste ronde van de sessie overblijft om de huidige ronde af te maken."
