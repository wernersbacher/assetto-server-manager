    reversed_grid_0: 0 = geen extra race
    reversed_grid_minus1: -1 = alle posities worden omgedraaid (uitgevallen spelers staan op de laatste plaatsen)
    reversed_grid_1: 1 = er volgt een 2e race met een startopstelling op basis van de uitslag van de 1e race
    reversed_grid_x: X = de eerste X posities worden omgedraaid voor de 2e race
