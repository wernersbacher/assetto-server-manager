    max_clients_help: Maximaal aantal clients op de server.
    pickup_mode: Pickup-modus
    pickup_mode_help: "Staat dit UIT, dan start de server in bookingmodus. Let op: in pickup-modus moet de Entry List minstens één auto bevatten. Let wel: als de pickup-modus UIT staat, moeten spelers bij sessies met loopmodus AAN of een omgedraaide startopstelling opnieuw verbinden wanneer de server opnieuw begint of naar een tweede race gaat."
    locked_entry_list: Vergrendelde Entry List
    locked_entry_list_help: Alleen spelers die al in de Entry List staan kunnen de server joinen.
    locked_reverse_warning: De server crasht als er een tweede race actief is (omgedraaide startopstelling != 0), de Entry List vergrendeld is en de pickup-modus uit staat. Wil je de Entry List voor dit event vergrendelen, zet dan ook de pickup-modus aan!
    driver_swaps: Rijderswissels
    driver_swaps_help: Met de rijderswissels van ACPitwall kunnen meerdere rijders één deelnemer delen en van rijder wisselen. Voer daarvoor bij een deelnemer meerdere GUID's in, gescheiden door ;.
    driver_swaps_note: "Let op: rijderswissels leveren alleen geldige resultaatbestanden op als de tijdwaarnemingslijn van het circuit voor of na alle pitboxen ligt."
    swap_min_time: Minimale tijd rijderswissel (seconden)
    swap_min_time_help: Minimale duur van een rijderswissel, zodat spelers met snellere computers geen voordeel hebben. Vertrekt de tweede rijder voor deze tijd, dan wordt hij afhankelijk van de configuratie gediskwalificeerd of bestraft.
    swap_dq_window: Diskwalificatievenster rijderswissel (seconden)
    swap_dq_window_help: De rijder wordt uit de race gekickt en gediskwalificeerd als hij bij een rijderswissel dit aantal seconden of meer voor de minimale tijd vertrekt.
    swap_penalty_window: Strafvenster rijderswissel (seconden)
    swap_penalty_window_help: Vertrekt een rijder bij een rijderswissel dit aantal seconden of meer voor de minimale tijd, dan krijgt hij een straf gelijk aan de resterende seconden van het aftellen plus 5 seconden.
    swap_min_count: Minimaal aantal rijderswissels
    swap_min_count_help: Het aantal wissels dat een rijder moet voltooien. Wie het vereiste aantal stops niet haalt, wordt bestraft (zie hieronder).
    swap_not_enough_penalty: Straf voor te weinig rijderswissels (seconden)
    swap_not_enough_penalty_help: De straf in seconden die een rijder krijgt voor elke ontbrekende rijderswissel onder het minimum. Bij 0 wordt de rijder gediskwalificeerd.
