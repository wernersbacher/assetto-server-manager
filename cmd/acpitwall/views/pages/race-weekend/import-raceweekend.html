{{ define "title" }}{{ t "raceweekend.import" }}{{ end }}

{{ define "content" }}
    <h1 class="text-center">{{ t "raceweekend.import" }}</h1>

    <form method="post" action="/race-weekend/import">
        <label for="import"></label>
        <textarea id="import" name="import" placeholder="{{ t "raceweekend.import_placeholder" }}" class="form-control md-textarea text-area"></textarea>

        <button class="btn btn-success float-right mt-2" type="submit">{{ t "common.save" }}</button>
    </form>

    <p>
        <small>
            {{ t "raceweekend.import_help" }}
        </small>
    </p>
{{ end }}
