{{ define "title" }}{{ t "championships.import.title" }}{{ end }}

{{ define "content" }}
    <h1 class="text-center">{{ t "championships.import.title" }}</h1>

    <form method="post" action="/championship/import">
        <label for="import"></label>
        <textarea id="import" name="import" placeholder="{{ t "championships.import.placeholder" }}" class="form-control md-textarea text-area"></textarea>

        <button class="btn btn-success float-right mt-2" type="submit">{{ t "common.save" }}</button>
    </form>

    <p><small>{{ t "championships.import.help" }}</small></p>
{{ end }}
