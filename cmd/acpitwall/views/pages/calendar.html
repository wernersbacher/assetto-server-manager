{{/* gotype: github.com/wernersbacher/ACPitwall/internal/schedule.calendarTemplateVars */}}

{{ define "title" }}{{ t "nav.calendar" }}{{ end }}

{{ define "content" }}
    <div class="page-header">
        <div>
            <h1>{{ t "nav.calendar" }}</h1>
            <p>{{ t "calendar.intro" }}</p>
        </div>

        <a href="/events.ics{{ with .FilterServer }}?filterServer={{ . }}{{ end }}" class="btn btn-outline btn-with-icon">
            <i class="fas fa-calendar"></i> {{ t "calendar.subscribe" }}
        </a>
    </div>

    {{ if gt (len .Servers) 1 }}
        <form method="get" action="/calendar" class="results-filter">
            <select class="form-control" name="filterServer" id="filterServer" aria-label="{{ t "nav.server" }}" onchange="this.form.submit()">
                <option value="">{{ t "calendar.all_servers" }}</option>
                {{ range $server := .Servers }}
                    <option value="{{ $server.ID }}" {{ if eq $server.ID $.FilterServer }}selected{{ end }}>{{ $server.Name }}</option>
                {{ end }}
            </select>
            <noscript><button type="submit" class="btn btn-primary">{{ t "calendar.filter" }}</button></noscript>
        </form>
    {{ end }}

    <div id="calendar"></div>
{{ end }}
