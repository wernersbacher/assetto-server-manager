{{ define "title" }}Login{{ end }}

{{ define "content" }}
    <div class="auth-wrap">
        <form method="post" action="/login" class="auth-card card admin-card">
            <div class="card-body">
                <h1 class="auth-title">Sign in</h1>
                <p class="text-muted">Log in to manage the server.</p>

                <div class="form-group">
                    <label for="Username">Username</label>
                    <input
                            type="text"
                            id="Username"
                            name="Username"
                            class="form-control"
                            placeholder="username"
                            autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="Password">Password</label>
                    <input
                            type="password"
                            id="Password"
                            name="Password"
                            class="form-control"
                            placeholder="password"
                            autocomplete="current-password"
                    >
                </div>

                <button class="btn btn-primary btn-block" type="submit">Login</button>
            </div>
        </form>
    </div>
{{ end }}
