name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cmd/acpitwall/typescript/package-lock.json
      - name: Build frontend
        working-directory: cmd/acpitwall/typescript
        run: |
          npm ci --no-audit --no-fund
          mkdir -p ../static
          npx gulp build
      - name: Generate embedded files
        run: |
          go install github.com/mjibson/esc@v0.2.0
          go generate ./...
      - run: go vet ./...
      - name: Test
        run: |
          mkdir -p cmd/acpitwall/assetto/cfg cmd/acpitwall/assetto/results cmd/acpitwall/assetto/content/cars cmd/acpitwall/assetto/content/tracks
          cp fixtures/results/*.json cmd/acpitwall/assetto/results
          go test -race ./...

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wernersbacher/acpitwall
          tags: |
            type=raw,value=unstable,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main and tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SM_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
