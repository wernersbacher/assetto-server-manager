# ONE Server Manager with two acServers (slots a and b), see README.md in this directory.

name: assetto-multiserver

x-image: &image
  image: assetto-server-manager:local
  build:
    context: ../..
    args:
      SM_VERSION: docker-multiserver
    secrets:
      - ca_cert

# prepares a volume from the pristine install, see seed.sh
x-seed: &seed
  <<: *image
  user: root
  entrypoint: ["sh", "/seed.sh"]

services:
  # one-off: installs the AC server into the ac-base volume. Asks for password and Steam Guard code.
  #   docker compose --profile install run --rm install
  install:
    <<: *image
    profiles: ["install"]
    user: root
    entrypoint: ["sh", "/install-ac.sh"]
    environment:
      STEAM_USER:
    volumes:
      - ac-base:/base
      - ./install-ac.sh:/install-ac.sh:ro

  seed-content:
    <<: *seed
    command: ["content"]
    volumes:
      - ac-base:/base:ro
      - ac-content:/content
      - ./seed.sh:/seed.sh:ro

  seed-a:
    <<: *seed
    command: ["slot"]
    volumes:
      - ac-base:/base:ro
      - assetto-a:/slot
      - ./seed.sh:/seed.sh:ro

  seed-b:
    <<: *seed
    command: ["slot"]
    volumes:
      - ac-base:/base:ro
      - assetto-b:/slot
      - ./seed.sh:/seed.sh:ro

  # The acServers announce the configured ports to the lobby and the clients, so every port is published 1:1 and the
  # acServer ports of each server are set in its "Server Options" (a: 9600/8081, b: 9601/8082).
  server-manager:
    <<: *image
    restart: unless-stopped
    depends_on:
      seed-content:
        condition: service_completed_successfully
      seed-a:
        condition: service_completed_successfully
      seed-b:
        condition: service_completed_successfully
    ports:
      - "8772:8772"     # web UI
      - "9600:9600/udp" # server a: acServer UDP
      - "9600:9600/tcp" # server a: acServer TCP
      - "8081:8081/tcp" # server a: acServer HTTP
      - "9601:9601/udp" # server b
      - "9601:9601/tcp"
      - "8082:8082/tcp"
    volumes:
      # store, logs, sessions
      - data:/home/assetto/server-manager
      - assetto-a:/home/assetto/server-manager/assetto-a
      - assetto-b:/home/assetto/server-manager/assetto-b
      # the content of both servers is the same folder; the manager manages content through the first server
      - ac-content:/home/assetto/server-manager/assetto-a/content
      - ac-content:/home/assetto/server-manager/assetto-b/content
      - ./config.yml:/home/assetto/server-manager/config.yml:ro

volumes:
  # the pristine AC server install; the servers get a copy of it
  ac-base:
  # cars, tracks, ... shared by both servers
  ac-content:
  # the install copy (cfg, results, ...) of each server
  assetto-a:
  assetto-b:
  # working directory of the Server Manager (database, logs)
  data:

secrets:
  ca_cert:
    file: ${EXTRA_CA_CERT:-../../dev/no-extra-ca.pem}
