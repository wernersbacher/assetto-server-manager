# Server Manager config of the multiserver setup: ONE Server Manager with two acServers (slots "a" and "b").
# All options: cmd/server-manager/config.example.yml
# Ports: web 8772, server a: UDP/TCP 9600 + HTTP 8081, server b: UDP/TCP 9601 + HTTP 8082. The acServer ports are set
# in "Server Options" of each server in the UI (they have to match the port mappings in compose.yaml).

steam:
  # the server is installed by the "install" service, nothing to do here. Keep install_path equal to the install_path
  # of the first server below.
  username:
  password:
  install_path: assetto-a
  executable_path: acServer
  force_update: false

# the acServers of this Server Manager. Each has its own working directory (cfg, results, ...); the content folders
# of all of them are the same volume, as content is managed through the first server.
servers:
  - id: a
    name: Server A
    install_path: assetto-a
  - id: b
    name: Server B
    install_path: assetto-b

http:
  hostname: 0.0.0.0:8772
  # CHANGE ME: a random secret
  session_key: change-me
  server_manager_base_URL: http://localhost:8772
  session_store_type: filesystem
  session_store_path: sessions
  tls:
    enabled: false
    cert_path: ""
    key_path: ""

monitoring:
  enabled: false

store:
  # one Server Manager: the default store is enough
  type: boltdb
  path: server_manager.db
  shared_data_path:
  scheduled_event_check_loop: 0s

accounts:
  # CHANGE ME: log in as "admin" with this password
  admin_password_override: admin

live_map:
  refresh_interval_ms: 500

server:
  audit_logging: true
  performance_mode: false
  dont_open_browser: true
  scan_content_folder_for_changes: false
  use_car_name_cache: true
  persist_mid_session_results: false
  plugins:

championships:
  recaptcha:
    site_key:
    secret_key:

lua:
  enabled: false
