# ACPitwall config of the multiserver setup: ONE ACPitwall with two acServers (slots "a" and "b").
# All options: cmd/acpitwall/config.example.yml
# Ports: the published ports are variables of compose.yaml (defaults and overrides: .env, see README.md). The acServer
# ports are passed into the container (environment: of compose.yaml) and ${NAME} below is expanded from the
# environment, so the ports are set in one place. They override (and lock) the ports in "Server Options".

steam:
  # the server is installed by the "install" service, nothing to do here. Keep install_path equal to the install_path
  # of the first server below.
  username:
  password:
  install_path: assetto-a
  executable_path: acServer
  force_update: false

# the acServers of this ACPitwall. Each has its own working directory (cfg, results, ...); the content folders
# of all of them are the same volume, as content is managed through the first server.
servers:
  - id: a
    name: Server A
    install_path: assetto-a
    ports:
      game: ${SERVER_A_PORT}
      http: ${SERVER_A_HTTP_PORT}
      content_manager_wrapper: ${SERVER_A_CM_PORT}
  - id: b
    name: Server B
    install_path: assetto-b
    ports:
      game: ${SERVER_B_PORT}
      http: ${SERVER_B_HTTP_PORT}
      content_manager_wrapper: ${SERVER_B_CM_PORT}

http:
  hostname: 0.0.0.0:8772
  # a random secret: set SM_SESSION_KEY in .env (e.g. openssl rand -hex 32); the default is only for a local try-out
  session_key: ${SM_SESSION_KEY:-devkey}
  # Used for links in chat messages, iCal events and the API: has to match the PUBLISHED host port of the web UI
  # (SM_WEB_PORT in .env, default 8772): set SM_BASE_URL in .env. hostname above is the container side and stays 8772.
  server_manager_base_URL: ${SM_BASE_URL:-http://localhost:8772}
  session_store_type: filesystem
  session_store_path: sessions
  tls:
    enabled: false
    cert_path: ""
    key_path: ""

monitoring:
  enabled: false

store:
  # one ACPitwall: the default store is enough
  type: boltdb
  path: server_manager.db
  shared_data_path:
  scheduled_event_check_loop: 0s

accounts:
  # log in as "admin" with this password: set SM_ADMIN_PASSWORD in .env (the default is only for a local try-out)
  admin_password_override: ${SM_ADMIN_PASSWORD:-admin}

live_map:
  refresh_interval_ms: 500

server:
  audit_logging: true
  performance_mode: false
  dont_open_browser: true
  scan_content_folder_for_changes: false
  use_car_name_cache: true
  persist_mid_session_results: false
  plugins:

championships:
  recaptcha:
    site_key:
    secret_key:

lua:
  enabled: false
