# ACPitwall config for local development (native via dev/run.ps1 and via compose.yaml).
# Two servers (slots) a and b, both on a copy of the fake install; the content of b is linked to that of a.
# Copied to cmd/server-manager/config.yml on first run (native) - edit that copy, not this file.
# See cmd/server-manager/config.example.yml for all options and their documentation.

steam:
  # no steamcmd install happens, because the fake install in ./assetto contains a "system" folder
  username:
  password:
  install_path: assetto
  executable_path: acServer
  force_update: false

# two servers in one ACPitwall, a and b: their working directories are fake installs (dev/assetto-seed). Content is
# managed through the first one; run.ps1 and compose.yaml link the content folder of b to it. Both servers start with the
# default acServer ports (9600/8081); change them in Server Options of a server before running both at once.
servers:
  - id: a
    name: Server A
    install_path: assetto
  - id: b
    name: Server B
    install_path: assetto-b

http:
  hostname: 0.0.0.0:8772
  session_key: local-dev-session-key-do-not-use-in-production
  server_manager_base_URL: http://localhost:8772
  session_store_type: cookie
  session_store_path: ""
  tls:
    enabled: false
    cert_path: ""
    key_path: ""

monitoring:
  enabled: false

store:
  type: boltdb
  path: server_manager.db
  shared_data_path:
  scheduled_event_check_loop: 0s

accounts:
  # log in as "admin" with this password
  admin_password_override: admin

live_map:
  refresh_interval_ms: 500

server:
  audit_logging: true
  performance_mode: false
  dont_open_browser: true
  scan_content_folder_for_changes: false
  use_car_name_cache: true
  persist_mid_session_results: false
  plugins:

championships:
  recaptcha:
    site_key:
    secret_key:

lua:
  enabled: false
